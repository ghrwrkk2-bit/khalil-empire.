<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🏆 شات حسوني</title>

<style>

/* =========================
   الأساس
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

:root{
    --blue:#1d58c9;
    --blue2:#1747a5;
    --dark:#252525;
    --dark2:#1d1d1d;
    --gold:#ffd000;
    --light:#e9edf2;
    --border:#d4d9df;
}

body{
    background:#dfe4ea;
    color:#222;
    overflow:hidden;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:none;
}

.hidden{
    display:none !important;
}


/* =========================
   شاشة الدخول
========================= */

#authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
    radial-gradient(
        circle at top,
        #296f9d,
        #181818 55%
    );
    padding:20px;
}

.authBox{
    width:100%;
    max-width:430px;
    background:#262626;
    padding:25px;
    border-radius:25px;
    color:white;
    box-shadow:0 20px 50px #000;
}

.authLogo{
    text-align:center;
    font-size:30px;
    color:#ffd000;
    font-weight:bold;
    margin-bottom:10px;
}

.authSub{
    text-align:center;
    color:#aaa;
    margin-bottom:20px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.tabs button{
    flex:1;
    padding:12px;
    background:#3b3b3b;
    color:white;
    border-radius:10px;
}

.tabs button.active{
    background:var(--blue);
}

.authForm{
    display:none;
}

.authForm.active{
    display:block;
}

.authForm input,
.authForm select{
    width:100%;
    margin-bottom:10px;
    padding:14px;
    border-radius:12px;
    border:1px solid #555;
    background:#171717;
    color:white;
    outline:none;
}

.authBtn{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:var(--blue);
    color:white;
    font-size:16px;
    font-weight:bold;
}


/* =========================
   التطبيق
========================= */

#app{
    display:none;
    height:100vh;
    background:#e4e8ed;
    overflow:hidden;
}


/* =========================
   الشريط العلوي الرئيسي
========================= */

.header{
    height:68px;
    background:#272727;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #333;
}

.headerLogo{
    color:var(--gold);
    font-size:24px;
    font-weight:bold;
    white-space:nowrap;
}

.headerButtons{
    display:flex;
    gap:10px;
}

.headerButtons button{
    min-width:72px;
    height:48px;
    background:#353535;
    color:white;
    padding:8px 12px;
    border-radius:15px;
    font-size:14px;
}

.headerButtons button:hover{
    background:#444;
}

#adminButton{
    background:#5b3a00;
    color:#ffd000;
}


/* =========================
   شريط الأزرار العلوي
========================= */

.topNav{
    height:96px;
    background:#202020;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:6px 8px;
    border-bottom:1px solid #333;
}

.topNav button{
    flex:1;
    max-width:120px;
    height:82px;
    background:transparent;
    color:#eee;
    border-radius:14px;
    font-size:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.topNav button:hover,
.topNav button.active{
    background:#303030;
}

.topIcon{
    font-size:27px;
    line-height:1;
}

.topNav .gold{
    color:var(--gold);
}


/* =========================
   جسم التطبيق
========================= */

.appBody{
    height:calc(100vh - 68px - 96px - 86px);
    display:flex;
    background:#e5e8ec;
    overflow:hidden;
}


/* =========================
   الغرف
========================= */

.rooms{
    width:220px;
    background:#f0f2f5;
    border-left:1px solid #d3d8df;
    overflow-y:auto;
    padding-bottom:10px;
}

.roomsTitle{
    padding:18px 15px;
    font-size:19px;
    font-weight:bold;
    background:white;
    border-bottom:1px solid #ddd;
}

.roomItem{
    width:100%;
    padding:14px 15px;
    background:transparent;
    text-align:right;
    border-bottom:1px solid #e0e4e8;
    color:#222;
    font-size:15px;
}

.roomItem:hover{
    background:#e1e7ee;
}

.roomItem.active{
    background:var(--blue);
    color:white;
    font-weight:bold;
}


/* =========================
   منطقة الشات
========================= */

.chatArea{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#dfe4ea;
}


/* =========================
   اسم الغرفة
========================= */

.roomBar{
    height:66px;
    background:#f7f8fa;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #c9d0d8;
}

.roomName{
    font-weight:bold;
    font-size:23px;
}

.roomBar button{
    background:var(--blue);
    color:white;
    padding:10px 15px;
    border-radius:12px;
}


/* =========================
   منطقة الرسائل
========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:10px 14px 15px;
    background:
    linear-gradient(
        90deg,
        rgba(255,255,255,.2),
        rgba(255,255,255,.45),
        rgba(255,255,255,.2)
    );
}

.message{
    position:relative;
    background:rgba(255,255,255,.62);
    border-bottom:1px solid #d2d7dc;
    padding:10px 72px 12px 15px;
    min-height:66px;
    margin-bottom:4px;
    overflow:hidden;
}

.message:hover{
    background:#f7f9fb;
}

.messageAvatar{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    background:#84909b;
    position:absolute;
    right:10px;
    top:10px;
    border:2px solid white;
    box-shadow:0 2px 7px #aaa;
}

.messageTop{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:6px;
    min-height:28px;
}

.messageName{
    font-size:18px;
    font-weight:bold;
}

.messageTime{
    color:#8b9197;
    font-size:11px;
    margin-right:auto;
}

.rankBadge{
    display:inline-block;
    margin-right:5px;
    padding:3px 8px;
    border-radius:8px;
    background:#343434;
    color:white;
    font-size:11px;
    vertical-align:middle;
}

.ownerRank{
    background:
    linear-gradient(
        45deg,
        #9d6200,
        #ffd700,
        #fff3a3,
        #c58400
    );
    color:#4d3100;
    font-weight:bold;
    box-shadow:0 0 8px #ffd700;
}

.messageText{
    font-size:19px;
    line-height:1.8;
    word-break:break-word;
}

.messageText.ownerMessage{
    font-weight:bold;
}


/* =========================
   المتواجدون
========================= */

.members{
    width:220px;
    background:#e9edf1;
    border-right:1px solid #d0d6dd;
    overflow-y:auto;
}

.membersTitle{
    height:62px;
    background:#f8f9fa;
    padding:16px 14px;
    font-size:18px;
    font-weight:bold;
    position:sticky;
    top:0;
    z-index:2;
    border-bottom:1px solid #d3d8df;
}

.member{
    position:relative;
    min-height:70px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 10px;
    border-bottom:1px solid #d7dce1;
    background:#eef1f4;
}

.member:hover{
    background:#fff;
}

.memberAvatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#8b969f;
    object-fit:cover;
    border:2px solid white;
    box-shadow:0 2px 5px #aaa;
}

.memberData{
    flex:1;
    min-width:0;
}

.memberName{
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================
   لوحة المايك
========================= */

.voicePanel{
    position:fixed;
    z-index:30;
    top:135px;
    left:50%;
    transform:translateX(-50%);
    width:460px;
    max-width:65%;
    min-height:135px;
    background:rgba(244,246,248,.96);
    border-radius:0 0 22px 22px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
    border-bottom:5px solid #111;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:14px 18px 22px;
}

.voiceUser{
    text-align:center;
    min-width:72px;
}

.voiceCircle{
    width:78px;
    height:78px;
    border-radius:50%;
    background:#080808;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:37px;
    margin:auto;
    border:4px solid #d4d9de;
    box-shadow:0 3px 9px #999;
}

.voiceUser small{
    display:block;
    margin-top:5px;
    font-size:15px;
}

.voiceSettings{
    position:absolute;
    bottom:-31px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
}

.voiceSettings button{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#1747a5;
    color:white;
    font-size:24px;
    box-shadow:0 3px 8px #777;
}


/* =========================
   لوحة الكتابة
========================= */

.writeBox{
    height:86px;
    background:#f7f8fa;
    border-top:1px solid #cbd1d8;
    display:flex;
    align-items:center;
    gap:9px;
    padding:10px 12px;
}

.writeTools{
    display:flex;
    gap:6px;
}

.toolBtn{
    width:44px;
    height:44px;
    border-radius:50%;
    background:transparent;
    color:#5e6770;
    font-size:23px;
}

.toolBtn:hover{
    background:#e2e6eb;
}

.writeBox input{
    flex:1;
    min-width:0;
    height:54px;
    padding:0 18px;
    border-radius:28px;
    border:1px solid #d0d6dd;
    background:#eef0f3;
    outline:none;
    font-size:17px;
}

.writeBox input:focus{
    border-color:var(--blue);
    background:white;
}

.sendBtn{
    width:66px;
    height:66px;
    border-radius:50%;
    background:#252525;
    color:white;
    font-size:30px;
    flex-shrink:0;
}

.sendBtn:hover{
    background:#111;
}


/* =========================
   الشريط السفلي
========================= */

.bottomNav{
    height:86px;
    background:#252525;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-around;
    border-top:1px solid #333;
}

.bottomNav button{
    flex:1;
    height:82px;
    max-width:150px;
    background:transparent;
    color:#eee;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:14px;
}

.bottomNav button:hover,
.bottomNav button.active{
    background:#303030;
}

.bottomIcon{
    font-size:29px;
    line-height:1;
}


/* =========================
   النوافذ
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:100;
    padding:15px;
    overflow:auto;
}

.modalBox{
    max-width:700px;
    margin:30px auto;
    background:#f7f9fb;
    border-radius:20px;
    padding:20px;
    box-shadow:0 15px 40px #000;
}

.modalHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.closeBtn{
    background:#d33;
    color:white;
    padding:9px 14px;
    border-radius:10px;
}

.panelSection{
    background:#edf2f6;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.panelSection h3{
    margin-bottom:10px;
}

.panelSection input,
.panelSection select{
    width:100%;
    padding:11px;
    margin-bottom:8px;
    border:1px solid #ccc;
    border-radius:8px;
}

.panelSection button{
    padding:10px 15px;
    background:var(--blue);
    color:white;
    border-radius:8px;
}

.adminUser{
    background:white;
    padding:12px;
    margin-bottom:7px;
    border-radius:12px;
}

.adminActions{
    margin-top:8px;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.adminActions button{
    padding:7px 9px;
    font-size:12px;
}

.danger{
    background:#d33 !important;
}

.warning{
    background:#d98200 !important;
}

.success{
    background:#198754 !important;
}


/* =========================
   البروفايل
========================= */

.profileCover{
    height:130px;
    border-radius:15px;
    background:
    linear-gradient(
        135deg,
        #1d91c2,
        #333
    );
    background-size:cover;
    background-position:center;
}

.profileAvatar{
    width:100px;
    height:100px;
    border-radius:50%;
    border:5px solid white;
    margin-top:-45px;
    margin-right:20px;
    object-fit:cover;
    background:#777;
}

.profileName{
    font-size:22px;
    font-weight:bold;
    margin:10px 20px;
}

.profileStats{
    padding:15px;
    display:flex;
    justify-content:space-around;
    text-align:center;
}

.profileEdit input{
    width:100%;
    padding:11px;
    margin:5px 0;
    border:1px solid #ccc;
    border-radius:9px;
}


/* =========================
   الجوال
========================= */

@media(max-width:900px){

    .rooms{
        display:none;
    }

    .members{
        width:72px;
    }

    .membersTitle{
        font-size:0;
        text-align:center;
        padding:12px 0;
    }

    .membersTitle::before{
        content:"👥";
        font-size:25px;
    }

    .member{
        padding:8px;
        justify-content:center;
    }

    .memberData{
        display:none;
    }

    .memberAvatar{
        width:48px;
        height:48px;
    }

    .voicePanel{
        top:164px;
        width:455px;
        max-width:74%;
    }

    .header{
        padding:0 10px;
    }

    .headerLogo{
        font-size:19px;
    }

    .headerButtons button{
        min-width:auto;
        padding:8px 10px;
        font-size:12px;
    }

    .topNav{
        overflow-x:auto;
        justify-content:flex-start;
    }

    .topNav button{
        min-width:78px;
        font-size:11px;
    }

    .topIcon{
        font-size:24px;
    }

    .bottomNav{
        overflow-x:auto;
        justify-content:flex-start;
    }

    .bottomNav button{
        min-width:92px;
        font-size:11px;
    }

    .bottomIcon{
        font-size:25px;
    }

    .message{
        padding-right:68px;
    }

}


@media(max-width:520px){

    .header{
        height:62px;
    }

    .headerLogo{
        font-size:17px;
    }

    .headerButtons{
        gap:5px;
    }

    .headerButtons button{
        height:43px;
        padding:6px 8px;
        border-radius:12px;
    }

    .topNav{
        height:94px;
    }

    .appBody{
        height:calc(100vh - 62px - 94px - 82px);
    }

    .bottomNav{
        height:82px;
    }

    .bottomNav button{
        height:78px;
    }

    .voicePanel{
        top:128px;
        min-height:120px;
        padding:12px 8px 20px;
    }

    .voiceCircle{
        width:66px;
        height:66px;
        font-size:31px;
    }

    .voiceUser{
        min-width:55px;
    }

    .voiceUser small{
        font-size:12px;
    }

    .roomName{
        font-size:19px;
    }

    .messageText{
        font-size:16px;
    }

    .writeBox{
        height:78px;
        padding:8px;
        gap:5px;
    }

    .writeTools{
        display:none;
    }

    .writeBox input{
        height:50px;
    }

    .sendBtn{
        width:55px;
        height:55px;
        font-size:24px;
    }

    .members{
        width:62px;
    }

    .memberAvatar{
        width:42px;
        height:42px;
    }

}

</style>

</head>

<body>


<!-- =========================
     شاشة الدخول
========================= -->

<div id="authScreen">

<div class="authBox">

<div class="authLogo">
🏆 شات حسوني
</div>

<div class="authSub">
دردشة عربية متزامنة
</div>


<div class="tabs">

<button
class="active"
id="loginTab"
onclick="showAuth('login')">
دخول
</button>

<button
id="registerTab"
onclick="showAuth('register')">
تسجيل
</button>

<button
id="guestTab"
onclick="showAuth('guest')">
👤 زائر
</button>

</div>


<div
id="loginForm"
class="authForm active">

<input
id="loginEmail"
type="email"
placeholder="البريد الإلكتروني">

<input
id="loginPassword"
type="password"
placeholder="كلمة المرور">

<button
class="authBtn"
onclick="login()">
تسجيل الدخول
</button>

</div>


<div
id="registerForm"
class="authForm">

<input
id="registerName"
placeholder="اسم المستخدم">

<input
id="registerEmail"
type="email"
placeholder="البريد الإلكتروني">

<input
id="registerPassword"
type="password"
placeholder="كلمة المرور">

<button
class="authBtn"
onclick="register()">
إنشاء حساب
</button>

</div>


<div
id="guestForm"
class="authForm">

<input
id="guestName"
placeholder="الاسم المستعار">

<input
id="guestAge"
type="number"
min="1"
max="120"
placeholder="العمر">

<select id="guestGender">

<option value="">
اختر الجنس
</option>

<option value="ذكر">
ذكر
</option>

<option value="أنثى">
أنثى
</option>

</select>

<button
class="authBtn"
onclick="guestLogin()">
👤 دخول كزائر
</button>

</div>

</div>

</div>


<!-- =========================
     التطبيق
========================= -->

<div id="app">


<!-- الشريط العلوي -->

<div class="header">

<div class="headerLogo">
🏆 شات حسوني
</div>

<div class="headerButtons">

<button onclick="openProfile()">
👤 بروفايلي
</button>

<button
id="adminButton"
style="display:none"
onclick="openAdmin()">
👑 التحكم
</button>

<button onclick="logout()">
خروج
</button>

</div>

</div>


<!-- أزرار علوية -->

<nav class="topNav">

<button onclick="refreshChat()">
<span class="topIcon gold">⟳</span>
<span>تحديث</span>
</button>

<button onclick="showFeature('الكبار')">
<span class="topIcon gold">🔻</span>
<span>الكبار</span>
</button>

<button onclick="showFeature('الأثرياء')">
<span class="topIcon gold">👑</span>
<span>الأثرياء</span>
</button>

<button onclick="openProfile()">
<span class="topIcon">✉️</span>
<span>رسالة</span>
</button>

<button onclick="showFeature('الطلبات')">
<span class="topIcon">👤➕</span>
<span>طلب</span>
</button>

<button onclick="showFeature('الإشعارات')">
<span class="topIcon">🔔</span>
<span>إشعار</span>
</button>

<button onclick="showFeature('الإعدادات')">
<span class="topIcon">👤</span>
<span>إعدادات</span>
</button>

</nav>


<!-- لوحة المايك -->

<div class="voicePanel">

<div class="voiceUser">
<div class="voiceCircle">🎙️</div>
<small>1</small>
</div>

<div class="voiceUser">
<div class="voiceCircle">🎙️</div>
<small>2</small>
</div>

<div class="voiceUser">
<div class="voiceCircle">🎙️</div>
<small>3</small>
</div>

<div class="voiceUser">
<div class="voiceCircle">🎙️</div>
<small>4</small>
</div>

<div class="voiceSettings">

<button onclick="showFeature('إعدادات المايك')">
⚙️
</button>

<button onclick="showFeature('رفع اليد')">
↕️
</button>

</div>

</div>


<!-- الجسم -->

<div class="appBody">


<!-- الغرف -->

<aside class="rooms">

<div class="roomsTitle">
💬 الغرف
</div>

<div id="roomsList"></div>

</aside>


<!-- الشات -->

<main class="chatArea">


<div class="roomBar">

<div
id="currentRoomName"
class="roomName">
💬 الغرفة العامة
</div>

<button
id="createRoomButton"

);

);

window.giftRank =
async function(){

const uid =
document
.getElementById(
"giftUser"
)
.value;


const rank =
document
.getElementById(
"giftRank"
)
.value;


if(
!uid
){

return;

}


try{

await updateDoc(

doc(
db,
"users",
uid
),

{

rank:
rank

}

);


alert(
"تم إهداء الرتبة"
);

}
catch(error){

alert(
"تعذر إهداء الرتبة"
);

}

};

window.banUser =

}

);

};

/* =========================
   حماية النصوص
========================= */

function escapeHtml(text){

return String(text || "")

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
