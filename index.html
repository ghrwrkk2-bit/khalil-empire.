<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شات حسوني - النسخة الإمبراطورية المطورة الكاملة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- مكتبات Firebase SDK المتوافقة -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

    <style>
        :root { 
            --gold: #ffd700; 
            --king-grad: linear-gradient(145deg, #ffd700, #b8860b); 
            --dark-bg: #0a0a0a; 
            --card-bg: #121212; 
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100vh; background: var(--dark-bg); color: #fff; overflow: hidden; }

        /* واجهة تسجيل الدخول */
        #welcomeOverlay {
            display: none; 
            position: fixed; 
            inset: 0; 
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)), url('https://i.ibb.co/3yk56PZ9/IMG-20260228-WA0001.jpg') center center/cover no-repeat; 
            z-index: 9999999; 
            align-items: center; 
            justify-content: center; 
            padding: 15px;
        }

        /* الشريط العلوي */
        .header-bar { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(15, 15, 15, 0.98); display: flex; align-items: center; justify-content: space-around; z-index: 1000; border-bottom: 2px solid var(--gold); padding: 0 5px; }
        .header-btn { color: #fff; font-size: 11px; text-align: center; cursor: pointer; flex: 1; position: relative; }
        .header-btn i { display: block; font-size: 18px; color: var(--gold); margin-bottom: 2px; }

        .header-user-bg-btn {
            width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--gold);
            background-size: cover; background-position: center; cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5); display: flex; align-items: center;
            justify-content: center; position: relative; background-color: #222; flex-shrink: 0;
        }

        /* تصميم المايكات */
        .mics-wrapper {
            position: fixed; top: 65px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 999; transition: all 0.3s ease;
        }
        .mics-container-floating { 
            background: rgba(220, 225, 230, 0.88); backdrop-filter: blur(8px);
            border-radius: 20px; padding: 6px 14px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.4);
        }
        .floating-mic-circle {
            width: 44px; height: 44px; border-radius: 50%; background: #1877f2;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 16px; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            position: relative; background-size: cover; background-position: center;
        }
        .floating-mic-circle .mic-num-sub {
            font-size: 10px; margin-top: 1px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 0 4px; border-radius: 4px;
        }
        .floating-mic-circle.occupied i { display: none; }
        .mic-control-btn {
            width: 32px; height: 32px; border-radius: 50%; background: #0062e0; color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer;
        }
        .mics-toggle-arrow-btn {
            background: #1877f2; color: white; border: none; width: 32px; height: 20px;
            border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 12px; margin-top: -1px;
        }

        #chatBox { height: calc(100vh - 185px); overflow-y: auto; padding: 140px 15px 85px; display: flex; flex-direction: column; gap: 12px; background: #0f0f0f url('https://i.ibb.co/6wXbYm2/butterflies.jpg') center center/cover no-repeat; }
        
        .msg-wrap { display: flex; flex-direction: column; align-self: flex-start; width: 95%; max-width: 420px; background: rgba(18, 22, 28, 0.94); padding: 12px; border-radius: 18px; border: 1.5px solid rgba(255, 215, 0, 0.4); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .msg-wrap.system-gold-gift {
            background: linear-gradient(135deg, rgba(255,215,0,0.25), rgba(184,134,11,0.35)) !important;
            border: 2px solid #ffd700 !important; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6) !important;
            width: 100% !important; max-width: 100% !important; text-align: center;
        }
        .msg-wrap.bot-msg-wrap {
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.25), rgba(41, 128, 185, 0.35)) !important;
            border: 2px solid #3498db !important; box-shadow: 0 0 15px rgba(52, 152, 219, 0.6) !important;
            width: 100% !important; max-width: 100% !important; text-align: center;
        }
        
        .msg-header { display: flex; align-items: center; gap: 10px; width: 100%; position: relative; }
        .pfp-main-frame { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gold); box-shadow: 0 0 8px var(--gold); display: flex; align-items: center; justify-content: center; background: #000; flex-shrink: 0; }
        .pfp-main { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; cursor: pointer; }
        
        .rank-standalone-icon {
            font-size: 16px; display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; background: rgba(0, 0, 0, 0.5); border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.3); flex-shrink: 0;
        }

        .king-name-container {
            display: inline-flex; align-items: center; background: linear-gradient(145deg, #1e1e1e, #111111);
            border: 1px solid var(--gold); padding: 4px 12px; border-radius: 20px;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.2); cursor: pointer;
        }
        .king-name-tag { font-size: 13px; font-weight: bold; text-shadow: 0 0 3px rgba(255,215,0,0.3); }
        .msg-text { color: #fff; font-size: 14px; line-height: 1.5; margin-top: 8px; padding-right: 5px; word-break: break-word; }
        .msg-time { font-size: 10px; color: #aaa; align-self: flex-end; margin-top: 4px; }

        /* شريط الإدخال السفلي */
        .input-section { position: fixed; bottom: 60px; width: 100%; height: 65px; background: #111; padding: 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #222; z-index: 1000; }
        .chat-input { flex: 1; background: #1a1a1a; border: 1px solid var(--gold); color: #fff; height: 42px; border-radius: 20px; padding: 0 15px; outline: none; }
        
        .send-btn-arrow { 
            background: var(--king-grad); border: none; width: 42px; height: 42px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: #000; font-size: 16px; cursor: pointer; flex-shrink: 0;
            box-shadow: 0 0 8px rgba(255,215,0,0.4);
        }
        .right-input-btn { font-size: 20px; color: var(--gold); cursor: pointer; padding: 4px; flex-shrink: 0; }

        .footer-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #111; display: flex; align-items: center; justify-content: space-around; border-top: 2px solid var(--gold); z-index: 1000; }
        .f-btn { text-align: center; font-size: 10px; color: #fff; cursor: pointer; flex: 1; padding: 5px 0; }
        .f-btn i { display: block; font-size: 16px; margin-bottom: 2px; color: #fff; }

        .king-card { background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); width: 100%; max-width: 520px; max-height: 95vh; border: 3px solid var(--gold); border-radius: 20px; padding: 20px; overflow-y: auto; box-shadow: 0 0 25px rgba(255, 215, 0, 0.5); display: flex; flex-direction: column; }
        
        .btn-row { display: flex; justify-content: center; gap: 8px; margin: 15px 0; width: 100%; }
        .row-btn { flex: 1; padding: 11px 5px; font-size: 12px; background: #1c1c1c; border: 1px solid var(--gold); color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
        .row-btn.active { background: var(--king-grad); color: #000; }
        
        .branch-content { display: none; background: #161616; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; }
        .form-control { width: 100%; padding: 11px; margin-bottom: 11px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; text-align: right; }
        .form-select { width: 100%; padding: 11px; margin-bottom: 11px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; text-align: right; }
        .file-input-label { display: block; width: 100%; padding: 11px; margin-bottom: 11px; background: #2a2a2a; border: 1px dashed var(--gold); color: var(--gold); border-radius: 8px; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold; }
        .file-input-hidden { display: none; }

        .feature-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100000; align-items: center; justify-content: center; padding: 15px; }
        .feature-card { background: #121212; width: 100%; max-width: 460px; border: 2px solid var(--gold); border-radius: 15px; padding: 20px; max-height: 85vh; overflow-y: auto; position: relative; }
        .half-screen-modal { display: none; position: fixed; bottom: 60px; left: 0; width: 100%; height: 50vh; background: rgba(14, 14, 14, 0.98); border-top: 3px solid var(--gold); z-index: 999; overflow-y: auto; padding: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }

        .menu-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #fff; justify-content: space-between; }
        .menu-item:hover { background: rgba(255,255,255,0.03); }

        .room-card-box {
            display: flex; align-items: center; justify-content: space-between;
            background: #1a1a1a; border: 1px solid var(--gold); border-radius: 12px;
            padding: 12px; margin-bottom: 8px; cursor: pointer; transition: 0.2s;
        }
        .room-card-box:hover { background: rgba(255,215,0,0.1); }

        .profile-card-wrapper { text-align: center; color: #fff; position: relative; }
        .profile-card-cover { width: 100%; height: 150px; border-radius: 12px; object-fit: cover; border: 1px solid var(--gold); }
        .profile-card-pfp { width: 95px; height: 95px; border-radius: 50%; border: 3px solid var(--gold); margin-top: -50px; object-fit: cover; background: #111; position: relative; z-index: 2; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .profile-edit-pencil { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); border: 1px solid var(--gold); color: var(--gold); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
        
        .online-user-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; margin-bottom: 6px; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid #222; }
        .online-user-left { display: flex; align-items: center; gap: 10px; }
        .online-user-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold); }
        .online-user-bg-btn { font-size: 14px; color: var(--gold); cursor: pointer; padding: 4px 8px; background: rgba(0,0,0,0.5); border-radius: 6px; border: 1px solid rgba(255,215,0,0.3); }
        
        .private-chat-box { display: flex; flex-direction: column; height: 320px; background: #0a0a0a; border: 1px solid var(--gold); border-radius: 10px; padding: 10px; overflow: hidden; }
        .private-msg-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .private-msg-bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 13px; word-break: break-word; }
        .private-msg-mine { align-self: flex-end; background: var(--gold); color: #000; font-weight: bold; }
        .private-msg-other { align-self: flex-start; background: #222; color: #fff; border: 1px solid #444; }

        .plus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; }
        .plus-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 12px 5px; cursor: pointer; transition: all 0.2s ease; }
        .plus-item:hover { background: rgba(255,215,0,0.15); }
        .plus-item i { font-size: 24px; color: var(--gold); display: block; margin-bottom: 5px; }
        .plus-item span { font-size: 12px; color: #fff; font-weight: bold; }

        .emoji-picker-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; font-size: 22px; text-align: center; max-height: 200px; overflow-y: auto; padding: 5px; }
        .emoji-picker-item { cursor: pointer; padding: 5px; border-radius: 5px; }
        .emoji-picker-item:hover { background: rgba(255,215,0,0.2); }

        .store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 250px; overflow-y: auto; }
        .store-item { background: #1a1a1a; border: 1px solid var(--gold); border-radius: 10px; padding: 10px; text-align: center; }

        #hiddenAudioNode { display: none; }
        #youtubeVideoFrameContainer { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
        #liveAudioBroadcastContainer { display: none; }
    </style>
</head>
<body>

<audio id="hiddenAudioNode" loop></audio>
<div id="youtubeVideoFrameContainer"></div>
<div id="liveAudioBroadcastContainer"></div>
<input type="file" id="mediaUploadInput" style="display:none" accept="video/*,image/*,audio/*,.pdf,.doc,.docx" onchange="ui.handleMediaUpload(this)">

<!-- واجهة تسجيل الدخول -->
<div id="welcomeOverlay">
    <div class="king-card">
        <h2 style="text-align:center; color:var(--gold); margin:0 0 5px;">شات حسوني - النسخة الإمبراطورية</h2>
        <p style="text-align:center; font-size:12px; margin:0 0 10px; color:#aaa;">أهلاً وسهلاً بكم في شات عربي دردشة عربية محمية بالكامل</p>
        
        <div class="btn-row">
            <button class="row-btn" id="btn_b1" onclick="ui.switchBranch('b1')">دخول زائر</button>
            <button class="row-btn" id="btn_b2" onclick="ui.switchBranch('b2')">دخول عضوية</button>
            <button class="row-btn" id="btn_b3" onclick="ui.switchBranch('b3')">سجل الآن</button>
        </div>

        <div id="b1" class="branch-content">
            <input type="text" id="vName" class="form-control" placeholder="الاسم المستعار للزائر (مطلوب)...">
            <select id="vAge" class="form-select">
                <option value="">اختر العمر (مطلوب)...</option>
                <script>
                    for(let i=15; i<=100; i++) { document.write(`<option value="${i}">${i}</option>`); }
                </script>
            </select>
            <select id="vGender" class="form-select">
                <option value="">اختر الجنس (مطلوب)...</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
            <button class="row-btn active" style="width:100%; border-radius:8px; padding:12px;" onclick="ui.loginAsGuest()">دخول الآن كـ زائر</button>
        </div>

        <div id="b2" class="branch-content">
            <input type="text" id="logUser" class="form-control" placeholder="الاسم المستعار أو البريد الإلكتروني...">
            <input type="password" id="logPass" class="form-control" placeholder="كلمة المرور الحالية...">
            <button class="row-btn active" style="width:100%; border-radius:8px; padding:12px;" onclick="ui.loginAsRegistered(false)">تسجيل الدخول الفوري</button>
        </div>

        <div id="b3" class="branch-content">
            <input type="text" id="rName" class="form-control" placeholder="الاسم المستعار الجديد...">
            <input type="email" id="rEmail" class="form-control" placeholder="البريد الإلكتروني المعتمد...">
            <input type="password" id="rPass" class="form-control" placeholder="كلمة المرور السرية...">
            <button class="row-btn active" style="width:100%; border-radius:8px; padding:12px;" onclick="ui.loginAsRegistered(true)">إتمام التسجيل ودخول</button>
        </div>
    </div>
</div>

<!-- الشريط العلوي -->
<div class="header-bar">
    <div class="header-user-bg-btn" id="userHeaderBgIcon" title="خلفيتك الحالية" onclick="ui.openProfileHeaderBgMenu()">
        <i class="fas fa-user-circle" style="font-size:20px; color:var(--gold);" id="userHeaderBgDefaultIcon"></i>
    </div>

    <div class="header-btn" onclick="ui.openNotificationsList()"><i class="fas fa-bell"></i>إشعار</div>
    <div class="header-btn" onclick="ui.openReportsList()"><i class="fas fa-flag"></i>بلاغ</div>
    <div class="header-btn" onclick="ui.openPrivateConversationsList()"><i class="fas fa-comments"></i>الخاص</div>
    <div class="header-btn" onclick="ui.openVIPList('الكبار')"><i class="fas fa-crown"></i>الكبار</div>
    <div class="header-btn" onclick="ui.openVIPList('الأثرياء')"><i class="fas fa-gem"></i>الأثرياء</div>
    <div class="header-btn" onclick="ui.openSideThreeLinesMenu()"><i class="fas fa-bars"></i>خيارات</div>
</div>

<!-- حاوية المايكات -->
<div class="mics-wrapper" id="micsWrapper">
    <div class="mics-container-floating" id="micsContainer">
        <div class="floating-mic-circle" id="mic_1" onclick="ui.clickMicSlot(1)"><i class="fas fa-microphone"></i><span class="mic-num-sub" id="micName_1">1</span></div>
        <div class="floating-mic-circle" id="mic_2" onclick="ui.clickMicSlot(2)"><i class="fas fa-microphone"></i><span class="mic-num-sub" id="micName_2">2</span></div>
        <div class="floating-mic-circle" id="mic_3" onclick="ui.clickMicSlot(3)"><i class="fas fa-microphone"></i><span class="mic-num-sub" id="micName_3">3</span></div>
        <div class="floating-mic-circle" id="mic_4" onclick="ui.clickMicSlot(4)"><i class="fas fa-microphone"></i><span class="mic-num-sub" id="micName_4">4</span></div>
        <div class="mic-control-btn" onclick="ui.openMicSettingsMenu()"><i class="fas fa-cog"></i></div>
    </div>
    <button class="mics-toggle-arrow-btn" onclick="ui.toggleMicsVisibility()"><i class="fas fa-chevron-up" id="micsToggleIcon"></i></button>
</div>

<div id="chatBox"></div>

<!-- شريط الإدخال السفلي -->
<div class="input-section">
    <button class="send-btn-arrow" onclick="ui.sendMessage()" title="إرسال"><i class="fas fa-paper-plane"></i></button>
    <input type="text" id="msgInp" class="chat-input" placeholder="اكتب رسالتك العامة هنا..." onkeypress="if(event.key==='Enter') ui.sendMessage()">
    
    <div class="right-input-btn" onclick="ui.openEmojiPicker()" title="إيموجيات"><i class="fas fa-smile"></i></div>
    <div class="right-input-btn" onclick="ui.clickMicSlot(1)" title="صوت المايك"><i class="fas fa-microphone"></i></div>
    <div class="right-input-btn" onclick="ui.openPlusPlusMenu()" title="المزيد"><i class="fas fa-plus-circle"></i></div>
</div>

<!-- الشريط السفلي للتنقل -->
<div class="footer-nav">
    <div class="f-btn" onclick="ui.toggleOnlineUsers()"><i class="fas fa-users"></i>المتواجدين</div>
    <div class="f-btn" onclick="ui.openRoomsManager()"><i class="fas fa-door-open"></i>الغرف</div>
    <div class="f-btn" onclick="ui.refreshChatWindowOnly()"><i class="fas fa-sync-alt"></i>تحديث</div>
    <div class="f-btn" onclick="ui.openStoreModal()"><i class="fas fa-store" style="color:#2ecc71"></i>المتجر</div>
    <div class="f-btn" id="authBtn" onclick="ui.showAuthBranchDirect()"><i class="fas fa-key" style="color:var(--gold)"></i><span>المفتاح الملكي</span></div>
    <div class="f-btn" onclick="ui.openSideThreeLinesMenu()"><i class="fas fa-cogs"></i>الخيارات</div>
</div>

<div id="onlineUsersHalfModal" class="half-screen-modal">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--gold); padding-bottom:5px; margin-bottom:10px;">
        <span style="color:var(--gold); font-weight:bold;"><i class="fas fa-users"></i> قائمة المتواجدين</span>
        <button onclick="ui.toggleOnlineUsers()" style="background:#c0392b; border:none; color:#fff; border-radius:50%; width:28px; height:28px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center;">X</button>
    </div>
    <div id="onlineUsersListBody"></div>
</div>

<div id="featureModal" class="feature-modal">
    <div class="feature-card">
        <h3 id="featureModalTitle" style="color:var(--gold); text-align:center; margin-top:0;"></h3>
        <div id="featureModalBody"></div>
        <button onclick="document.getElementById('featureModal').style.display='none'" class="row-btn active" style="width:100%; margin-top:15px; border-radius:8px; background:#c0392b; color:#fff;">إغلاق النافذة</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAFjspoGwJJeowjEZrcmJCO99iiTcBR5Is",
        authDomain: "hassouni-chat-51234.firebaseapp.com",
        projectId: "hassouni-chat-51234",
        storageBucket: "hassouni-chat-51234.firebasestorage.app",
        messagingSenderId: "519124989339",
        appId: "1:519124989339:web:4d00b1ecfd60fe1ed89d3e",
        measurementId: "G-28KGXQ7B1T"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        firebase.firestore().enablePersistence().catch(()=>{});
    }
    const db = firebase.firestore();
    const storage = firebase.storage();
    const FieldValue = firebase.firestore.FieldValue;
    window.usersCache = {};
    window.micPeers = {};

              .orderBy("timestamp", "asc")
              .limitToLast(100)
              .onSnapshot((snapshot) => {

                          ui.renderBotMsg(mData.text);

        listenToActiveMics: () => {
            const roomDocId = window.currentRoom.replace(/\s+/g, '_');
            const unsub = db.collection("rooms").doc(roomDocId).collection("mics").onSnapshot(async (snapshot) => {
                const active = {};
                snapshot.forEach(doc => active[doc.data().micNum] = doc.data());
                for(let i=1;i<=4;i++){
                    const slot=document.getElementById(`mic_${i}`);
                    const name=document.getElementById(`micName_${i}`);
                    const data=active[i];
                    slot.classList.toggle('occupied', !!data);
                    slot.style.backgroundImage=data && data.userImg ? `url('${data.userImg}')` : 'none';
                    name.innerText=data ? data.userName : String(i);
                    if(data && data.userId !== window.currentUser?.uid) ui.ensureMicPeer(data);
                }
                for(const key of Object.keys(window.micPeers)){
                    const peer=window.micPeers[key];
                    if(!snapshot.docs.some(d=>d.data().userId===peer.remoteUid)){ ui.closeMicPeer(key); }
                }
            });
            window.activeListeners.push(unsub);
        },
        listenOnlineUsersRealtime: () => {
            let unsub = db.collection("users").onSnapshot((snap) => {
                window.usersCache = {};
                const list=[];

                    const uData={uid:doc.id,...doc.data()};
                    window.usersCache[uData.uid]=uData;
                    if(uData.isOnline && !uData.isBanned) list.push(uData);
                });
                list.sort((a,b)=>{
                    if(a.role==='owner') return -1;
                    if(b.role==='owner') return 1;
                    return (window.rolesOrder[a.role]||99)-(window.rolesOrder[b.role]||99);
                });
                const usersHtml=list.map(u=>{
                    const rObj=window.chatRanksData[u.role]||{icon:"fas fa-user",color:"#fff",text:"عضو"};

            document.getElementById('msgInp').focus();

        escapeHtml: (s='') => String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),
        renderMsg: (user, text, timestamp, type='text', extra={}) => {
            if(!user)return;
            const live=window.usersCache[user.uid]||user;
            const rankObj=window.chatRanksData[live.role]||window.chatRanksData.new;

            else if(type==='image') body=`<img src="${text}" style="width:100%;border-radius:12px;margin-top:8px">`;
            else if(type==='audio') body=`<audio controls style="width:100%;margin-top:8px"><source src="${text}"></audio>`;

            else body=`<div class="msg-text">${ui.escapeHtml(text)}</div>`;

        openYouTubeSearchEngine: () => {
            document.getElementById('featureModalTitle').innerText = "📺 مشغل اليوتيوب الإمبراطوري";
            document.getElementById('featureModalBody').innerHTML = `
                <div style="text-align:right;">
                    <p style="font-size:12px; color:#aaa; text-align:center;">ضع رابط الأغنية أو الشيلة من اليوتيوب لتشغيلها للجميع في الغرفة الحالية:</p>
                    <input type="text" id="ytLinkInput" class="form-control" placeholder="ضع رابط اليوتيوب هنا..." oninput="ui.previewYoutubeTrack()">
                    <div id="ytSearchPreviewContainer"></div>
                </div>
            `;
            document.getElementById('featureModal').style.display = 'flex';
        },
        previewYoutubeTrack: () => {
            let link = document.getElementById('ytLinkInput').value.trim();
            let videoId = extractYouTubeVideoId(link);
            let container = document.getElementById('ytSearchPreviewContainer');
            
            if (videoId) {
                container.innerHTML = `
                    <div class="menu-item" style="background:#1a1a1a; border:1px solid red; border-radius:10px; margin-top:10px;" onclick="ui.processAndPlayYoutubeLink('${videoId}')">
                        <i class="fab fa-youtube" style="color:red; font-size:22px;"></i>
                        <span style="color:#fff; font-size:13px; font-weight:bold;">تشغيل البث للغرفة الحالية 🚀</span>
                    </div>
                `;
            } else {
                container.innerHTML = "";
            }
        },
        processAndPlayYoutubeLink: (vId) => {
            let roomDocId = window.currentRoom.replace(/\s+/g, '_');
            db.collection("room_settings").doc(roomDocId).set({ activeAudioId: vId }, { merge: true }).then(() => {
                alert("🔊 تم إطلاق وتثبيت البث الصوتي بنجاح لجميع الحاضرين في الغرفة!");
                document.getElementById('featureModal').style.display = 'none';
            });
        },
        stopHiddenAudioPlayback: () => {
            let roomDocId = window.currentRoom.replace(/\s+/g, '_');
            db.collection("room_settings").doc(roomDocId).set({ activeAudioId: "" }, { merge: true }).then(() => {
                alert("تم إيقاف الصوت لدى الجميع في هذه الغرفة.");
                document.getElementById('featureModal').style.display = 'none';
            });
        },
        toggleOnlineUsers: () => {
            let m = document.getElementById('onlineUsersHalfModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        },
        viewProfileCard: (uid) => {
            db.collection("users").doc(uid).get().then((doc) => {
                if(!doc.exists) return;
                let u = doc.data();
                let isMe = (window.currentUser.uid === uid);
                let isAmOwner = (window.currentUser.role === 'owner');
                
                document.getElementById('featureModalTitle').innerText = "الملف الشخصي";
                
                let pencilHtml = (isMe || isAmOwner) ? 
                    `<div class="profile-edit-pencil" onclick="ui.openEditProfileModal('${uid}')"><i class="fas fa-pencil-alt"></i></div>` : '';
                
                let ownerAdminPanelHtml = '';
                if (isAmOwner && !isMe) {
                    ownerAdminPanelHtml = `
                        <div style="background:rgba(231,76,60,0.15); border:1px solid #e74c3c; border-radius:10px; padding:10px; margin-top:12px; text-align:right;">
                            <p style="color:#e74c3c; font-weight:bold; font-size:13px; text-align:center; margin:0 0 8px;">👑 لوحة تحكم صاحب الموقع للإدارة</p>
                            
                            <label style="font-size:11px; color:var(--gold);">إهداء وتغيير الرتبة الإمبراطورية:</label>
                            <select id="changeRoleSelect" class="form-select" style="font-size:12px; padding:6px;" onchange="ui.changeUserRole('${uid}', '${u.name}', this.value)">
                                <option value="owner" ${u.role === 'owner' ? 'selected' : ''}>1. صاحب الموقع (كأس ذهبي)</option>
                                <option value="prince" ${u.role === 'prince' ? 'selected' : ''}>2. برنس (كأس أبيض)</option>
                                <option value="king" ${u.role === 'king' ? 'selected' : ''}>3. كنج (تاج أبيض)</option>
                                <option value="honor" ${u.role === 'honor' ? 'selected' : ''}>4. انروا (تاج ازرق)</option>
                                <option value="management" ${u.role === 'management' ? 'selected' : ''}>5. اداره (تاج احمر)</option>
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>6. ادمان (تاج وردي)</option>
                                <option value="developer" ${u.role === 'developer' ? 'selected' : ''}>مطور</option>
                                <option value="senior_mod" ${u.role === 'senior_mod' ? 'selected' : ''}>مشرف أول</option>
                                <option value="mod" ${u.role === 'mod' ? 'selected' : ''}>مشرف</option>
                                <option value="vip" ${u.role === 'vip' ? 'selected' : ''}>VIP</option>
                                <option value="diamond" ${u.role === 'diamond' ? 'selected' : ''}>ماسي</option>
                                <option value="gold_member" ${u.role === 'gold_member' ? 'selected' : ''}>ذهبي</option>
                                <option value="new" ${u.role === 'new' ? 'selected' : ''}>عضو مسجل</option>
                            </select>

                            <div style="display:flex; gap:5px; margin-top:8px;">
                                <button class="row-btn" style="background:${u.isMuted ? '#2ecc71':'#f39c12'}; color:#000; font-size:11px; padding:6px;" onclick="ui.adminToggleMute('${uid}', ${!u.isMuted})">${u.isMuted ? 'إلغاء الكتم':'كتم'}</button>
                                <button class="row-btn" style="background:#e67e22; color:#fff; font-size:11px; padding:6px;" onclick="ui.adminKickUser('${uid}')">طرد</button>
                                <button class="row-btn" style="background:#8e44ad; color:#fff; font-size:11px; padding:6px;" onclick="ui.adminBlockUser('${uid}')">حجب</button>
                                <button class="row-btn" style="background:#c0392b; color:#fff; font-size:11px; padding:6px;" onclick="ui.adminBanUser('${uid}')">حظر</button>
                            </div>
                            <button class="row-btn" style="width:100%; background:#2c3e50; color:#e74c3c; font-size:11px; padding:8px; margin-top:6px;" onclick="ui.adminDeleteAccount('${uid}')"><i class="fas fa-user-slash"></i> حذف الحساب نهائياً</button>
                        </div>
                    `;
                }

                let rObj = window.chatRanksData[u.role] || { icon: "fas fa-user", color: "#fff", text: "عضو" };

                document.getElementById('featureModalBody').innerHTML = `
                    <div class="profile-card-wrapper">
                        ${pencilHtml}
                        <img src="${u.cover || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400'}" class="profile-card-cover">
                        <img src="${u.img || 'https://cdn-icons-png.flaticon.com/512/1042/1042291.png'}" class="profile-card-pfp">
                        <h2 style="color:${u.nameColor || rObj.color}; margin:5px 0 2px;">${u.name}</h2>
                        <p style="margin:0 0 5px; font-size:12px; color:${rObj.color}; font-weight:bold;"><i class="${rObj.icon}"></i> ${rObj.text}</p>
                        <p style="margin:0 0 10px; font-size:11px; color:#aaa;">${u.status || 'لا يوجد حالة'}</p>
                        
                        <div style="display:flex; justify-content:center; gap:15px; margin-bottom:10px; font-size:12px;">
                            <div><i class="fas fa-layer-group" style="color:var(--gold);"></i> العمر: ${u.age || 'غير محدد'}</div>
                            <div><i class="fas fa-globe" style="color:#3498db;"></i> البلد: ${u.country || 'غير محدد'}</div>
                            <div><i class="fas fa-heart" style="color:#2ecc71;"></i> ${u.likes || 0}</div>
                        </div>

                        <div style="display:flex; gap:8px; margin-bottom:12px;">
                            <button class="row-btn active" style="border-radius:8px; padding:6px; width:100%;" onclick="ui.startPrivateChatWith('${u.uid}', '${u.name}')"><i class="fas fa-comment"></i> مراسلة خاصة</button>
                        </div>
                        ${ownerAdminPanelHtml}
                    </div>
                `;
                document.getElementById('featureModal').style.display = 'flex';
            });
        },
        adminToggleMute: (uid, muteState) => {
            db.collection("users").doc(uid).update({ isMuted: muteState }).then(() => {
                alert(muteState ? "تم كتم العضو بنجاح." : "تم إلغاء كتم العضو.");
                document.getElementById('featureModal').style.display = 'none';
            });
        },
        adminKickUser: (uid) => {
            db.collection("users").doc(uid).update({ isOnline: false }).then(() => {
                alert("تم طرد العضو من الروم بنجاح.");
                document.getElementById('featureModal').style.display = 'none';
            });
        },
        adminBlockUser: (uid) => {
            db.collection("users").doc(uid).update({ isMuted: true, status: "محجوب من الإدارة" }).then(() => {
                alert("تم حجب العضو بنجاح.");
                document.getElementById('featureModal').style.display = 'none';
            });
        },
        adminBanUser: (uid) => {
            db.collection("users").doc(uid).update({ isBanned: true, isOnline: false }).then(() => {
                alert("تم حظر العضو نهائياً.");
                document.getElementById('featureModal').style.display = 'none';
            });
        },
        adminDeleteAccount: (uid) => {
            if(!confirm("هل أنت متأكد تماماً من حذف هذا الحساب نهائياً من قاعدة البيانات؟")) return;
            db.collection("users").doc(uid).delete().then(() => {
                alert("تم حذف الحساب نهائياً.");
                document.getElementById('featureModal').style.display = 'none';
            });
        },
        changeUserRole: (uid, targetUserName, newRole) => {
            db.collection("users").doc(uid).update({ role: newRole }).then(() => {
                let rankObj = window.chatRanksData[newRole] || { text: newRole };
                let systemNotice = `🎉 تم إهداء العضو [ ${targetUserName} ] رتبة [ ${rankObj.text} ] بواسطة الإدارة العامة 👑`;
                let roomDocId = window.currentRoom.replace(/\s+/g, '_');
                
                db.collection("rooms").doc(roomDocId).collection("messages").add({
                    isSystemGold: true,
                    text: systemNotice,
                    memberName: targetUserName,
                    rank: newRole,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("تم تحديث الرتبة وحفظها وإرسال إعلان التهنئة في الشات بنجاح!");
                document.getElementById('featureModal').style.display = 'none';
            });
        },
        openPrivateConversationsList: () => {
            document.getElementById('featureModalTitle').innerText = "💬 الرسائل الخاصة المتزامنة";
            document.getElementById('featureModalBody').innerHTML = `
                <div style="text-align:center; padding:10px;">
                    <p style="font-size:13px; color:#ccc;">لبدء محادثة خاصة، اضغط على بروفايل أي عضو من قائمة "المتواجدين" واضغط على زر "مراسلة خاصة".</p>
                </div>
            `;
            document.getElementById('featureModal').style.display = 'flex';
        },
        startPrivateChatWith: (targetUid, targetName) => {
            if(window.currentUser.uid === targetUid) { alert("لا يمكنك مراسلة نفسك."); return; }
            let chatId = generateChatroomId(window.currentUser.uid, targetUid);
            
            document.getElementById('featureModalTitle').innerText = `🔒 خاص مع: ${targetName}`;
            document.getElementById('featureModalBody').innerHTML = `
                <div class="private-chat-box">
                    <div class="private-msg-list" id="privateMsgContainer"></div>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="privateInp" class="chat-input" style="height:36px; font-size:12px;" placeholder="اكتب للخاص..." onkeypress="if(event.key==='Enter') ui.sendPrivateMessage('${chatId}')">
                        <button class="row-btn active" style="height:36px; padding:0 12px; font-size:12px; border-radius:18px;" onclick="ui.sendPrivateMessage('${chatId}')">إرسال</button>
                    </div>
                </div>
            `;
            document.getElementById('featureModal').style.display = 'flex';

            let unsub = db.collection("private_chats").doc(chatId).collection("messages")
                .orderBy("timestamp", "asc")
                .onSnapshot(snap => {
                    let box = document.getElementById('privateMsgContainer');
                    if(!box) return;
                    box.innerHTML = "";
                    snap.forEach(doc => {
                        let data = doc.data();
                        let isMine = data.senderUid === window.currentUser.uid;
                        let msgDiv = document.createElement('div');
                        msgDiv.className = `private-msg-bubble ${isMine ? 'private-msg-mine' : 'private-msg-other'}`;
                        msgDiv.innerText = data.text;
                        box.appendChild(msgDiv);
                    });
                    box.scrollTop = box.scrollHeight;
                });
            window.activeListeners.push(unsub);
        },
        sendPrivateMessage: (chatId) => {
            let inp = document.getElementById('privateInp');
            let t = inp.value.trim();
            if(!t) return;
            inp.value = '';

            db.collection("private_chats").doc(chatId).collection("messages").add({
                senderUid: window.currentUser.uid,
                senderName: window.currentUser.name,
                text: t,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        },
        handleLocalFileProcessing: (inputEl, type) => {
            let file = inputEl.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = (e) => {
                if (type === 'cover') {
                    window.tempUploadedCover = e.target.result;
                    alert("تم تحميل وتجهيز صورة الغلاف بنجاح!");
                } else if (type === 'pfp') {
                    window.tempUploadedPfp = e.target.result;
                    alert("تم تحميل وتجهيز الصورة الشخصية بنجاح!");
                }
            };
            reader.readAsDataURL(file);
        },
        openEditProfileModal: (uid) => {
            db.collection("users").doc(uid).get().then((doc) => {
                let u = doc.data();
                window.tempUploadedCover = u.cover || "";
                window.tempUploadedPfp = u.img || "";
                
                document.getElementById('featureModalTitle').innerText = "تعديل الملف الشخصي الكامل";
                document.getElementById('featureModalBody').innerHTML = `
                    <div style="text-align:right;">
                        <label style="font-size:12px; color:var(--gold); font-weight:bold;">صورة الغلاف (من ملفات الجهاز):</label>
                        <label for="fileCover" class="file-input-label"><i class="fas fa-upload"></i> اختر ملف الغلاف</label>
                        <input type="file" id="fileCover" class="file-input-hidden" accept="image/*" onchange="ui.handleLocalFileProcessing(this, 'cover')">
                        
                        <label style="font-size:12px; color:var(--gold); font-weight:bold;">الصورة الشخصية / البروفايل (من ملفات الجهاز):</label>
                        <label for="filePfp" class="file-input-label"><i class="fas fa-image"></i> اختر ملف الصورة الشخصية</label>
                        <input type="file" id="filePfp" class="file-input-hidden" accept="image/*" onchange="ui.handleLocalFileProcessing(this, 'pfp')">
                        
                        <label style="font-size:12px; color:var(--gold);">الاسم المستعار:</label>
                        <input type="text" id="editName" class="form-control" value="${u.name || ''}">

                        <label style="font-size:12px; color:var(--gold);">خلفية / لون الاسم:</label>
                        <input type="color" id="editNameColor" class="form-control" style="height:40px; padding:4px;" value="${u.nameColor || '#ffd700'}">

                        <label style="font-size:12px; color:var(--gold);">العمر:</label>
                        <input type="number" id="editAge" class="form-control" value="${u.age || ''}">

                        <label style="font-size:12px; color:var(--gold);">الجنس:</label>
                        <select id="editGender" class="form-select">
                            <option value="ذكر" ${u.gender === 'ذكر' ? 'selected' : ''}>ذكر</option>
                            <option value="أنثى" ${u.gender === 'أنثى' ? 'selected' : ''}>أنثى</option>
                        </select>

                        <label style="font-size:12px; color:var(--gold);">البلد:</label>
                        <input type="text" id="editCountry" class="form-control" value="${u.country || ''}">

                        <label style="font-size:12px; color:var(--gold);">البريد الإلكتروني:</label>
                        <input type="email" id="editEmail" class="form-control" value="${u.email || ''}">

                        <label style="font-size:12px; color:var(--gold);">كلمة المرور الجديدة:</label>
                        <input type="password" id="editPassword" class="form-control" value="${u.password || ''}">
                        
                        <label style="font-size:12px; color:var(--gold);">الحالة الشخصية:</label>
                        <input type="text" id="editStatus" class="form-control" value="${u.status || ''}">
                        
                        <button class="row-btn active" style="width:100%; margin-top:10px; border-radius:8px; padding:10px;" onclick="ui.saveProfileEdits('${uid}')">حفظ التغييرات ومزامنتها فوراً</button>
                    </div>
                `;
            });
        },
        saveProfileEdits: (uid) => {
            let updated = {
                cover: window.tempUploadedCover,
                img: window.tempUploadedPfp,
                name: document.getElementById('editName').value.trim(),
                nameColor: document.getElementById('editNameColor').value,
                age: document.getElementById('editAge').value.trim(),
                gender: document.getElementById('editGender').value,
                country: document.getElementById('editCountry').value.trim(),
                email: document.getElementById('editEmail').value.trim(),
                password: document.getElementById('editPassword').value,
                status: document.getElementById('editStatus').value.trim()
            };

            db.collection("users").doc(uid).update(updated).then(() => {
                alert("تم تحديث ومزامنة البيانات والصور بنجاح لجميع الأعضاء!");
                db.collection("users").doc(uid).get().then(doc => {
                    window.currentUser = doc.data();
                    localStorage.setItem("hassouni_user_session", JSON.stringify(window.currentUser));
                    ui.updateHeaderUserBgIcon();
                });
                document.getElementById('featureModal').style.display = 'none';
            });
        },
        openRoomsManager: () => {
            document.getElementById('featureModalTitle').innerText = "قائمة الغرف المنفصلة المتاحة";
            let html = '<div style="text-align:right;">';
            window.roomsList.forEach(r => {
                let activeMark = window.currentRoom === r ? '<span style="color:var(--gold);">🏆 الغرفة الحالية</span>' : '';
                html += `
                    <div class="room-card-box" onclick="ui.changeActiveRoom('${r}')">
                        <div>
                            <div style="color:var(--gold); font-weight:bold; font-size:14px;"><i class="fas fa-door-open"></i> ${r}</div>
                            <span style="font-size:11px; color:#aaa;">روم مستقلة ببياناتها ومحادثاتها</span>
                        </div>
                        <div>${activeMark}</div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('featureModalBody').innerHTML = html;
            document.getElementById('featureModal').style.display = 'flex';
        },
        createNewRoomCloud: async () => {
            let rName = document.getElementById('newRoomNameInp').value.trim();
            if(!rName) return;
            if(!window.roomsList.includes(rName)) {
                await db.collection("room_directory").doc(rName.replace(/\s+/g,"_")).set({name:rName,createdAt:FieldValue.serverTimestamp(),createdBy:window.currentUser.uid});
                window.roomsList.push(rName);
                alert(`تم إنشاء الغرفة المستقلة [ ${rName} ] بنجاح وصارت متاحة للجميع.`);
                document.getElementById('featureModal').style.display = 'none';
            }
        },
        changeActiveRoom: (r) => { 
            window.currentRoom = r; 
            document.getElementById('chatBox').innerHTML = ""; 
            document.getElementById('featureModal').style.display = 'none'; 
            ui.enterChat();
        },
        startRealtimePresence: () => {
            if(!window.currentUser)return;
            if(window.presenceTimer) clearInterval(window.presenceTimer);
            const beat=()=>db.collection("users").doc(window.currentUser.uid).set({isOnline:true,lastSeen:FieldValue.serverTimestamp()},{merge:true});
            beat(); window.presenceTimer=setInterval(beat,20000);
        },
        listenRoomDirectory: () => {
            const unsub=db.collection("room_directory").onSnapshot(s=>{const base=["الغرفة العامة","روم المسابقات","ملتقى النخبة","عظماء النخبة","السجن"];window.roomsList=[...new Set([...base,...s.docs.map(d=>d.data().name).filter(Boolean)])];});
            window.activeListeners.push(unsub);
        },
        ensureMicPeer: async (micData) => {
            const room=window.currentRoom.replace(/\s+/g,'_'), remoteUid=micData.userId;
            if(window.micPeers[remoteUid]||!window.currentUser||remoteUid===window.currentUser.uid)return;
            const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
            window.micPeers[remoteUid]={pc,remoteUid};
            const audio=document.createElement('audio');audio.autoplay=true;audio.playsInline=true;document.getElementById('liveAudioBroadcastContainer').appendChild(audio);
            pc.ontrack=e=>{audio.srcObject=e.streams[0];};
            pc.onicecandidate=e=>{if(e.candidate) db.collection('mic_signals').doc(room).collection(`${remoteUid}_${window.currentUser.uid}_candidates`).add({candidate:e.candidate.toJSON(),from:remoteUid});};
            const offerDoc=db.collection('mic_signals').doc(room).collection('offers').doc(`${remoteUid}_${window.currentUser.uid}`);
            const off=offerDoc.onSnapshot(async d=>{const v=d.data();if(!v?.offer||pc.currentRemoteDescription)return;await pc.setRemoteDescription(v.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await offerDoc.set({answer:{type:ans.type,sdp:ans.sdp}}, {merge:true});});
            window.micUnsubs.push(off);
        },
        closeMicPeer:(uid)=>{const p=window.micPeers[uid];if(p){p.pc.close();delete window.micPeers[uid];}},
        logoutBackToWelcome: () => {
            if(window.sessionCheckInterval) clearInterval(window.sessionCheckInterval);
            ui.updateUserOnlineStatus(false);
            localStorage.removeItem("hassouni_user_session");
            window.currentUser = null;
            ui.clearAllListeners();
            document.getElementById('featureModal').style.display = 'none';
            document.getElementById('welcomeOverlay').style.display = 'flex';
            ui.switchBranch('b1');
        }
    };

    window.onload = () => { ui.checkSavedSessionOnLoad(); };
    window.addEventListener('beforeunload',()=>{ if(window.currentUser) db.collection("users").doc(window.currentUser.uid).set({isOnline:false,lastSeen:FieldValue.serverTimestamp()},{merge:true}); });
</script>
</body>
</html>
