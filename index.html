  <!-- Canvas Confetti -->

  <!-- Firebase SDK Compat v10 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
    * {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    @keyframes pulseGlow {
      0%, 100% { 
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.95), 0 0 30px rgba(245, 158, 11, 0.7); 
      }
      50% { 
        box-shadow: 0 0 25px rgba(255, 255, 255, 1), 0 0 50px rgba(245, 158, 11, 0.95); 
      }
    }
    .white-glowing-cup {
      animation: pulseGlow 1.8s infinite ease-in-out;
    }
    @keyframes speakingRipple {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .speaking-active {
      animation: speakingRipple 1.4s infinite;
    }
  </style>
</head>
<body class="bg-black text-slate-100 flex justify-center min-h-screen select-none">

  <!-- Root Div for React -->
  <div id="root" class="w-full max-w-md h-screen bg-[#07070a] border-x border-zinc-850 shadow-2xl flex flex-col relative overflow-hidden"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==================== 1. FIREBASE CONFIG ====================
    const firebaseConfig = {
      apiKey: "AIzaSyAFjspoGwJJeowjEZrcmJCO99iiTcBR5Is",
      authDomain: "hassouni-chat-51234.firebaseapp.com",
      projectId: "hassouni-chat-51234",
      storageBucket: "hassouni-chat-51234.firebasestorage.app",
      messagingSenderId: "519124989339",
      appId: "1:519124989339:web:2619c6d8c0488cdbd89d3e",
      measurementId: "G-E4QVC93P2R"
    };

    let auth = null;
    let db = null;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase initialization notice:", e);
    }

    // ==================== 2. AUDIO UTILITY ====================
    const playAudio = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'crown') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } else if (type === 'gift') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else {
          osc.frequency.setValueAtTime(650, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        }
      } catch (e) {}
    };

    // ==================== 3. CONSTANTS ====================
    const DEFAULT_ROOMS = [
      { id: 'general', name: 'الغرفـــة || العـامـــة 🌸', desc: 'الروم الرئيسي لجميع الأعضاء والزوار', icon: '👑', bgImage: '' },
      { id: 'elite', name: 'ملتقى النخبه 💎', desc: 'غرفة أصحاب الكؤوس الذهبية', icon: '💎', bgImage: '' },
      { id: 'legends', name: 'عظماء النخبه 👑', desc: 'غرفة خاصة بكبار الشخصيات', icon: '🏆', bgImage: '' },
      { id: 'games', name: 'المسابقات والجوائز 🎮', desc: 'تحديات وجوائز ذهب وروبي', icon: '🎲', bgImage: '' },
      { id: 'jail', name: 'السجن التأديبي 🔒', desc: 'غرفة الموقوفين والمخالفين', icon: '⛓️', bgImage: '' }
    ];

    const STORE_GIFTS = [
      { id: 'g1', name: 'تاج الملوك', icon: '👑', price: 5000 },
      { id: 'g2', name: 'الماسة الزرقاء', icon: '💎', price: 3000 },
      { id: 'g3', name: 'باقة ورد فاخرة', icon: '💐', price: 500 },
      { id: 'g4', name: 'قلب أحمر مشع', icon: '❤️', price: 200 },
      { id: 'g5', name: 'سيارة رياضية', icon: '🏎️', price: 10000 },
      { id: 'g6', name: 'كأس الذهب الملكي', icon: '🏆', price: 8000 }
    ];

    const NAME_PALETTES = [
      { id: 'p1', name: 'الملكي الذهبي', class: 'from-amber-500 via-yellow-400 to-amber-600' },
      { id: 'p2', name: 'الياقوت الأزرق', class: 'from-blue-600 via-cyan-500 to-indigo-700' },
      { id: 'p3', name: 'الوردي الفاخر', class: 'from-pink-600 via-rose-500 to-purple-600' },
      { id: 'p4', name: 'الزمرد الأخضر', class: 'from-emerald-600 via-teal-500 to-green-700' },
      { id: 'p5', name: 'الليلي الفحمي', class: 'from-zinc-900 via-stone-800 to-zinc-900' }
    ];

    function CupBadge({ type }) {
      if (type === 'none' || !type) return null;
      if (type === 'white_glowing') {
        return (
          <div className="white-glowing-cup inline-flex items-center justify-center rounded-full bg-gradient-to-tr from-white via-slate-100 to-slate-200 text-amber-500 border-2 border-white w-5 h-5 text-[10px] shadow-lg shrink-0" title="الكأس الأبيض اللامع - صاحب الموقع">
            👑
          </div>
        );
      }
      if (type === 'gold') {
        return (
          <div className="inline-flex items-center justify-center rounded-full bg-gradient-to-tr from-amber-600 via-yellow-400 to-amber-200 text-black border border-yellow-300 w-5 h-5 text-[9px] shadow shrink-0" title="كأس الذهب">
            🏆
          </div>
        );
      }
      if (type === 'diamond') {
        return (
          <div className="inline-flex items-center justify-center rounded-full bg-gradient-to-tr from-cyan-600 to-blue-500 text-white border border-cyan-300 w-5 h-5 text-[9px] shadow shrink-0" title="الرتبة الماسية">
            💎
          </div>
        );
      }
      return null;
    }

    // ==================== 4. MAIN APP ====================
    function App() {
      const getSavedUser = () => {
        try {
          const s = localStorage.getItem('hassouni_chat_user');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return null;
      };

      const [currentUser, setCurrentUser] = useState(getSavedUser());
      const [users, setUsers] = useState([]);
      const [rooms, setRooms] = useState(DEFAULT_ROOMS);
      const [messages, setMessages] = useState([]);
      const [currentRoomId, setCurrentRoomId] = useState('general');
      const [inputText, setInputText] = useState('');
      const [isPlayingMusic, setIsPlayingMusic] = useState(false);
      const [musicTitle, setMusicTitle] = useState('Ramy Gamal - Btedeny Wahsh 🎵');

      // Mic Slots (Real live slots)
      const [micSlots, setMicSlots] = useState([
        { slot: 1, user: null, isSpeaking: false, isMuted: false, isMusicPlaying: false },
        { slot: 2, user: null, isSpeaking: false, isMuted: false, isMusicPlaying: false },
        { slot: 3, user: null, isSpeaking: false, isMuted: false, isMusicPlaying: false },
        { slot: 4, user: null, isSpeaking: false, isMuted: false, isMusicPlaying: false },
      ]);

      // Mic Interaction Modals
      const [confirmMicSlot, setConfirmMicSlot] = useState(null);
      const [activeMicMenuSlot, setActiveMicMenuSlot] = useState(null);
      const [audioStream, setAudioStream] = useState(null);

      // Other Modals
      const [showLogin, setShowLogin] = useState(!currentUser);
      const [showProfile, setShowProfile] = useState(false);
      const [selectedUser, setSelectedUser] = useState(null);
      const [showRooms, setShowRooms] = useState(false);
      const [showStore, setShowStore] = useState(false);
      const [showGifts, setShowGifts] = useState(false);
      const [showAdmin, setShowAdmin] = useState(false);
      const [showUsersModal, setShowUsersModal] = useState(false);
      const [showDrawer, setShowDrawer] = useState(false);

      // Login form states (EMPTY by default)
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [registerName, setRegisterName] = useState('');
      const [guestName, setGuestName] = useState('');
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [isGuestMode, setIsGuestMode] = useState(false);
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginError, setLoginError] = useState('');

      // Customization Profile
      const [customName, setCustomName] = useState('');
      const [customPalette, setCustomPalette] = useState('from-amber-500 via-yellow-400 to-amber-600');

      // Admin Management States
      const [adminTargetId, setAdminTargetId] = useState('');
      const [adminGold, setAdminGold] = useState(5000);
      const [adminRubies, setAdminRubies] = useState(100);
      const [adminBroadcast, setAdminBroadcast] = useState('');
      const [adminNewRoomName, setAdminNewRoomName] = useState('');

      const chatEndRef = useRef(null);
      const currentRoom = rooms.find(r => r.id === currentRoomId) || rooms[0];

      // Auto-scroll to bottom whenever messages update
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // ==================== 5. FIREBASE SYNC LISTENERS ====================
      // A. Real-time Messages Sync (Specific to current room)
      useEffect(() => {
        if (!db) return;
        try {
          const unsub = db.collection('rooms').doc(currentRoomId).collection('messages')
            .orderBy('createdAt', 'asc')
            .limit(150)
            .onSnapshot((snapshot) => {
              if (snapshot) {
                const liveMsgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setMessages(liveMsgs);
              }
            }, (err) => console.warn('Messages listener:', err));

          return () => unsub();
        } catch (e) {}
      }, [currentRoomId]);

      // B. Real-time Online Users Sync (Real users only, Owner first)
      useEffect(() => {
        if (!db) return;
        try {
          const unsub = db.collection('users').onSnapshot((snapshot) => {
            if (snapshot) {
              const liveUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              // Sort: Owner first, then online status, then join date
              const sorted = liveUsers.sort((a, b) => {
                if (a.role === 'owner' || a.cupType === 'white_glowing') return -1;
                if (b.role === 'owner' || b.cupType === 'white_glowing') return 1;
                return (b.isOnline ? 1 : 0) - (a.isOnline ? 1 : 0);
              });
              setUsers(sorted);
            }
          }, (err) => console.warn('Users listener:', err));

          return () => unsub();
        } catch (e) {}
      }, []);

      // C. Real-time Room Mic Slots Sync
      useEffect(() => {
        if (!db) return;
        try {
          const unsub = db.collection('rooms').doc(currentRoomId).onSnapshot((doc) => {
            if (doc.exists) {
              const data = doc.data();
              if (data.micSlots) setMicSlots(data.micSlots);
              if (data.bgImage !== undefined) {
                setRooms(prev => prev.map(r => r.id === currentRoomId ? { ...r, bgImage: data.bgImage } : r));
              }
            }
          });
          return () => unsub();
        } catch (e) {}
      }, [currentRoomId]);

      // D. User Presence Heartbeat
      useEffect(() => {
        if (!currentUser || !db) return;
        try {
          db.collection('users').doc(currentUser.id).set({
            ...currentUser,
            isOnline: true,
            currentRoomId: currentRoomId,
            lastSeen: new Date().toISOString()
          }, { merge: true }).catch(() => {});
        } catch (e) {}
      }, [currentUser, currentRoomId]);

      // Check if currentUser was banned or muted remotely
      useEffect(() => {
        if (!currentUser) return;
        const fresh = users.find(u => u.id === currentUser.id);
        if (fresh) {
          if (fresh.isBanned) {
            alert('تم حظرك من الشات بواسطة إدارة الموقع.');
            localStorage.removeItem('hassouni_chat_user');
            setCurrentUser(null);
            setShowLogin(true);
          }
          if (fresh.isJailed && currentRoomId !== 'jail') {
            setCurrentRoomId('jail');
            alert('تم تحويلك إلى السجن التأديبي من قِبل الإدارة.');
          }
        }
      }, [users]);

      // ==================== 6. HANDLERS ====================
      const handleSendMessage = () => {
        if (!inputText.trim()) return;
        if (!currentUser) return setShowLogin(true);
        if (currentUser.isMuted) return alert('أنت مكتوم حالياً من الكتابة بواسطة الإدارة!');

        const newMsg = {
          roomId: currentRoomId,
          userId: currentUser.id,
          userName: currentUser.name,
          userDecoratedName: currentUser.decoratedName,
          userAvatar: currentUser.avatar,
          userLevel: currentUser.level || 1,
          userCup: currentUser.cupType || 'none',
          userRole: currentUser.role || 'member',
          nameBgGradient: currentUser.nameBgGradient || 'from-amber-600 to-yellow-600',
          textColor: currentUser.nameTextColor || '#ffffff',
          content: inputText.trim(),
          timestamp: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
          type: 'text',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (db) {
          db.collection('rooms').doc(currentRoomId).collection('messages').add(newMsg).catch(() => {});
        } else {
          setMessages(prev => [...prev, { id: 'local_' + Date.now(), ...newMsg }]);
        }

        setInputText('');
        playAudio('msg');
      };

      const handleUpdateUser = (userId, updates) => {
        if (currentUser && currentUser.id === userId) {
          const updated = { ...currentUser, ...updates };
          setCurrentUser(updated);
          localStorage.setItem('hassouni_chat_user', JSON.stringify(updated));
        }
        if (db) {
          db.collection('users').doc(userId).set(updates, { merge: true }).catch(() => {});
        }
      };

      // Room Cleansing
      const handleClearRoomMessages = async () => {
        if (currentUser?.role !== 'owner') return;
        if (!confirm('هل أنت متأكد من رغبتك في تنظيف وحذف جميع رسائل الغرفة الحالية؟')) return;
        
        if (db) {
          try {
            const snapshot = await db.collection('rooms').doc(currentRoomId).collection('messages').get();
            const batch = db.batch();
            snapshot.docs.forEach((doc) => batch.delete(doc.ref));
            await batch.commit();
            playAudio('crown');
            alert('تم تنظيف الغرفة وحذف جميع الرسائل بنجاح! 🧹✨');
          } catch (e) {
            alert('حدث خطأ أثناء تنظيف الغرفة');
          }
        }
      };

      // Room Background Upload
      const handleRoomBackgroundUpload = (e) => {
        const file = e.target.files?.[0];
        if (file && currentUser?.role === 'owner') {
          const reader = new FileReader();
          reader.onload = (event) => {
            const bgData = event.target?.result;
            if (bgData) {
              if (db) {
                db.collection('rooms').doc(currentRoomId).set({ bgImage: bgData }, { merge: true });
              }
              setRooms(prev => prev.map(r => r.id === currentRoomId ? { ...r, bgImage: bgData } : r));
              alert('تم تعيين خلفية الغرفة بنجاح! 🖼️✨');
            }
          };
          reader.readAsDataURL(file);
        }
      };

      // File upload for profile/cover
      const handleFileChange = (e, field) => {
        const file = e.target.files?.[0];
        if (file && currentUser) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const res = event.target?.result;
            if (res) {
              handleUpdateUser(currentUser.id, { [field]: res });
              if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });
              alert('تم تحديث الصورة بنجاح! ✨');
            }
          };
          reader.readAsDataURL(file);
        }
      };

      // Real Mic Audio Stream Activation
      const startLiveMicrophone = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          setAudioStream(stream);
        } catch (err) {
          console.warn('Microphone access notice:', err);
        }
      };

      const stopLiveMicrophone = () => {
        if (audioStream) {
          audioStream.getTracks().forEach(track => track.stop());
          setAudioStream(null);
        }
      };

      // Mic Step 1: Take Mic Confirm
      const handleMicSlotClick = (slotObj) => {
        if (!currentUser) return setShowLogin(true);

        // If slot is empty, ask user if they want to climb up
        if (!slotObj.user) {
          setConfirmMicSlot(slotObj.slot);
          return;
        }

        // If current user is already on this mic, open the 5-options control menu
        if (slotObj.user.id === currentUser.id) {
          setActiveMicMenuSlot(slotObj.slot);
        } else {
          // If another user is on the mic, open their profile
          setSelectedUser(slotObj.user);
          setShowProfile(true);
        }
      };

      // Mic Step 2: Confirm Climbing
      const confirmTakeMic = async (slotNumber) => {
        await startLiveMicrophone();
        const updatedSlots = micSlots.map(s => s.slot === slotNumber ? {
          ...s,
          user: currentUser,
          isSpeaking: true,
          isMuted: false,
          isMusicPlaying: false
        } : s);

        setMicSlots(updatedSlots);
        if (db) db.collection('rooms').doc(currentRoomId).set({ micSlots: updatedSlots }, { merge: true });
        setConfirmMicSlot(null);
        playAudio('crown');
      };

      // Mic Step 3: Menu Option Handlers
      const handleMicMenuAction = (action) => {
        if (!activeMicMenuSlot) return;

        let updatedSlots = [...micSlots];

        if (action === 'mute') {
          updatedSlots = updatedSlots.map(s => s.slot === activeMicMenuSlot ? { ...s, isMuted: true, isSpeaking: false } : s);
          if (audioStream) audioStream.getAudioTracks().forEach(t => t.enabled = false);
          alert('تم كتم المايك الخاص بك 🔇');
        } else if (action === 'unmute') {
          updatedSlots = updatedSlots.map(s => s.slot === activeMicMenuSlot ? { ...s, isMuted: false, isSpeaking: true } : s);
          if (audioStream) audioStream.getAudioTracks().forEach(t => t.enabled = true);
          alert('تم فتح المايك الخاص بك 🎙️');
        } else if (action === 'play_music') {
          updatedSlots = updatedSlots.map(s => s.slot === activeMicMenuSlot ? { ...s, isMusicPlaying: true } : s);
          setIsPlayingMusic(true);
          alert('تم تشغيل الأغنية على المايك 🎵');
        } else if (action === 'stop_music') {
          updatedSlots = updatedSlots.map(s => s.slot === activeMicMenuSlot ? { ...s, isMusicPlaying: false } : s);
          setIsPlayingMusic(false);
          alert('تم إيقاف تشغيل الأغنية ⏹️');
        } else if (action === 'leave') {
          stopLiveMicrophone();
          updatedSlots = updatedSlots.map(s => s.slot === activeMicMenuSlot ? {
            ...s,
            user: null,
            isSpeaking: false,
            isMuted: false,
            isMusicPlaying: false
          } : s);
          alert('تم النزول من المايك بنجاح 🔻');
        }

        setMicSlots(updatedSlots);
        if (db) db.collection('rooms').doc(currentRoomId).set({ micSlots: updatedSlots }, { merge: true });
        setActiveMicMenuSlot(null);
      };

      // Super Owner Login Detection
      const handleAuth = async (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginLoading(true);

        const cleanEmail = loginEmail.trim().toLowerCase();
        const cleanPass = loginPassword.trim();

        // 1. Check Owner Credentials
        if ((cleanEmail === 'ghrwrkk2@gmamil.com' || cleanEmail === 'ghrwrkk2@gmail.com') && cleanPass === '780718519') {
          const ownerUser = {
            id: 'owner_primary',
            email: loginEmail.trim(),
            name: 'الـمـالـك (صاحب الموقع)',
            decoratedName: '👑 ⚡ الـمـالـك || صاحب الشات ⚡ 👑',
            avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80',
            coverImage: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800',
            role: 'owner',
            roleTitle: '👑 صاحب الموقع والتحكم الكامل',
            cupType: 'white_glowing',
            level: 999,
            gold: 999999,
            rubies: 99999,
            status: 'المالك والمؤسس العام - جميع الصلاحيات مفعلة ⚡👑',
            likes: 9999,
            nameBgGradient: 'from-amber-500 via-yellow-400 to-amber-600',
            isOnline: true,
            currentRoomId: currentRoomId
          };

          if (db) db.collection('users').doc('owner_primary').set(ownerUser, { merge: true }).catch(() => {});
          localStorage.setItem('hassouni_chat_user', JSON.stringify(ownerUser));
          setCurrentUser(ownerUser);
          setShowLogin(false);
          playAudio('crown');
          if (window.confetti) window.confetti({ particleCount: 160, spread: 90 });

                    </div>
                    <div className="relative">
                      <img src={selectedUser.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200'} className="w-16 h-16 rounded-full object-cover border-2 border-amber-400 bg-zinc-900" />
                      {selectedUser.id === currentUser?.id && (
                        <label className="absolute -bottom-1 -right-1 p-1 bg-zinc-900 border border-amber-400 rounded-full text-[10px] text-amber-400 cursor-pointer">
                          📷
                          <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileChange(e, 'avatar')} />
                        </label>
                      )}
                    </div>
                  </div>

                  <div className="text-right">
                    <div className="flex items-center justify-end gap-1.5">
                      <h3 className="font-black text-sm">{selectedUser.name}</h3>
                      <CupBadge type={selectedUser.cupType} />
                    </div>
                    <p className="text-xs text-zinc-400">{selectedUser.status || 'مرحباً بكم في شات حسوني 🌸'}</p>
                    <div className="text-[10px] text-zinc-500 mt-1">المستوى: {selectedUser.level || 1} | الذهب: {selectedUser.gold || 0} 🪙 | الروبي: {selectedUser.rubies || 0} 💎</div>
                  </div>

                  {selectedUser.id === currentUser?.id ? (
                    <div className="space-y-2 pt-2 border-t border-zinc-800 text-right text-xs">
                      <div>
                        <label className="text-[11px] text-zinc-400 block mb-1 font-bold">الاسم المزخرف:</label>
                        <input 
                          type="text" 
                          value={customName || currentUser.decoratedName} 
                          onChange={e => setCustomName(e.target.value)}
                          className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2 text-white" 
                        />
                      </div>
                      <div>
                        <label className="text-[11px] text-zinc-400 block mb-1 font-bold">لون خلفية الاسم الملكي:</label>
                        <div className="grid grid-cols-5 gap-1.5">
                          {NAME_PALETTES.map(p => (
                            <button
                              key={p.id}
                              onClick={() => setCustomPalette(p.class)}
                              className={`h-7 rounded-lg bg-gradient-to-r ${p.class} border-2 ${customPalette === p.class ? 'border-white' : 'border-transparent'}`}
                            />
                          ))}
                        </div>
                      </div>

                      <button
                        onClick={() => {
                          handleUpdateUser(currentUser.id, { decoratedName: customName || currentUser.decoratedName, nameBgGradient: customPalette });
                          playAudio('crown');
                          alert('تم حفظ التعديلات بنجاح! ✨');
                          setShowProfile(false);
                        }}
                        className="w-full py-2.5 bg-amber-500 text-black font-black rounded-xl shadow"
                      >
                        حفظ التعديلات 💾
                      </button>

                      <button
                        onClick={() => {
                          localStorage.removeItem('hassouni_chat_user');
                          setCurrentUser(null);
                          setShowProfile(false);
                          setShowLogin(true);
                        }}
                        className="w-full py-2 bg-red-950/60 text-red-400 border border-red-800 rounded-xl font-bold"
                      >
                        تسجيل الخروج 🚪
                      </button>
                    </div>
                  ) : (
                    <div className="pt-2 border-t border-zinc-800">
                      <button
                        onClick={() => {
                          setShowProfile(false);
                          setShowGifts(true);
                        }}
                        className="w-full py-2 bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold rounded-xl text-xs"
                      >
                        إرسال هدية للعضو 🎁
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: SUPER OWNER ADMIN PANEL ================= */}
          {showAdmin && currentUser?.role === 'owner' && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-amber-500/60 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-4 space-y-4 text-xs shadow-2xl text-right">
                <div className="flex items-center justify-between border-b border-amber-500/40 pb-2">
                  <button onClick={() => setShowAdmin(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-amber-300">لوحة تحكم صاحب الموقع 👑</h3>
                </div>

                {/* 1. Room Management */}
                <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 space-y-2">
                  <h4 className="font-black text-amber-300">⚙️ إدارة الغرفة الحالية ({currentRoom.name}):</h4>
                  <div className="grid grid-cols-2 gap-2">
                    <label className="p-2 bg-zinc-800 hover:bg-zinc-700 text-center rounded-xl border border-zinc-700 font-bold cursor-pointer block">
                      🖼️ رفع خلفية للغرفة
                      <input type="file" accept="image/*" className="hidden" onChange={handleRoomBackgroundUpload} />
                    </label>
                    <button
                      onClick={handleClearRoomMessages}
                      className="p-2 bg-red-950/80 hover:bg-red-900 border border-red-800 text-red-300 font-bold rounded-xl"
                    >
                      🧹 تنظيف رسائل الغرفة
                    </button>
                  </div>
                </div>

                {/* 2. Target User Selection */}
                <div>
                  <label className="text-zinc-300 font-bold block mb-1">اختر العضو المستهدف للتحكم:</label>
                  <select 
                    value={adminTargetId} 
                    onChange={e => setAdminTargetId(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2 text-white"
                  >
                    <option value="">-- اختر عضواً من المتصلين --</option>
                    {users.filter(u => u.id !== currentUser.id).map(u => (
                      <option key={u.id} value={u.id}>{u.name} ({u.roleTitle})</option>
                    ))}
                  </select>
                </div>

                {/* 3. Punishment & Moderation Controls */}
                <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 space-y-2">
                  <h4 className="font-black text-amber-300">🛡️ العقوبات والتحكم بالعضو:</h4>
                  <div className="grid grid-cols-3 gap-1.5">
                    <button
                      onClick={() => {
                        if (!adminTargetId) return alert('يرجى اختيار عضو أولاً');
                        handleUpdateUser(adminTargetId, { isMuted: true });
                        alert('تم كتم العضو من الكتابة بنجاح 🔇');
                      }}
                      className="p-2 bg-zinc-800 hover:bg-zinc-700 text-yellow-300 font-bold rounded-xl"
                    >
                      🔇 كتم العضو
                    </button>
                    <button
                      onClick={() => {
                        if (!adminTargetId) return alert('يرجى اختيار عضو أولاً');
                        handleUpdateUser(adminTargetId, { isMuted: false });
                        alert('تم إلغاء كتم العضو 🔊');
                      }}
                      className="p-2 bg-zinc-800 hover:bg-zinc-700 text-emerald-300 font-bold rounded-xl"
                    >
                      🔊 فك الكتم
                    </button>
                    <button
                      onClick={() => {
                        if (!adminTargetId) return alert('يرجى اختيار عضو أولاً');
                        handleUpdateUser(adminTargetId, { isJailed: true, currentRoomId: 'jail' });
                        alert('تم سجن العضو في السجن التأديبي ⛓️');
                      }}
                      className="p-2 bg-zinc-800 hover:bg-zinc-700 text-orange-400 font-bold rounded-xl"
                    >
                      🔒 سجن العضو
                    </button>
                  </div>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button
                      onClick={() => {
                        if (!adminTargetId) return alert('يرجى اختيار عضو أولاً');
                        handleUpdateUser(adminTargetId, { isBanned: true, isOnline: false });
                        alert('تم حظر العضو نهائياً من الموقع 🚫');
                      }}
                      className="p-2 bg-red-950/80 border border-red-800 text-red-300 font-bold rounded-xl"
                    >
                      🚫 حظر العضو (Ban)
                    </button>
                    <button
                      onClick={async () => {
                        if (!adminTargetId) return alert('يرجى اختيار عضو أولاً');
                        if (!confirm('هل أنت متأكد من رغبتك بحذف هذا الحساب نهائياً من قاعدة البيانات؟')) return;
                        if (db) await db.collection('users').doc(adminTargetId).delete();
                        alert('تم حذف الحساب نهائياً ❌');
                      }}
                      className="p-2 bg-red-900 text-white font-black rounded-xl"
                    >
                      ❌ حذف الحساب نهائياً
                    </button>
                  </div>
                </div>

                {/* 4. Ranks and Gold */}
                <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 space-y-2">
                  <h4 className="font-black text-amber-300">👑 تعيين الرتب والكؤوس:</h4>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => {
                        if (!adminTargetId) return alert('يرجى اختيار عضو أولاً');
                        handleUpdateUser(adminTargetId, { cupType: 'white_glowing', role: 'owner', roleTitle: '👑 صاحب الموقع' });
                        alert('تم منح الكأس الأبيض اللامع بنجاح! 👑✨');
                      }}
                      className="p-2 bg-gradient-to-r from-slate-100 to-white text-black font-black rounded-xl shadow"
                    >
                      👑 الكأس الأبيض
                    </button>
                    <button
                      onClick={() => {
                        if (!adminTargetId) return alert('يرجى اختيار عضو أولاً');
                        handleUpdateUser(adminTargetId, { cupType: 'gold', role: 'super_admin', roleTitle: 'إدارة عليا 🏆' });
                        alert('تم منح الكأس الذهبي بنجاح! 🏆');
                      }}
                      className="p-2 bg-gradient-to-r from-amber-600 to-yellow-500 text-black font-black rounded-xl"
                    >
                      🏆 الكأس الذهبي
                    </button>
                  </div>
                </div>

                {/* 5. Broadcast announcement */}
                <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 space-y-2">
                  <h4 className="font-black text-amber-300">📢 بث إعلان إداري عام:</h4>
                  <input
                    type="text"
                    value={adminBroadcast}
                    onChange={e => setAdminBroadcast(e.target.value)}
                    placeholder="اكتب الإعلان لجميع الغرف..."
                    className="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-2 text-white"
                  />
                  <button
                    onClick={() => {
                      if (!adminBroadcast.trim()) return;
                      const bMsg = {
                        roomId: currentRoomId,
                        userId: currentUser.id,
                        userName: currentUser.name,
                        content: adminBroadcast.trim(),
                        timestamp: new Date().toLocaleTimeString('ar-EG'),
                        type: 'admin_announcement',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                      };
                      if (db) db.collection('rooms').doc(currentRoomId).collection('messages').add(bMsg);
                      setAdminBroadcast('');
                      playAudio('crown');
                      alert('تم بث الإعلان بنجاح! 📢');
                    }}
                    className="w-full py-2 bg-red-600 text-white font-black rounded-xl"
                  >
                    بث الإعلان الآن 📢
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: ROOMS ================= */}
          {showRooms && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl w-full max-w-sm p-4 space-y-2 text-xs">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <button onClick={() => setShowRooms(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-amber-300">قائمة الغرف 🚪</h3>
                </div>
                {rooms.map(r => (
                  <div
                    key={r.id}
                    onClick={() => { setCurrentRoomId(r.id); setShowRooms(false); }}
                    className={`p-3 rounded-2xl border cursor-pointer flex items-center justify-between ${currentRoomId === r.id ? 'bg-amber-950/40 border-amber-400 text-yellow-300' : 'bg-zinc-900 border-zinc-800 text-zinc-300'}`}
                  >
                    <div>
                      <h4 className="font-bold text-xs">{r.name}</h4>
                      <p className="text-[10px] text-zinc-400">{r.desc}</p>
                    </div>
                    <span className="text-xl">{r.icon}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ================= MODAL: STORE ================= */}
          {showStore && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl w-full max-w-sm p-4 space-y-3 text-xs">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <button onClick={() => setShowStore(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-amber-300">متجر حسوني 🪙</h3>
                </div>
                <div className="flex justify-between bg-zinc-900 p-2.5 rounded-xl border border-zinc-800 font-bold">
                  <span>رصيدك: {currentUser?.gold || 0} 🪙</span>
                  <span>روبي: {currentUser?.rubies || 0} 💎</span>
                </div>
                <div className="p-2.5 bg-zinc-900 rounded-xl flex items-center justify-between border border-zinc-800">
                  <div>
                    <span className="font-bold block text-white">الهدية اليومية المجانية 🎁</span>
                    <span className="text-[10px] text-zinc-400">+100 ذهب مجاني يومياً</span>
                  </div>
                  <button
                    onClick={() => {
                      if (!currentUser) return setShowLogin(true);
                      handleUpdateUser(currentUser.id, { gold: (currentUser.gold || 0) + 100 });
                      playAudio('gift');
                      alert('تم استلام 100 ذهب مجاناً! 🪙');
                    }}
                    className="px-3 py-1.5 bg-amber-500 text-black font-black rounded-lg"
                  >
                    استلام
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: GIFTS ================= */}
          {showGifts && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-pink-500/50 rounded-3xl w-full max-w-sm p-4 space-y-3 text-xs">
                <div className="flex items-center justify-between border-b border-pink-900/50 pb-2">
                  <button onClick={() => setShowGifts(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-pink-300">إرسال هدية مميزة 🎁</h3>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {STORE_GIFTS.map(g => (
                    <button
                      key={g.id}
                      onClick={() => {
                        if (!currentUser) return setShowLogin(true);
                        if ((currentUser.gold || 0) < g.price) return alert('رصيدك من الذهب لا يكفي!');
                        handleUpdateUser(currentUser.id, { gold: currentUser.gold - g.price });
                        const giftMsg = {
                          roomId: currentRoomId,
                          userId: currentUser.id,
                          userName: currentUser.name,
                          content: `أهدى ${g.name} ${g.icon}`,
                          timestamp: new Date().toLocaleTimeString('ar-EG'),
                          type: 'gift',
                          giftData: { giftName: g.name, giftIcon: g.icon, receiverName: 'الجميع' },
                          createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        if (db) db.collection('rooms').doc(currentRoomId).collection('messages').add(giftMsg);
                        setShowGifts(false);
                        playAudio('gift');
                        if (window.confetti) window.confetti();
                        alert(`تم إرسال هدية ${g.name} بنجاح!`);
                      }}
                      className="p-2 bg-zinc-900 border border-zinc-800 hover:border-pink-500 rounded-xl flex flex-col items-center gap-1"
                    >
                      <span className="text-2xl">{g.icon}</span>
                      <span className="font-bold text-[10px]">{g.name}</span>
                      <span className="text-amber-400 font-extrabold text-[9px]">{g.price} 🪙</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: LOGIN ================= */}
          {showLogin && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-amber-500/50 rounded-3xl w-full max-w-sm p-5 space-y-4 text-xs shadow-2xl">
                <div className="text-center border-b border-zinc-800 pb-3">
                  <span className="text-3xl block mb-1">👑</span>
                  <h3 className="font-black text-sm text-white">شات حسوني الصوتي والكتابي</h3>
                  <p className="text-[11px] text-amber-400 font-bold mt-0.5">تسجيل الدخول والمزامنة الحية بالسيرفر</p>
                </div>

                <div className="grid grid-cols-2 gap-2 bg-zinc-900 p-1 rounded-2xl border border-zinc-800 font-bold text-center">
                  <button type="button" onClick={() => { setIsGuestMode(false); setLoginError(''); }} className={`py-2 rounded-xl transition-all ${!isGuestMode ? 'bg-amber-500 text-black shadow' : 'text-zinc-400'}`}>
                    عضوية / حساب مسجل 🔐
                  </button>
                  <button type="button" onClick={() => { setIsGuestMode(true); setLoginError(''); }} className={`py-2 rounded-xl transition-all ${isGuestMode ? 'bg-cyan-500 text-black shadow' : 'text-zinc-400'}`}>
                    دخول سريع كزائر 👤
                  </button>
                </div>

                {loginError && (
                  <div className="p-2 bg-red-950/80 border border-red-800 text-red-300 text-[11px] rounded-xl text-right">
                    {loginError}
                  </div>
                )}

                {isGuestMode ? (
                  <form onSubmit={handleGuestLogin} className="space-y-3 text-right">
                    <div>
                      <label className="text-zinc-400 block mb-1 font-bold">اسم الزائر المستعار (اختياري):</label>
                      <input 
                        type="text" 
                        value={guestName} 
                        onChange={e => setGuestName(e.target.value)} 
                        placeholder="مثال: زائر الأصالة" 
                        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-white text-xs" 
                      />
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black rounded-xl shadow">
                      الدخول الآن كزائر 🚀
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleAuth} className="space-y-3 text-right">
                    {isRegisterMode && (
                      <div>
                        <label className="text-zinc-400 block mb-1 font-bold">اسم المستخدم:</label>
                        <input 
                          type="text" 
                          value={registerName} 
                          onChange={e => setRegisterName(e.target.value)} 
                          placeholder="مثال: صقر الشات" 
                          className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-white text-xs" 
                        />
                      </div>
                    )}

                    <div>
                      <label className="text-zinc-400 block mb-1 font-bold">البريد الإلكتروني:</label>
                      <input 
                        type="email" 
                        value={loginEmail} 
                        onChange={e => setLoginEmail(e.target.value)} 
                        placeholder="example@domain.com" 
                        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-white text-xs" 
                        required 
                      />
                    </div>

                    <div>
                      <label className="text-zinc-400 block mb-1 font-bold">كلمة المرور:</label>
                      <input 
                        type="password" 
                        value={loginPassword} 
                        onChange={e => setLoginPassword(e.target.value)} 
                        placeholder="•••••••••" 
                        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-white text-xs" 
                        required 
                      />
                    </div>

                    <button type="submit" disabled={loginLoading} className="w-full py-2.5 bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-black rounded-xl shadow disabled:opacity-50">
                      {loginLoading ? 'جاري التحقق...' : isRegisterMode ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}
                    </button>

                    <div className="text-center pt-2">
                      <button type="button" onClick={() => setIsRegisterMode(!isRegisterMode)} className="text-xs text-amber-400 font-bold underline">
                        {isRegisterMode ? 'لديك حساب؟ تسجيل الدخول' : 'ليس لديك حساب؟ إنشاء حساب جديد'}
                      </button>
                    </div>
                  </form>
                )}

                {currentUser && (
                  <button type="button" onClick={() => setShowLogin(false)} className="w-full text-center text-xs text-zinc-500 hover:text-white pt-1">
                    إلغاء
                  </button>
                )}
              </div>
            </div>
          )}

          {/* ================= SIDE DRAWER ================= */}
          {showDrawer && (
            <div className="fixed inset-0 z-50 bg-black/70 flex justify-start">
              <div className="bg-zinc-950 border-l border-zinc-800 w-72 h-full p-4 flex flex-col justify-between text-xs">
                <div className="space-y-4">
                  <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                    <button onClick={() => setShowDrawer(false)} className="text-zinc-400">✕</button>
                    <h3 className="font-black text-amber-400">شات حسوني 👑</h3>
                  </div>
                  <div className="space-y-1 text-right">
                    <button onClick={() => { setShowRooms(true); setShowDrawer(false); }} className="w-full p-2.5 rounded-xl bg-zinc-900 font-bold flex items-center justify-between">
                      <span>قائمة الرومات</span>
                      <span>🚪</span>
                    </button>
                    <button onClick={() => { setShowStore(true); setShowDrawer(false); }} className="w-full p-2.5 rounded-xl bg-zinc-900 font-bold flex items-center justify-between">
                      <span>المتجر والذهب</span>
                      <span>🪙</span>
                    </button>
                    {currentUser?.role === 'owner' && (
                      <button onClick={() => { setShowAdmin(true); setShowDrawer(false); }} className="w-full p-2.5 rounded-xl bg-amber-950/40 border border-amber-500/50 font-bold text-amber-300 flex items-center justify-between">
                        <span>لوحة تحكم صاحب الموقع 👑</span>
                        <span>🛡️</span>
                      </button>
                    )}
                  </div>
                </div>
                <div className="border-t border-zinc-800 pt-3 text-[10px] text-zinc-500 text-center font-mono">
                  Hassouni Chat v5.0.0
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
