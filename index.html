    // --- Sound Synthesizer Utility ---
    const playAudioEffect = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'crown') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } else if (type === 'gift') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else {
          osc.frequency.setValueAtTime(650, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        }
      } catch (e) {}
    };

            <div className="flex items-center gap-2">
              <input
                type="text"
                value={inputText}
                onChange={e => setInputText(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleSendMessage()}
                placeholder="اكتب رسالتك في الشات..."
                className="flex-1 bg-zinc-950 border border-zinc-700 rounded-2xl py-2 px-3 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400"
              />
              <button onClick={handleSendMessage} className="p-2.5 bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-black rounded-2xl shadow active:scale-95">
                إرسال 🚀
              </button>
            </div>
          </div>

          {/* ================= MODAL 1: PROFILE & UPLOADS ================= */}
          {showProfile && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl w-full max-w-sm overflow-hidden text-white shadow-2xl">
                
                {/* Cover & Avatar Header */}
                <div 
                  className="h-24 w-full bg-cover bg-center relative"
                  style={{ backgroundImage: selectedUser.coverImage ? `url(${selectedUser.coverImage})` : 'linear-gradient(to right, #1e1b4b, #312e81)' }}
                >
                  <button onClick={() => setShowProfile(false)} className="absolute top-2 left-2 p-1 bg-black/60 rounded-full text-zinc-300">✕</button>
                  {selectedUser.id === currentUser.id && (
                    <label className="absolute top-2 right-2 px-2 py-1 bg-black/70 border border-amber-500/50 rounded-xl text-[10px] text-amber-300 font-bold cursor-pointer">
                      📷 رفع غلاف
                      <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileChange(e, 'coverImage')} />
                    </label>
                  )}
                </div>

                <div className="px-4 pb-4 pt-1 space-y-3">
                  <div className="flex items-end justify-between -mt-9">
                    <div className="bg-zinc-900 px-2 py-0.5 rounded-lg border border-zinc-800 text-[10px] text-amber-400 font-bold">
                      {selectedUser.roleTitle}
                    </div>
                    <div className="relative">
                      <img src={selectedUser.avatar} className="w-16 h-16 rounded-full object-cover border-2 border-amber-400 bg-zinc-900" />
                      {selectedUser.id === currentUser.id && (
                        <label className="absolute -bottom-1 -right-1 p-1 bg-zinc-900 border border-amber-400 rounded-full text-[10px] text-amber-400 cursor-pointer">
                          📷
                          <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileChange(e, 'avatar')} />
                        </label>
                      )}
                    </div>
                  </div>

                  <div className="text-right">
                    <h3 className="font-black text-sm">{selectedUser.name}</h3>
                    <p className="text-xs text-zinc-400">{selectedUser.status}</p>
                    <div className="text-[10px] text-zinc-500 mt-1">المستوى: {selectedUser.level} | الذهب: {selectedUser.gold} 🪙 | الروبي: {selectedUser.rubies} 💎</div>
                  </div>

                  {selectedUser.id === currentUser.id && (
                    <div className="space-y-2 pt-2 border-t border-zinc-800 text-right">
                      <div>
                        <label className="text-[11px] text-zinc-400 block mb-1">الاسم المزخرف:</label>
                        <input 
                          type="text" 
                          value={customName} 
                          onChange={e => setCustomName(e.target.value)}
                          className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2 text-xs text-white" 
                        />
                      </div>
                      <div>
                        <label className="text-[11px] text-zinc-400 block mb-1">لون خلفية الاسم الملكي:</label>
                        <div className="grid grid-cols-5 gap-1.5">
                          {NAME_PALETTES.map(p => (
                            <button
                              key={p.id}
                              onClick={() => setCustomPalette(p.class)}
                              className={`h-7 rounded-lg bg-gradient-to-r ${p.class} border-2 ${customPalette === p.class ? 'border-white' : 'border-transparent'}`}
                            />
                          ))}
                        </div>
                      </div>
                      
                      {/* Background Uploader */}
                      <label className="block w-full py-2 bg-zinc-900 border border-dashed border-zinc-700 hover:border-amber-400 text-center rounded-xl text-xs font-bold text-zinc-300 cursor-pointer">
                        🌌 رفع خلفية مخصصة للبروفايل
                        <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileChange(e, 'customBackground')} />
                      </label>

                      <button
                        onClick={() => {
                          handleUpdateUser(currentUser.id, { decoratedName: customName, nameBgGradient: customPalette, status: customStatus });
                          playAudioEffect('crown');
                          alert('تم حفظ وتطبيق التعديلات والزخارف بنجاح! ✨');
                          setShowProfile(false);
                        }}
                        className="w-full py-2.5 bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-black text-xs rounded-xl shadow"
                      >
                        حفظ التعديلات 💾
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 2: SUPER OWNER ADMIN PANEL ================= */}
          {showAdmin && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-amber-500/60 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-4 space-y-4 text-xs">
                <div className="flex items-center justify-between border-b border-amber-500/40 pb-2">
                  <button onClick={() => setShowAdmin(false)} className="text-zinc-400 hover:text-white">✕</button>
                  <h3 className="font-black text-sm text-amber-300">لوحة تحكم صاحب الموقع 👑</h3>
                </div>

                <div>
                  <label className="text-zinc-300 font-bold block mb-1">اختر العضو المستهدف:</label>
                  <select 
                    value={adminTargetId} 
                    onChange={e => setAdminTargetId(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2 text-white"
                  >
                    {users.map(u => (
                      <option key={u.id} value={u.id}>{u.name} ({u.roleTitle})</option>
                    ))}
                  </select>
                </div>

                <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 space-y-2">
                  <h4 className="font-black text-amber-300">تعيين الرتب والكؤوس:</h4>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => {
                        handleUpdateUser(adminTargetId, { cupType: 'white_glowing', role: 'owner', roleTitle: '👑 صاحب الموقع' });
                        if (window.confetti) window.confetti();
                        playAudioEffect('crown');
                        alert('تم تعيين الكأس الأبيض اللامع بنجاح! 👑✨');
                      }}
                      className="p-2 bg-gradient-to-r from-slate-100 to-white text-black font-black rounded-xl shadow"
                    >
                      👑 الكأس الأبيض اللامع
                    </button>
                    <button
                      onClick={() => {
                        handleUpdateUser(adminTargetId, { cupType: 'gold', role: 'super_admin', roleTitle: 'إدارة عليا 🏆' });
                        playAudioEffect('crown');
                        alert('تم تعيين الكأس الذهبي بنجاح! 🏆');
                      }}
                      className="p-2 bg-gradient-to-r from-amber-600 to-yellow-500 text-black font-black rounded-xl"
                    >
                      🏆 الكأس الذهبي
                    </button>
                  </div>
                </div>

                <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 space-y-2">
                  <h4 className="font-black text-amber-300">شحن النقاط والذهب:</h4>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <span className="text-[10px] text-zinc-400 block mb-1">الذهب:</span>
                      <input 
                        type="number" 
                        value={adminGold} 
                        onChange={e => setAdminGold(Number(e.target.value))}
                        className="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-1.5 text-white" 
                      />
                    </div>
                    <div>
                      <span className="text-[10px] text-zinc-400 block mb-1">الروبي:</span>
                      <input 
                        type="number" 
                        value={adminRubies} 
                        onChange={e => setAdminRubies(Number(e.target.value))}
                        className="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-1.5 text-white" 
                      />
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      const t = users.find(u => u.id === adminTargetId);
                      if (t) {
                        handleUpdateUser(adminTargetId, { gold: t.gold + adminGold, rubies: t.rubies + adminRubies });
                        playAudioEffect('gift');
                        alert(`تم إرسال ${adminGold} ذهب و ${adminRubies} روبي بنجاح!`);
                      }
                    }}
                    className="w-full py-2 bg-amber-500 text-black font-black rounded-xl"
                  >
                    إرسال الرصيد فوراً 🪙💎
                  </button>
                </div>

                <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 space-y-2">
                  <h4 className="font-black text-amber-300">بث إعلان إداري عام:</h4>
                  <input
                    type="text"
                    value={adminBroadcast}
                    onChange={e => setAdminBroadcast(e.target.value)}
                    placeholder="اكتب الإعلان هنا..."
                    className="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-2 text-white"
                  />
                  <button
                    onClick={() => {
                      if (!adminBroadcast.trim()) return;
                      const bMsg = {
                        id: 'b-' + Date.now(),
                        roomId: currentRoomId,
                        user: currentUser,
                        text: adminBroadcast,
                        time: new Date().toLocaleTimeString('ar-EG'),
                        type: 'broadcast'
                      };
                      setMessages(prev => [...prev, bMsg]);
                      setAdminBroadcast('');
                      playAudioEffect('crown');
                      alert('تم بث الإعلان لجميع الغرف 📢');
                    }}
                    className="w-full py-2 bg-red-600 text-white font-black rounded-xl"
                  >
                    بث الإعلان الآن 📢
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 3: LOGIN MODAL ================= */}
          {showLogin && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-amber-500/50 rounded-3xl w-full max-w-sm p-5 space-y-4 text-xs">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <button onClick={() => setShowLogin(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-amber-300">تسجيل الدخول / لوحة المالك</h3>
                </div>

                <button
                  onClick={handleDirectOwnerLogin}
                  className="w-full py-3 bg-gradient-to-r from-slate-100 via-white to-slate-200 text-slate-900 font-black rounded-2xl shadow-[0_0_20px_rgba(255,255,255,0.8)] border-2 border-white text-center"
                >
                  👑 دخول مباشر بصلاحيات صاحب الموقع (الكأس الأبيض)
                </button>

                <div className="space-y-2 text-right">
                  <div>
                    <label className="text-zinc-400 block mb-1">البريد الإلكتروني:</label>
                    <input 
                      type="email" 
                      value={loginEmail} 
                      onChange={e => setLoginEmail(e.target.value)}
                      className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2 text-white" 
                    />
                  </div>
                  <div>
                    <label className="text-zinc-400 block mb-1">كلمة المرور:</label>
                    <input 
                      type="password" 
                      value={loginPassword} 
                      onChange={e => setLoginPassword(e.target.value)}
                      className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2 text-white" 
                    />
                  </div>
                  <button
                    onClick={() => {
                      if (loginEmail === 'ghrwrkk2@gmamil.com' && loginPassword === '780718519') {
                        handleDirectOwnerLogin();
                      } else {
                        alert('تم تسجيل الدخول كعضو عادي');
                        setShowLogin(false);
                      }
                    }}
                    className="w-full py-2.5 bg-amber-500 text-black font-black rounded-xl"
                  >
                    تسجيل الدخول
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 4: STORE ================= */}
          {showStore && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl w-full max-w-sm p-4 space-y-3 text-xs">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <button onClick={() => setShowStore(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-amber-300">متجر النخبة 🪙</h3>
                </div>
                <div className="flex justify-between bg-zinc-900 p-2.5 rounded-xl border border-zinc-800 font-bold">
                  <span>رصيدك: {currentUser.gold} 🪙</span>
                  <span>روبي: {currentUser.rubies} 💎</span>
                </div>
                <div className="p-2.5 bg-zinc-900 rounded-xl flex items-center justify-between border border-zinc-800">
                  <div>
                    <span className="font-bold block text-white">الهدية اليومية المجانية 🎁</span>
                    <span className="text-[10px] text-zinc-400">+100 ذهب مجاني يومياً</span>
                  </div>
                  <button
                    onClick={() => {
                      handleUpdateUser(currentUser.id, { gold: currentUser.gold + 100 });
                      playAudioEffect('gift');
                      alert('تم استلام 100 ذهب مجاناً! 🪙');
                    }}
                    className="px-3 py-1.5 bg-amber-500 text-black font-black rounded-lg"
                  >
                    استلام
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 5: GIFTS ================= */}
          {showGifts && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-pink-500/50 rounded-3xl w-full max-w-sm p-4 space-y-3 text-xs">
                <div className="flex items-center justify-between border-b border-pink-900/50 pb-2">
                  <button onClick={() => setShowGifts(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-pink-300">إرسال هدية مميزة 🎁</h3>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {STORE_GIFTS.map(g => (
                    <button
                      key={g.id}
                      onClick={() => {
                        if (currentUser.gold < g.price) {
                          alert('رصيدك من الذهب لا يكفي!');
                          return;
                        }
                        handleUpdateUser(currentUser.id, { gold: currentUser.gold - g.price });
                        const giftMsg = {
                          id: 'g-' + Date.now(),
                          roomId: currentRoomId,
                          user: currentUser,
                          giftName: g.name,
                          giftIcon: g.icon,
                          receiver: users.find(u => u.id !== currentUser.id)?.name || 'الجميع',
                          time: new Date().toLocaleTimeString('ar-EG'),
                          type: 'gift'
                        };
                        setMessages(prev => [...prev, giftMsg]);
                        setShowGifts(false);
                        playAudioEffect('gift');
                        if (window.confetti) window.confetti();
                        alert(`تم إرسال هدية ${g.name} ${g.icon} بنجاح!`);
                      }}
                      className="p-2 bg-zinc-900 border border-zinc-800 hover:border-pink-500 rounded-xl flex flex-col items-center gap-1"
                    >
                      <span className="text-2xl">{g.icon}</span>
                      <span className="font-bold text-[10px]">{g.name}</span>
                      <span className="text-amber-400 font-extrabold text-[9px]">{g.price} 🪙</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 6: ROOMS ================= */}
          {showRooms && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl w-full max-w-sm p-4 space-y-2">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <button onClick={() => setShowRooms(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-amber-300">قائمة الغرف 🚪</h3>
                </div>
                {INITIAL_ROOMS.map(r => (
                  <div
                    key={r.id}
                    onClick={() => { setCurrentRoomId(r.id); setShowRooms(false); }}
                    className={`p-3 rounded-2xl border cursor-pointer flex items-center justify-between transition-all ${currentRoomId === r.id ? 'bg-amber-950/40 border-amber-400 text-yellow-300' : 'bg-zinc-900 border-zinc-800 text-zinc-300'}`}
                  >
                    <div>
                      <h4 className="font-bold text-xs">{r.name}</h4>
                      <p className="text-[10px] text-zinc-400">{r.desc}</p>
                    </div>
                    <span className="text-xl">{r.icon}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ================= SIDE DRAWER ================= */}
          {showDrawer && (
            <div className="fixed inset-0 z-50 bg-black/70 flex justify-start">
              <div className="bg-zinc-950 border-l border-zinc-800 w-72 h-full p-4 flex flex-col justify-between text-xs">
                <div className="space-y-4">
                  <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                    <button onClick={() => setShowDrawer(false)} className="text-zinc-400">✕</button>
                    <h3 className="font-black text-amber-400">شات النخبة 👑</h3>
                  </div>
                  <div className="space-y-1">
                    <button onClick={() => { setShowRooms(true); setShowDrawer(false); }} className="w-full p-2.5 rounded-xl bg-zinc-900 text-right font-bold flex items-center justify-between">
                      <span>قائمة الرومات</span>
                      <span>🚪</span>
                    </button>
                    <button onClick={() => { setShowStore(true); setShowDrawer(false); }} className="w-full p-2.5 rounded-xl bg-zinc-900 text-right font-bold flex items-center justify-between">
                      <span>المتجر والذهب</span>
                      <span>🪙</span>
                    </button>
                    {currentUser.role === 'owner' && (
                      <button onClick={() => { setShowAdmin(true); setShowDrawer(false); }} className="w-full p-2.5 rounded-xl bg-amber-950/40 border border-amber-500/50 text-right font-bold text-amber-300 flex items-center justify-between">
                        <span>لوحة تحكم صاحب الموقع 👑</span>
                        <span>🛡️</span>
                      </button>
                    )}
                  </div>
                </div>
                <div className="border-t border-zinc-800 pt-3 text-[10px] text-zinc-500 text-center font-mono">
                  Elite Audio & Text Chat v3.5.0
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
