!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شات حسوني - النسخة الإمبراطورية السحابية المطورة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --gold: #ffd700; 
            --king-grad: linear-gradient(145deg, #ffd700, #b8860b); 
            --dark-bg: #0a0a0a; 
            --card-bg: #121212; 
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100vh; background: var(--dark-bg); color: #fff; overflow: hidden; }

        #welcomeOverlay { display: flex; position: fixed; inset: 0; background: #0a0a0a; z-index: 9999999; align-items: center; justify-content: center; padding: 15px; }

        .header-bar { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(15, 15, 15, 0.98); display: flex; align-items: center; justify-content: space-around; z-index: 1000; border-bottom: 2px solid var(--gold); }
        
        /* تحسين شريط الإدخال لضمان عدم اختفاء الأزرار */
        .input-section { position: fixed; bottom: 60px; width: 100%; height: 65px; background: #111; padding: 0 10px; display: flex; align-items: center; gap: 5px; border-top: 1px solid #222; z-index: 1000; }
        .chat-input { flex: 1; background: #1a1a1a; border: 1px solid var(--gold); color: #fff; height: 40px; border-radius: 20px; padding: 0 15px; outline: none; }
        .send-btn-arrow { background: var(--king-grad); border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; cursor: pointer; flex-shrink: 0; }
        .right-input-btn { font-size: 18px; color: var(--gold); cursor: pointer; padding: 5px; flex-shrink: 0; width: 35px; text-align: center; }

        #chatBox { height: calc(100vh - 185px); overflow-y: auto; padding-top: 140px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 12px; background-size: cover; background-position: center; transition: background 0.5s ease; }
        
        .msg-wrap { display: flex; flex-direction: column; align-self: flex-start; width: 95%; max-width: 420px; background: rgba(18, 22, 28, 0.94); padding: 12px; border-radius: 18px; border: 1.5px solid rgba(255, 215, 0, 0.4); margin: 0 auto; }
        .system-gold-gift { background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(184,134,11,0.2)); border: 2px solid #ffd700; width: 95%; text-align: center; }

        /* بقية التنسيقات كما هي للحفاظ على هويتك */
        .mics-wrapper { position: fixed; top: 65px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 999; }
        .footer-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #111; display: flex; align-items: center; justify-content: space-around; border-top: 2px solid var(--gold); z-index: 1000; }
    </style>
</head>
<body>

<div id="welcomeOverlay">
    <!-- محتوى الترحيب كما هو -->
    <div class="king-card">
        <h2 style="text-align:center; color:var(--gold);">شات حسوني - النسخة الإمبراطورية</h2>
        <div class="btn-row">
            <button class="row-btn" id="btn_b1" onclick="ui.switchBranch('b1')">دخول زائر</button>
            <button class="row-btn" id="btn_b2" onclick="ui.switchBranch('b2')">عضوية</button>
        </div>
        <div id="b1" class="branch-content"><input type="text" id="vName" class="form-control" placeholder="الاسم..."> <button class="row-btn active" onclick="ui.loginAsGuest()">دخول</button></div>
    </div>
</div>

<div class="header-bar">
    <div class="header-user-bg-btn" id="userHeaderBgIcon" onclick="ui.openProfileHeaderBgMenu()"></div>
    <div class="header-btn" onclick="ui.openNotificationsList()"><i class="fas fa-bell"></i></div>
    <div class="header-btn" onclick="ui.openSideThreeLinesMenu()"><i class="fas fa-bars"></i></div>
</div>

<div class="mics-wrapper" id="micsWrapper">
    <div class="mics-container-floating" id="micsContainer">
        <!-- المايكات -->
    </div>
</div>

<div id="chatBox"></div>

<div class="input-section">
    <button class="send-btn-arrow" onclick="ui.sendMessage()"><i class="fas fa-paper-plane"></i></button>
    <input type="text" id="msgInp" class="chat-input" placeholder="اكتب رسالتك...">
    <div class="right-input-btn" onclick="ui.openEmojiPicker()"><i class="fas fa-smile"></i></div>
    <div class="right-input-btn" onclick="ui.clickMicSlot(1)"><i class="fas fa-microphone"></i></div>
    <div class="right-input-btn" onclick="ui.openPlusPlusMenu()"><i class="fas fa-plus-circle"></i></div>
</div>

<div class="footer-nav">
    <div class="f-btn" onclick="ui.toggleOnlineUsers()"><i class="fas fa-users"></i></div>
    <div class="f-btn" onclick="ui.openRoomsManager()"><i class="fas fa-door-open"></i></div>
    <div class="f-btn" onclick="ui.refreshChatWindowOnly()"><i class="fas fa-sync-alt"></i></div>
</div>

<script>
    // الإعدادات ثابتة (يرجى التأكد من أن مفاتيح Firebase صحيحة)
    const firebaseConfig = { /* مفاتيحك الأصلية */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // دالة المزامنة المحدثة للرسائل
    ui.listenToGlobalMessages = () => {
        if(window.activeMessagesListener) window.activeMessagesListener();
        window.activeMessagesListener = db.collection("rooms").doc(window.currentRoom).collection("messages")
          .orderBy("timestamp", "asc")
          .onSnapshot((snapshot) => {
              let chatBox = document.getElementById('chatBox');
              // تفريغ الشات عند التحديث لضمان التزامن ومنع التكرار
              chatBox.innerHTML = ""; 
              snapshot.forEach((doc) => {
                  let mData = doc.data();
                  if (mData.isSystemGold) ui.renderSystemGoldMsg(mData.text);
                  else ui.renderMsg(mData.user, mData.text);
              });
              chatBox.scrollTop = chatBox.scrollHeight;
          });
    };

    // دالة تحديث خلفية الروم بشكل حي
    ui.listenToRoomSettings = () => {
        window.activeRoomSettingsListener = db.collection("room_settings").doc(window.currentRoom).onSnapshot((doc) => {
            if(doc.exists && doc.data().roomBg) {
                document.getElementById('chatBox').style.backgroundImage = `url('${doc.data().roomBg}')`;
            }
        });
    };

    // بقية الدوال الخاصة بك كما هي لضمان عدم ضياع أي كود...
</script>
</body>
</html
