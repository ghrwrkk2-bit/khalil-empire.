<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شات حسوني - النسخة الإمبراطورية السحابية المطورة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --gold: #ffd700; 
            --king-grad: linear-gradient(145deg, #ffd700, #b8860b); 
            --dark-bg: #0a0a0a; 
            --card-bg: #121212; 
            --user-bg-color: rgba(255, 215, 0, 0.05);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100vh; background: var(--dark-bg); color: #fff; overflow: hidden; }

        #welcomeOverlay {
            display: flex; 
            position: fixed; 
            inset: 0; 
            background: #0a0a0a; 
            z-index: 9999999; 
            align-items: center; 
            justify-content: center; 
            padding: 15px;
        }

        /* الشريط العلوي المعاد ترتيبه حسب الطلب */
        .header-bar { position: fixed; top: 0; width: 100%; height: 65px; background: rgba(15, 15, 15, 0.98); display: flex; align-items: center; justify-content: space-around; z-index: 1000; border-bottom: 2px solid var(--gold); padding: 0 5px; }
        .header-btn { color: #fff; font-size: 11px; text-align: center; cursor: pointer; flex: 1; position: relative; }
        .header-btn i { display: block; font-size: 18px; color: var(--gold); margin-bottom: 2px; }

        /* أيقونة خلفية البروفايل العلوية في أقصى اليمين */
        .header-user-bg-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            background-size: cover;
            background-position: center;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #222;
            flex-shrink: 0;
        }

        /* تصميم المايكات */
        .mics-wrapper {
            position: fixed;
            top: 65px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 999;
            transition: all 0.3s ease;
        }
        .mics-container-floating { 
            background: rgba(220, 225, 230, 0.88); 
            backdrop-filter: blur(8px);
            border-radius: 20px; 
            padding: 6px 14px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.4);
        }
        .floating-mic-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1877f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            position: relative;
            background-size: cover;
            background-position: center;
        }
        .floating-mic-circle .mic-num-sub {
            font-size: 10px;
            margin-top: 1px;
            font-weight: bold;
        }
        .floating-mic-circle.occupied i { display: none; }
        .mic-control-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #0062e0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .mics-toggle-arrow-btn {
            background: #1877f2;
            color: white;
            border: none;
            width: 32px;
            height: 20px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-top: -1px;
        }

        #chatBox { height: calc(100vh - 185px); overflow-y: auto; padding: 140px 15px 85px; display: flex; flex-direction: column; gap: 12px; background: #0f0f0f url('https://i.ibb.co/6wXbYm2/butterflies.jpg') center center/cover no-repeat; }
        
        .msg-wrap { display: flex; flex-direction: column; align-self: flex-start; width: 95%; max-width: 420px; background: rgba(18, 22, 28, 0.94); padding: 12px; border-radius: 18px; border: 1.5px solid rgba(255, 215, 0, 0.4); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .msg-wrap.system-gold-gift {
            background: linear-gradient(135deg, rgba(255,215,0,0.25), rgba(184,134,11,0.35)) !important;
            border: 2px solid #ffd700 !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6) !important;
            width: 100% !important;
            max-width: 100% !important;
            text-align: center;
        }
        
        .msg-header { display: flex; align-items: center; gap: 10px; width: 100%; }
        
        .pfp-main-frame { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gold); box-shadow: 0 0 8px var(--gold); display: flex; align-items: center; justify-content: center; background: #000; flex-shrink: 0; }
        .pfp-main { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; cursor: pointer; }
        
        .rank-standalone-icon {
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.3);
            flex-shrink: 0;
        }

        .king-name-container {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(145deg, #1e1e1e, #111111);
            border: 1px solid var(--gold);
            padding: 4px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.2);
            cursor: pointer;
        }
        .king-name-tag { 
            font-size: 13px; 
            font-weight: bold; 
            text-shadow: 0 0 3px rgba(255,215,0,0.3);
        }

        .msg-time-stamp {
            font-size: 10px;
            color: #aaa;
            margin-right: auto;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .msg-text { color: #fff; font-size: 14px; line-height: 1.5; margin-top: 8px; padding-right: 5px; word-break: break-word; }

        /* شريط الإدخال المطور بتصميم مصغر للزر السهم والأزرار المجاورة */
        .input-section { position: fixed; bottom: 60px; width: 100%; height: 65px; background: #111; padding: 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #222; z-index: 1000; }
        .chat-input { flex: 1; background: #1a1a1a; border: 1px solid var(--gold); color: #fff; height: 42px; border-radius: 20px; padding: 0 15px; outline: none; }
        
        /* زر إرسال مصغر بشكل سهم */
        .send-btn-arrow { 
            background: var(--king-grad); 
            border: none; 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #000; 
            font-size: 16px; 
            cursor: pointer; 
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(255,215,0,0.4);
        }
        .right-input-btn { font-size: 20px; color: var(--gold); cursor: pointer; padding: 4px; flex-shrink: 0; }

        .footer-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #111; display: flex; align-items: center; justify-content: space-around; border-top: 2px solid var(--gold); z-index: 1000; }
        .f-btn { text-align: center; font-size: 10px; color: #fff; cursor: pointer; flex: 1; padding: 5px 0; }
        .f-btn i { display: block; font-size: 16px; margin-bottom: 2px; color: #fff; }

        .king-card { background: var(--card-bg); width: 100%; max-width: 520px; max-height: 95vh; border: 3px solid var(--gold); border-radius: 20px; padding: 20px; overflow-y: auto; box-shadow: 0 0 25px rgba(255, 215, 0, 0.3); display: flex; flex-direction: column; }
        
        .btn-row { display: flex; justify-content: center; gap: 8px; margin: 15px 0; width: 100%; }
        .row-btn { flex: 1; padding: 11px 5px; font-size: 12px; background: #1c1c1c; border: 1px solid var(--gold); color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
        .row-btn.active { background: var(--king-grad); color: #000; }
        
        .branch-content { display: none; background: #161616; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; }
        .form-control { width: 100%; padding: 11px; margin-bottom: 11px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; text-align: right; }
        .form-select { width: 100%; padding: 11px; margin-bottom: 11px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; text-align: right; }
        .file-input-label { display: block; width: 100%; padding: 11px; margin-bottom: 11px; background: #2a2a2a; border: 1px dashed var(--gold); color: var(--gold); border-radius: 8px; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold; }
        .file-input-hidden { display: none; }

        .feature-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100000; align-items: center; justify-content: center; padding: 15px; }
        .feature-card { background: #121212; width: 100%; max-width: 460px; border: 2px solid var(--gold); border-radius: 15px; padding: 20px; max-height: 85vh; overflow-y: auto; position: relative; }
        .half-screen-modal { display: none; position: fixed; bottom: 60px; left: 0; width: 100%; height: 50vh; background: rgba(14, 14, 14, 0.98); border-top: 3px solid var(--gold); z-index: 999; overflow-y: auto; padding: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }

        .menu-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #fff; justify-content: space-between; }
        .menu-item:hover { background: rgba(255,255,255,0.03); }

        .yt-preview-card {
            background: #1a1a1a;
            border: 2px solid #ff3333;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .profile-card-wrapper { text-align: center; color: #fff; position: relative; }
        .profile-card-cover { width: 100%; height: 140px; border-radius: 10px; object-fit: cover; border: 1px solid #333; }
        .profile-card-pfp { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--gold); margin-top: -45px; object-fit: cover; background: #111; position: relative; z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .profile-edit-pencil { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); border: 1px solid var(--gold); color: var(--gold); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
        .profile-action-bar { display: flex; background: rgba(255,255,255,0.04); border: 1px solid #333; padding: 10px; border-radius: 8px; justify-content: space-around; margin: 15px 0; align-items: center; }
        .profile-bar-btn { text-align: center; color: #fff; cursor: pointer; font-size: 12px; flex: 1; }
        .profile-bar-btn i { display: block; font-size: 16px; color: var(--gold); margin-bottom: 3px; }

        .online-user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid #222;
        }
        .online-user-left { display: flex; align-items: center; gap: 10px; }
        .online-user-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold); }
        .online-user-bg-btn {
            font-size: 14px;
            color: var(--gold);
            cursor: pointer;
            padding: 4px 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 6px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        
        .private-chat-box {
            display: flex;
            flex-direction: column;
            height: 320px;
            background: #0a0a0a;
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .private-msg-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        .private-msg-bubble {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            word-break: break-word;
        }
        .private-msg-mine { align-self: flex-end; background: var(--gold); color: #000; font-weight: bold; }
        .private-msg-other { align-self: flex-start; background: #222; color: #fff; border: 1px solid #444; }

        .plus-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: center;
        }
        .plus-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 12px;
            padding: 12px 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .plus-item:hover { background: rgba(255,215,0,0.15); }
        .plus-item i { font-size: 24px; color: var(--gold); display: block; margin-bottom: 5px; }
        .plus-item span { font-size: 12px; color: #fff; font-weight: bold; }

        .emoji-picker-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            font-size: 22px;
            text-align: center;
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
        }
        .emoji-picker-item {
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .emoji-picker-item:hover { background: rgba(255,215,0,0.2); }

        #hiddenAudioNode { display: none; }
        #youtubeVideoFrameContainer { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
    </style>
</head>
<body>

<audio id="hiddenAudioNode" loop></audio>
<div id="youtubeVideoFrameContainer"></div>

<!-- واجهة تسجيل الدخول والترحيب -->
<div id="welcomeOverlay">
    <div class="king-card">
        <h2 style="text-align:center; color:var(--gold); margin:0 0 5px;">شات حسوني - النسخة الإمبراطورية</h2>
        <p style="text-align:center; font-size:12px; margin:0 0 10px; color:#aaa;">أهلاً وسهلاً بكم في شات عربي دردشة عربية محمية بالكامل</p>
        
        <div class="btn-row">
            <button class="row-btn" id="btn_b1" onclick="ui.switchBranch('b1')">دخول زائر</button>
            <button class="row-btn" id="btn_b2" onclick="ui.switchBranch('b2')">دخول عضوية</button>
            <button class="row-btn" id="btn_b3" onclick="ui.switchBranch('b3')">سجل الآن</button>
        </div>

        <div id="b1" class="branch-content">
            <input type="text" id="vName" class="form-control" placeholder="الاسم المستعار للزائر (مطلوب)...">
            <select id="vAge" class="form-select">
                <option value="">اختر العمر (مطلوب)...</option>
                <script>
                    for(let i=15; i<=100; i++) { document.write(`<option value="${i}">${i}</option>`); }
                </script>
            </select>
            <select id="vGender" class="form-select">
                <option value="">اختر الجنس (مطلوب)...</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
            <button class="row-btn active" style="width:100%; border-radius:8px; padding:12px;" onclick="ui.loginAsGuest()">دخول الآن كـ زائر</button>
        </div>

        <div id="b2" class="branch-content">
            <input type="text" id="logUser" class="form-control" placeholder="الاسم المستعار أو البريد الإلكتروني...">
            <input type="password" id="logPass" class="form-control" placeholder="كلمة المرور الحالية...">
            <button class="row-btn active" style="width:100%; border-radius:8px; padding:12px;" onclick="ui.loginAsRegistered(false)">تسجيل الدخول الفوري</button>
        </div>

        <div id="b3" class="branch-content">
            <input type="text" id="rName" class="form-control" placeholder="الاسم المستعار الجديد...">
            <input type="email" id="rEmail" class="form-control" placeholder="البريد الإلكتروني المعتمد...">
            <input type="password" id="rPass" class="form-control" placeholder="كلمة المرور السرية...">
            <button class="row-btn active" style="width:100%; border-radius:8px; padding:12px;" onclick="ui.loginAsRegistered(true)">إتمام التسجيل ودخول</button>
        </div>
    </div>
</div>

<!-- الشريط العلوي المعدل بالتسلسل المطلوب: الأيقونة مع الخلفية، إشعار، بلاغ، خاص، الكبار، الأثرياء، زرر 3 خطوط -->
<div class="header-bar">
    <!-- أيقونة خلفية البروفايل بجانب الجهة اليمنى -->
    <div class="header-user-bg-btn" id="userHeaderBgIcon" title="خلفيتك الحالية" onclick="ui.openProfileHeaderBgMenu()">
        <i class="fas fa-user-circle" style="font-size:20px; color:var(--gold);" id="userHeaderBgDefaultIcon"></i>
    </div>

    <div class="header-btn" onclick="ui.openNotificationsList()"><i class="fas fa-bell"></i>إشعار</div>
    <div class="header-btn" onclick="ui.openReportsList()"><i class="fas fa-flag"></i>بلاغ</div>
    <div class="header-btn" onclick="ui.openPrivateConversationsList()"><i class="fas fa-comments"></i>الخاص</div>
    <div class="header-btn" onclick="ui.openVIPList('الكبار')"><i class="fas fa-crown"></i>الكبار</div>
    <div class="header-btn" onclick="ui.openVIPList('الأثرياء')"><i class="fas fa-gem"></i>الأثرياء</div>
    <div class="header-btn" onclick="ui.openSideThreeLinesMenu()"><i class="fas fa-bars"></i>خيارات</div>
</div>

<!-- حاوية المايكات بتصميم أزرق حديث مع زر السهم للإخفاء والإظهار -->
<div class="mics-wrapper" id="micsWrapper">
    <div class="mics-container-floating" id="micsContainer">
        <div class="floating-mic-circle" id="mic_1" onclick="ui.clickMicSlot(1)">
            <i class="fas fa-microphone"></i>
            <span class="mic-num-sub" id="micName_1">1</span>
        </div>
        <div class="floating-mic-circle" id="mic_2" onclick="ui.clickMicSlot(2)">
            <i class="fas fa-microphone"></i>
            <span class="mic-num-sub" id="micName_2">2</span>
        </div>
        <div class="floating-mic-circle" id="mic_3" onclick="ui.clickMicSlot(3)">
            <i class="fas fa-microphone"></i>
            <span class="mic-num-sub" id="micName_3">3</span>
        </div>
        <div class="floating-mic-circle" id="mic_4" onclick="ui.clickMicSlot(4)">
            <i class="fas fa-microphone"></i>
            <span class="mic-num-sub" id="micName_4">4</span>
        </div>
        <div class="mic-control-btn" onclick="ui.openMicSettingsMenu()"><i class="fas fa-cog"></i></div>
    </div>
    <button class="mics-toggle-arrow-btn" onclick="ui.toggleMicsVisibility()"><i class="fas fa-chevron-up" id="micsToggleIcon"></i></button>
</div>

<div id="chatBox"></div>

<!-- شريط الإدخال السفلي المطوّر: زر الإرسال سهم مصغر باليسار، المايك والإيموجي والإضافة باليمين -->
<div class="input-section">
    <button class="send-btn-arrow" onclick="ui.sendMessage()" title="إرسال"><i class="fas fa-paper-plane"></i></button>
    <input type="text" id="msgInp" class="chat-input" placeholder="اكتب رسالتك العامة هنا بكل حرية..." onkeypress="if(event.key==='Enter') ui.sendMessage()">
    
    <div class="right-input-btn" onclick="ui.openEmojiPicker()" title="إيموجيات وصفحة"><i class="fas fa-smile"></i></div>
    <div class="right-input-btn" onclick="ui.clickMicSlot(1)" title="صوت المايك"><i class="fas fa-microphone"></i></div>
    <div class="right-input-btn" onclick="ui.openPlusPlusMenu()" title="المزيد من الخيارات"><i class="fas fa-plus-circle"></i></div>
</div>

<!-- الشريط السفلي للتنقل -->
<div class="footer-nav">
    <div class="f-btn" onclick="ui.toggleOnlineUsers()"><i class="fas fa-users"></i>المتواجدين</div>
    <div class="f-btn" onclick="ui.openRoomsManager()"><i class="fas fa-door-open"></i>الغرف</div>
    <div class="f-btn" onclick="ui.refreshChatWindowOnly()"><i class="fas fa-sync-alt"></i>تحديث</div>
    <div class="f-btn" id="ytFooterBtn" onclick="ui.openYouTubeSearchEngine()"><i class="fab fa-youtube" style="color:#ff3333"></i>يوتيوب</div>
    <div class="f-btn" id="authBtn" onclick="ui.showAuthBranchDirect()"><i class="fas fa-key" style="color:var(--gold)"></i><span>المفتاح الملكي</span></div>
    <div class="f-btn" onclick="ui.openGlobalSettings()"><i class="fas fa-cogs"></i>الإعدادات</div>
</div>

    function formatTime(timestamp) {
        if (!timestamp) return "";
        let date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        let hours = date.getHours().toString().padStart(2, '0');
        let minutes = date.getMinutes().toString().padStart(2, '0');
        let seconds = date.getSeconds().toString().padStart(2, '0');
        return `[${hours}:${minutes}:${seconds}]`;
    }

        saveUserToFirestoreAndSession: (user) => {
            localStorage.setItem('hassouni_session_user', JSON.stringify(user));
            db.collection("users").doc(user.uid).set(user, { merge: true });
        },
        checkSavedSessionOnStart: () => {
            let saved = localStorage.getItem('hassouni_session_user');
            if(saved) {
                try {
                    let parsedUser = JSON.parse(saved);
                    db.collection("users").doc(parsedUser.uid).get().then(doc => {
                        if(doc.exists) {
                            window.currentUser = doc.data();
                        } else {
                            window.currentUser = parsedUser;
                        }
                        ui.enterChat();
                    }).catch(() => {
                        window.currentUser = parsedUser;
                        ui.enterChat();
                    });
                } catch(e) {
                    console.log("Session error", e);
                }
            } else {
                ui.switchBranch('b1');
            }
        },
        enterChat: () => {
            document.getElementById('welcomeOverlay').style.display = 'none';
            ui.updateRoyalKeyButtonVisibility();
            
            if(window.currentUser) {
                db.collection("users").doc(window.currentUser.uid).update({ isOnline: true, currentRoom: window.currentRoom }).catch(()=>{});
            }

            ui.listenToMessagesRealtime();
            ui.listenToMicsRealtime();
            ui.listenToRoomSettingsRealtime();
        },
        logoutBackToWelcome: () => {
            if(window.currentUser) {
                db.collection("users").doc(window.currentUser.uid).update({ isOnline: false }).catch(()=>{});
            }
            localStorage.removeItem('hassouni_session_user');
            window.currentUser = null;
            document.getElementById('welcomeOverlay').style.display = 'flex';
            document.getElementById('featureModal').style.display = 'none';
            ui.switchBranch('b1');
        },
        listenToMessagesRealtime: () => {
            if(window.activeMessagesListener) window.activeMessagesListener();
            
            window.activeMessagesListener = db.collection("rooms").doc(window.currentRoom).collection("messages")
                .orderBy("timestamp", "asc")
                .onSnapshot(snapshot => {
                    let box = document.getElementById('chatBox');
                    box.innerHTML = '';
                    snapshot.forEach(doc => {
                        let data = doc.data();
                        ui.renderSingleMessage(data);
                    });
                    box.scrollTop = box.scrollHeight;
                });
        },
        renderSingleMessage: (msg) => {
            let box = document.getElementById('chatBox');
            let wrap = document.createElement('div');
            
            if(msg.type === 'system_gift') {
                wrap.className = 'msg-wrap system-gold-gift';
                wrap.innerHTML = `<div style="font-size:13px; font-weight:bold; color:#ffd700;">🎁 ${msg.text}</div>`;
            } else {
                wrap.className = 'msg-wrap';
                let rank = window.chatRanksData[msg.userRole] || window.chatRanksData['guest'];
                let timeFormatted = formatTime(msg.timestamp);

                wrap.innerHTML = `
                    <div class="msg-header">
                        <div class="pfp-main-frame" onclick="ui.openProfileCardModal('${msg.uid}')">
                            <img src="${msg.userImg || 'https://cdn-icons-png.flaticon.com/512/1042/1042291.png'}" class="pfp-main">
                        </div>
                        <div class="rank-standalone-icon">
                            <i class="${rank.icon}" style="color:${rank.color}"></i>
                        </div>
                        <div class="king-name-container" onclick="ui.openProfileCardModal('${msg.uid}')">
                            <span class="king-name-tag" style="color:${rank.color}">${msg.userName}</span>
                        </div>
                        <span class="msg-time-stamp">${timeFormatted}</span>
                    </div>
                    <div class="msg-text">${msg.text}</div>
                `;
            }
            box.appendChild(wrap);
        },
        sendMessage: () => {
            let inp = document.getElementById('msgInp');
            let text = inp.value.trim();
            if(!text) return;
            if(!window.currentUser) { alert("يرجى تسجيل الدخول أولاً!"); return; }

            let msgObj = {
                uid: window.currentUser.uid,
                userName: window.currentUser.name,
                userRole: window.currentUser.role,
                userImg: window.currentUser.img,
                text: text,
                type: 'text',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("rooms").doc(window.currentRoom).collection("messages").add(msgObj);
            inp.value = '';
        },
        listenToMicsRealtime: () => {
            if(window.activeMicsListener) window.activeMicsListener();

            window.activeMicsListener = db.collection("rooms").doc(window.currentRoom).collection("mics")
                .onSnapshot(snapshot => {
                    for(let i=1; i<=4; i++) {
                        let micEl = document.getElementById(`mic_${i}`);
                        let nameEl = document.getElementById(`micName_${i}`);
                        micEl.style.backgroundImage = 'none';
                        micEl.classList.remove('occupied');
                        nameEl.innerText = i;
                    }

                    snapshot.forEach(doc => {
                        let data = doc.data();
                        let slot = data.slot;
                        let micEl = document.getElementById(`mic_${slot}`);
                        let nameEl = document.getElementById(`micName_${slot}`);
                        if(micEl && data.occupied) {
                            micEl.style.backgroundImage = `url('${data.userImg}')`;
                            micEl.classList.add('occupied');
                            nameEl.innerText = data.userName.substring(0, 5);
                        }
                    });
                });
        },
        clickMicSlot: (slot) => {
            if(!window.currentUser) { alert("سجل دخولك للصعود على المايك"); return; }
            
            let micRef = db.collection("rooms").doc(window.currentRoom).collection("mics").doc(`slot_${slot}`);
            micRef.get().then(doc => {
                if(doc.exists && doc.data().occupied) {
                    if(doc.data().uid === window.currentUser.uid) {
                        micRef.set({ occupied: false, uid: "", userName: "", userImg: "", slot: slot });
                    } else {
                        alert("المايك مشغول حالياً بـ " + doc.data().userName);
                    }
                } else {
                    micRef.set({
                        occupied: true,
                        uid: window.currentUser.uid,
                        userName: window.currentUser.name,
                        userImg: window.currentUser.img,
                        slot: slot
                    });
                }
            });
        },
        listenToRoomSettingsRealtime: () => {
            if(window.activeRoomSettingsListener) window.activeRoomSettingsListener();

            window.activeRoomSettingsListener = db.collection("rooms").doc(window.currentRoom)
                .onSnapshot(doc => {
                    if(doc.exists) {
                        let data = doc.data();
                        if(data.bgUrl) {
                            document.getElementById('chatBox').style.backgroundImage = `url('${data.bgUrl}')`;
                        }
                        if(data.ytActiveUrl) {
                            ui.playYouTubeAudioStream(data.ytActiveUrl);
                        }
                    }
                });
        },
        playYouTubeAudioStream: (url) => {
            let vidId = extractYouTubeVideoId(url);
            if(vidId) {
                let container = document.getElementById('youtubeVideoFrameContainer');
                container.innerHTML = `<iframe width="100" height="100" src="https://www.youtube.com/embed/${vidId}?autoplay=1&enablejsapi=1" allow="autoplay"></iframe>`;
            }
        },
        stopHiddenAudioPlayback: () => {
            document.getElementById('youtubeVideoFrameContainer').innerHTML = '';
            document.getElementById('hiddenAudioNode').pause();
            alert("تم إيقاف الأصوات والموسيقى بنجاح.");
        },
        toggleOnlineUsers: () => {
            let modal = document.getElementById('onlineUsersHalfModal');
            if(modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
                ui.loadOnlineUsersListRealtime();
            }
        },
        loadOnlineUsersListRealtime: () => {
            if(window.activeOnlineUsersListener) window.activeOnlineUsersListener();

            window.activeOnlineUsersListener = db.collection("users").where("isOnline", "==", true)
                .onSnapshot(snapshot => {
                    let body = document.getElementById('onlineUsersListBody');
                    body.innerHTML = '';
                    snapshot.forEach(doc => {
                        let u = doc.data();
                        let rank = window.chatRanksData[u.role] || window.chatRanksData['guest'];
                        let item = document.createElement('div');
                        item.className = 'online-user-item';
                        item.innerHTML = `
                            <div class="online-user-left">
                                <img src="${u.img || 'https://cdn-icons-png.flaticon.com/512/1042/1042291.png'}" class="online-user-avatar" onclick="ui.openProfileCardModal('${u.uid}')">
                                <div>
                                    <span style="font-size:13px; font-weight:bold; color:${rank.color}">${u.name}</span>
                                    <div style="font-size:10px; color:#aaa;">${rank.text}</div>
                                </div>
                            </div>
                            <div class="online-user-bg-btn" onclick="ui.openPrivateChatWindow('${u.uid}', '${u.name}')"><i class="fas fa-comment-alt"></i> خاص</div>
                        `;
                        body.appendChild(item);
                    });
                });
        },
        openPrivateConversationsList: () => {
            document.getElementById('featureModalTitle').innerText = "💬 المحادثات الخاصة النشطة";
            document.getElementById('featureModalBody').innerHTML = `
                <div style="text-align:center; padding:10px; color:#ccc;">
                    <p style="font-size:13px;">اختر أحد المتواجدين للبدء بمحادثة خاصة متزامنة وسريعة.</p>
                    <button class="row-btn active" style="width:100%;" onclick="ui.toggleOnlineUsers(); document.getElementById('featureModal').style.display='none';">عرض المتواجدين للبدء</button>
                </div>
            `;
            document.getElementById('featureModal').style.display = 'flex';
        },
        openPrivateChatWindow: (targetUid, targetName) => {
            if(!window.currentUser) { alert("سجل دخولك أولاً!"); return; }
            let chatId = generateChatroomId(window.currentUser.uid, targetUid);
            
            document.getElementById('featureModalTitle').innerText = `💬 خاص مع: ${targetName}`;
            document.getElementById('featureModalBody').innerHTML = `
                <div class="private-chat-box">
                    <div class="private-msg-list" id="privateMsgContainer"></div>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="privInp" class="chat-input" placeholder="اكتب رسالة خاصة..." onkeypress="if(event.key==='Enter') ui.sendPrivateMessage('${chatId}', '${targetUid}')">
                        <button class="send-btn-arrow" onclick="ui.sendPrivateMessage('${chatId}', '${targetUid}')"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            `;
            document.getElementById('featureModal').style.display = 'flex';

            if(window.activePrivateListener) window.activePrivateListener();
            window.activePrivateListener = db.collection("privates").doc(chatId).collection("messages")
                .orderBy("timestamp", "asc")
                .onSnapshot(snapshot => {
                    let container = document.getElementById('privateMsgContainer');
                    if(!container) return;
                    container.innerHTML = '';
                    snapshot.forEach(doc => {
                        let data = doc.data();
                        let isMine = data.senderUid === window.currentUser.uid;
                        let div = document.createElement('div');
                        div.className = `private-msg-bubble ${isMine ? 'private-msg-mine' : 'private-msg-other'}`;
                        div.innerText = data.text;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                });
        },
        sendPrivateMessage: (chatId, targetUid) => {
            let inp = document.getElementById('privInp');
            let text = inp.value.trim();
            if(!text) return;

            db.collection("privates").doc(chatId).collection("messages").add({
                senderUid: window.currentUser.uid,
                targetUid: targetUid,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            inp.value = '';
        },
        openVIPList: (type) => {
            document.getElementById('featureModalTitle').innerText = `🏆 قائمة ${type} الفاخرة`;
            document.getElementById('featureModalBody').innerHTML = `
                <div style="text-align:center; padding:15px;">
                    <i class="fas fa-crown" style="font-size:40px; color:var(--gold); margin-bottom:10px;"></i>
                    <p style="font-size:14px; font-weight:bold; color:var(--gold);">خليل إبراهيم (البرنس الأصلي)</p>
                    <p style="font-size:12px; color:#aaa;">أعلى شخصية متفاعلة وداعمة في شات حسوني السحابي</p>
                </div>
            `;
            document.getElementById('featureModal').style.display = 'flex';
        },
        openRoomsManager: () => {
            document.getElementById('featureModalTitle').innerText = "🚪 إدارة وقائمة الغرف السحابية";
            let html = '<div style="display:flex; flex-direction:column; gap:8px;">';
            window.roomsList.forEach(r => {
                html += `
                    <div class="online-user-item" onclick="ui.changeActiveRoom('${r}')">
                        <span style="font-weight:bold; color:var(--gold);"><i class="fas fa-door-open"></i> غرفة: ${r}</span>
                        <button class="row-btn active" style="padding:4px 10px; font-size:11px;">دخول</button>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('featureModalBody').innerHTML = html;
            document.getElementById('featureModal').style.display = 'flex';
        },
        changeActiveRoom: (roomName) => {
            window.currentRoom = roomName;
            document.getElementById('featureModal').style.display = 'none';
            alert(`تم الانتقال للغرفة: ${roomName}`);
            ui.enterChat();
        },
        createNewRoomCloud: () => {
            let rName = document.getElementById('newRoomNameInp').value.trim();
            if(!rName) return;
            if(!window.roomsList.includes(rName)) window.roomsList.push(rName);
            db.collection("rooms").doc(rName).set({ createdBy: window.currentUser.uid, bgUrl: "" });
            alert(`تم إنشاء الغرفة (${rName}) بنجاح!`);
            ui.changeActiveRoom(rName);
        },
        refreshChatWindowOnly: () => {
            ui.enterChat();
            alert("تم تحديث الشات والمزامنة بنجاح 🔄");
        },
        openYouTubeSearchEngine: () => {
            document.getElementById('featureModalTitle').innerText = "🔴 تشغيل يوتيوب وبث مباشر";
            document.getElementById('featureModalBody').innerHTML = `
                <div style="text-align:right;">
                    <input type="text" id="ytUrlInp" class="form-control" placeholder="أدخل رابط فيديو أو شيلة يوتيوب هنا...">
                    <button class="row-btn active" style="width:100%; border-radius:8px; padding:10px;" onclick="ui.broadcastYouTubeToRoom()">بث للغرفة كاملة 🎶</button>
                    
                    <div class="yt-preview-card" onclick="ui.broadcastYouTubeToRoom('https://www.youtube.com/watch?v=xAOY_M62ST4')">
                        <i class="fab fa-youtube" style="font-size:30px; color:red;"></i>
                        <div>
                            <div style="font-size:12px; font-weight:bold; color:#fff;">حاشاني أعشق غيركم (أقوى غزل)</div>
                            <div style="font-size:10px; color:#aaa;">تشغيل مباشر كـ خلفية صينية للغرفة</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('featureModal').style.display = 'flex';
        },
        broadcastYouTubeToRoom: (customUrl) => {
            let url = customUrl || document.getElementById('ytUrlInp').value.trim();
            if(!url) { alert("أدخل رابط يوتيوب صحيح!"); return; }

            db.collection("rooms").doc(window.currentRoom).update({ ytActiveUrl: url });
            document.getElementById('featureModal').style.display = 'none';
            alert("تم بدء بث فيديو اليوتيوب لجميع الأعضاء بالمزامنة!");
        },
        openGlobalSettings: () => {
            document.getElementById('featureModalTitle').innerText = "⚙️ إعدادات شات حسوني العصرية";
            document.getElementById('featureModalBody').innerHTML = `
                <div class="menu-item" onclick="ui.changeRoomBackgroundByPrompt()"><i class="fas fa-image" style="color:var(--gold);"></i> تغيير خلفية الشات للجميع</div>
                <div class="menu-item" onclick="alert('التنبيها الصوتية مفعلة بنجاح')"><i class="fas fa-volume-up" style="color:#2ecc71;"></i> التنبيهات الصوتية</div>
                <div class="menu-item" onclick="ui.logoutBackToWelcome()" style="color:#e74c3c;"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</div>
            `;
            document.getElementById('featureModal').style.display = 'flex';
        },
        changeRoomBackgroundByPrompt: () => {
            let url = prompt("أدخل رابط صورة الخلفية الجديدة للروم:");
            if(url) {
                db.collection("rooms").doc(window.currentRoom).update({ bgUrl: url });
                alert("تم تحديث خلفية الروم سحابياً وحياً لدى جميع الأعضاء!");
            }
        },
        openProfileCardModal: (uid) => {
            db.collection("users").doc(uid).get().then(doc => {
                let u = doc.exists ? doc.data() : (uid === window.currentUser.uid ? window.currentUser : window.defaultOwnerData);
                let rank = window.chatRanksData[u.role] || window.chatRanksData['guest'];
                
                document.getElementById('featureModalTitle').innerText = "👤 بطاقة الملف الشخصي";
                document.getElementById('featureModalBody').innerHTML = `
                    <div class="profile-card-wrapper">
                        <img src="${u.cover || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=400'}" class="profile-card-cover">
                        <img src="${u.img || 'https://cdn-icons-png.flaticon.com/512/1042/1042291.png'}" class="profile-card-pfp">
                        <h3 style="margin:8px 0 2px; color:${rank.color}">${u.name}</h3>
                        <span style="font-size:12px; color:var(--gold); border:1px solid var(--gold); padding:2px 8px; border-radius:12px;"><i class="${rank.icon}"></i> ${rank.text}</span>
                        <p style="font-size:12px; color:#ccc; margin:8px 0;">"${u.status || 'متصل في الشات'}"</p>
                        
                        <div class="profile-action-bar">
                            <div class="profile-bar-btn" onclick="ui.giveGiftToUser('${u.uid}', '${u.name}')"><i class="fas fa-gift"></i> إهداء</div>
                            <div class="profile-bar-btn" onclick="ui.openPrivateChatWindow('${u.uid}', '${u.name}')"><i class="fas fa-comment-alt"></i> خاص</div>
                            <div class="profile-bar-btn" onclick="ui.likeUserProfile('${u.uid}')"><i class="fas fa-thumbs-up"></i> إعجاب (${u.likes || 0})</div>
                        </div>
                    </div>
                `;
                document.getElementById('featureModal').style.display = 'flex';
            });
        },
        giveGiftToUser: (uid, name) => {
            let giftText = prompt(`أدخل نوع الهدية التي ترغب بإرسالها لـ ${name}:`, "تاج ملكي ذهبي 👑");
            if(giftText) {
                db.collection("rooms").doc(window.currentRoom).collection("messages").add({
                    text: `قام ${window.currentUser.name} بإهداء (${giftText}) إلى ${name} 🎁🎉`,
                    type: 'system_gift',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('featureModal').style.display = 'none';
            }
        },
        likeUserProfile: (uid) => {
            db.collection("users").doc(uid).update({ likes: firebase.firestore.FieldValue.increment(1) });
            alert("تم إرسال الإعجاب بنجاح 👍");
            document.getElementById('featureModal').style.display = 'none';
        },
        openEditProfileModal: (uid) => {
            if(!window.currentUser || window.currentUser.uid !== uid) { alert("يمكنك تعديل بروفايلك فقط!"); return; }
            document.getElementById('featureModalTitle').innerText = "✏️ تعديل الملف الشخصي";
            document.getElementById('featureModalBody').innerHTML = `
                <div style="text-align:right;">
                    <input type="text" id="editName" class="form-control" value="${window.currentUser.name}" placeholder="الاسم المستعار...">
                    <input type="text" id="editStatus" class="form-control" value="${window.currentUser.status || ''}" placeholder="الحالة الشخصية...">
                    <input type="text" id="editImg" class="form-control" value="${window.currentUser.img || ''}" placeholder="رابط الصورة الشخصية...">
                    <input type="text" id="editCover" class="form-control" value="${window.currentUser.cover || ''}" placeholder="رابط غلاف البروفايل...">
                    <button class="row-btn active" style="width:100%; border-radius:8px; padding:10px;" onclick="ui.saveProfileChanges()">حفظ التعديلات فوراً</button>
                </div>
            `;
            document.getElementById('featureModal').style.display = 'flex';
        },
        saveProfileChanges: () => {
            let n = document.getElementById('editName').value.trim();
            let st = document.getElementById('editStatus').value.trim();
            let im = document.getElementById('editImg').value.trim();
            let cv = document.getElementById('editCover').value.trim();

            if(!n) return;
            window.currentUser.name = n;
            window.currentUser.status = st;
            if(im) window.currentUser.img = im;
            if(cv) window.currentUser.cover = cv;

            ui.saveUserToFirestoreAndSession(window.currentUser);
            document.getElementById('featureModal').style.display = 'none';
            alert("تم حفظ التغييرات بنجاح!");
            ui.enterChat();
        }
    };

    window.onload = () => {
        ui.checkSavedSessionOnStart();
    };
</script>
</body>
</html>
