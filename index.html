    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
    * {

      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    
    /* Glowing Rank Animations */
    @keyframes glowWhite {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(245, 158, 11, 0.6); }
      50% { box-shadow: 0 0 20px rgba(255, 255, 255, 1), 0 0 35px rgba(245, 158, 11, 0.9); }
    }
    @keyframes glowRed {
      0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }
      50% { box-shadow: 0 0 22px rgba(239, 68, 68, 1); }
    }
    @keyframes glowBlue {
      0%, 100% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.8); }
      50% { box-shadow: 0 0 22px rgba(59, 130, 246, 1); }
    }
    @keyframes glowPurple {
      0%, 100% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.8); }
      50% { box-shadow: 0 0 22px rgba(168, 85, 247, 1); }
    }
    @keyframes glowGold {
      0%, 100% { box-shadow: 0 0 10px rgba(234, 179, 8, 0.8); }
      50% { box-shadow: 0 0 22px rgba(234, 179, 8, 1); }
    }

    .rank-white-cup { animation: glowWhite 1.8s infinite ease-in-out; }
    .rank-red-cup { animation: glowRed 1.8s infinite ease-in-out; }
    .rank-blue-crown { animation: glowBlue 1.8s infinite ease-in-out; }
    .rank-purple { animation: glowPurple 1.8s infinite ease-in-out; }
    .rank-gold { animation: glowGold 1.8s infinite ease-in-out; }
    
    @keyframes speakingRipple {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .speaking-active {
      animation: speakingRipple 1.4s infinite;
    }
  </style>

    // --- Separate Rank Badge Component (Placed between Avatar and Name) ---
    function RankBadge({ rankId, level = 1, size = "md" }) {
      const r = RANKS_LIST.find(x => x.id === rankId) || RANKS_LIST[RANKS_LIST.length - 2];
      
      return (
        <div className="flex items-center gap-0.5 shrink-0 select-none">

            title={r.name}
          >
            {r.icon}
          </div>
        </div>
      );
    }

    // ==================== 3. AUDIO UTILITY ====================
    const playAudio = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'crown') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } else if (type === 'gift') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else {
          osc.frequency.setValueAtTime(650, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        }
      } catch (e) {}
    };

    // ==================== 4. DEFAULT ROOMS & STORE ====================
    const DEFAULT_ROOMS = [
      { id: 'general', name: 'الغرفـــة || العـامـــة 🌸', desc: 'الروم الرئيسي لجميع الأعضاء والزوار', icon: '👑', bgImage: '' },

    const STORE_GIFTS = [
      { id: 'g1', name: 'تاج الملوك', icon: '👑', price: 5000 },
      { id: 'g2', name: 'الماسة الزرقاء', icon: '💎', price: 3000 },
      { id: 'g3', name: 'باقة ورد فاخرة', icon: '💐', price: 500 },
      { id: 'g4', name: 'قلب أحمر مشع', icon: '❤️', price: 200 },
      { id: 'g5', name: 'سيارة رياضية', icon: '🏎️', price: 10000 },
      { id: 'g6', name: 'كأس الذهب الملكي', icon: '🏆', price: 8000 }
    ];

    const NAME_PALETTES = [
      { id: 'p1', name: 'الليلي الفحمي', class: 'bg-[#181a20] text-white border border-zinc-700' },
      { id: 'p2', name: 'الملكي الذهبي', class: 'bg-gradient-to-r from-amber-500 to-yellow-400 text-black border border-yellow-200' },
      { id: 'p3', name: 'الياقوت الأزرق', class: 'bg-gradient-to-r from-blue-600 to-cyan-500 text-white border border-cyan-300' },
      { id: 'p4', name: 'الوردي الفاخر', class: 'bg-gradient-to-r from-pink-600 to-rose-400 text-white border border-pink-300' },
      { id: 'p5', name: 'الزمرد الأخضر', class: 'bg-gradient-to-r from-emerald-600 to-teal-500 text-white border border-teal-300' }
    ];

    // ==================== 5. MAIN APP COMPONENT ====================
    function App() {
      const getSavedUser = () => {
        try {
          const s = localStorage.getItem('hassouni_chat_user');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return null;
      };

      const [currentUser, setCurrentUser] = useState(getSavedUser());
      const [users, setUsers] = useState([]);
      const [rooms, setRooms] = useState(DEFAULT_ROOMS);
      const [messages, setMessages] = useState([]);
      const [currentRoomId, setCurrentRoomId] = useState('general');
      const [inputText, setInputText] = useState('');
      const [showMicCapsule, setShowMicCapsule] = useState(true);

      // Mic Slots
      const [micSlots, setMicSlots] = useState([
        { slot: 1, user: null, isSpeaking: false, isMuted: false, isMusicPlaying: false },
        { slot: 2, user: null, isSpeaking: false, isMuted: false, isMusicPlaying: false },
        { slot: 3, user: null, isSpeaking: false, isMuted: false, isMusicPlaying: false },
        { slot: 4, user: null, isSpeaking: false, isMuted: false, isMusicPlaying: false },
      ]);

      const [confirmMicSlot, setConfirmMicSlot] = useState(null);
      const [activeMicMenuSlot, setActiveMicMenuSlot] = useState(null);
      const [audioStream, setAudioStream] = useState(null);

      // Modals
      const [showLogin, setShowLogin] = useState(!currentUser);
      const [showProfile, setShowProfile] = useState(false);
      const [selectedUser, setSelectedUser] = useState(null);
      const [showRooms, setShowRooms] = useState(false);
      const [showStore, setShowStore] = useState(false);
      const [showGifts, setShowGifts] = useState(false);
      const [showAdmin, setShowAdmin] = useState(false);
      const [showUsersModal, setShowUsersModal] = useState(false);
      const [showDrawer, setShowDrawer] = useState(false);

      // Super Admin Rank Assignment State
      const [selectedRankToGift, setSelectedRankToGift] = useState('white_glowing');

      // Login form states (EMPTY by default)
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [registerName, setRegisterName] = useState('');
      const [guestName, setGuestName] = useState('');
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [isGuestMode, setIsGuestMode] = useState(false);
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginError, setLoginError] = useState('');

      // Customization Profile
      const [customName, setCustomName] = useState('');
      const [customPalette, setCustomPalette] = useState('bg-[#181a20] text-white border border-zinc-700');

      // Admin Management States
      const [adminTargetId, setAdminTargetId] = useState('');
      const [adminGold, setAdminGold] = useState(5000);
      const [adminRubies, setAdminRubies] = useState(100);
      const [adminBroadcast, setAdminBroadcast] = useState('');

      const chatEndRef = useRef(null);
      const currentRoom = rooms.find(r => r.id === currentRoomId) || rooms[0];

      // Auto-scroll on new message
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // Firebase Messages Listener
      useEffect(() => {
        if (!db) return;
        try {
          const unsub = db.collection('rooms').doc(currentRoomId).collection('messages')
            .orderBy('createdAt', 'asc')
            .limit(150)
            .onSnapshot((snapshot) => {
              if (snapshot) {
                const liveMsgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setMessages(liveMsgs);
              }
            }, (err) => console.warn('Messages listener:', err));

          return () => unsub();
        } catch (e) {}
      }, [currentRoomId]);

      // Firebase Online Users Listener (Owner first, real only)
      useEffect(() => {
        if (!db) return;
        try {
          const unsub = db.collection('users').onSnapshot((snapshot) => {
            if (snapshot) {
              const liveUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              const sorted = liveUsers.sort((a, b) => {
                if (a.role === 'owner' || a.rankId === 'white_glowing' || a.cupType === 'white_glowing') return -1;
                if (b.role === 'owner' || b.rankId === 'white_glowing' || b.cupType === 'white_glowing') return 1;
                return (b.isOnline ? 1 : 0) - (a.isOnline ? 1 : 0);
              });
              setUsers(sorted);
            }
          }, (err) => console.warn('Users listener:', err));

          return () => unsub();
        } catch (e) {}
      }, []);

      // Mic Slots Listener
      useEffect(() => {
        if (!db) return;
        try {
          const unsub = db.collection('rooms').doc(currentRoomId).onSnapshot((doc) => {
            if (doc.exists) {
              const data = doc.data();
              if (data.micSlots) setMicSlots(data.micSlots);
              if (data.bgImage !== undefined) {
                setRooms(prev => prev.map(r => r.id === currentRoomId ? { ...r, bgImage: data.bgImage } : r));
              }
            }
          });
          return () => unsub();
        } catch (e) {}
      }, [currentRoomId]);

      // Presence Sync
      useEffect(() => {
        if (!currentUser || !db) return;
        try {
          db.collection('users').doc(currentUser.id).set({
            ...currentUser,
            isOnline: true,
            currentRoomId: currentRoomId,
            lastSeen: new Date().toISOString()
          }, { merge: true }).catch(() => {});
        } catch (e) {}
      }, [currentUser, currentRoomId]);

      // ==================== 6. HANDLERS ====================
      const handleSendMessage = () => {
        if (!inputText.trim()) return;
        if (!currentUser) return setShowLogin(true);
        if (currentUser.isMuted) return alert('أنت مكتوم حالياً من الكتابة!');

        const userRank = currentUser.rankId || (currentUser.role === 'owner' ? 'white_glowing' : 'registered_member');

        const newMsg = {
          roomId: currentRoomId,
          userId: currentUser.id,
          userName: currentUser.name,
          userDecoratedName: currentUser.decoratedName,
          userAvatar: currentUser.avatar,
          userLevel: currentUser.level || 1,
          rankId: userRank,
          userCup: userRank,
          userRole: currentUser.role || 'member',
          namePalette: currentUser.namePalette || 'bg-[#181a20] text-white border border-zinc-700',
          content: inputText.trim(),
          timestamp: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
          type: 'text',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (db) {

          {showLogin && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-amber-500/50 rounded-3xl w-full max-w-sm p-5 space-y-4 text-xs shadow-2xl">
                <div className="text-center border-b border-zinc-800 pb-3">
                  <span className="text-3xl block mb-1">👑</span>
                  <h3 className="font-black text-sm text-white">شات حسوني الصوتي والكتابي</h3>
                  <p className="text-[11px] text-amber-400 font-bold mt-0.5">تسجيل الدخول والمزامنة الحية بالسيرفر</p>
                </div>

                <div className="grid grid-cols-2 gap-2 bg-zinc-900 p-1 rounded-2xl border border-zinc-800 font-bold text-center">
                  <button type="button" onClick={() => { setIsGuestMode(false); setLoginError(''); }} className={`py-2 rounded-xl transition-all ${!isGuestMode ? 'bg-amber-500 text-black shadow' : 'text-zinc-400'}`}>
                    عضوية / حساب مسجل 🔐
                  </button>
                  <button type="button" onClick={() => { setIsGuestMode(true); setLoginError(''); }} className={`py-2 rounded-xl transition-all ${isGuestMode ? 'bg-cyan-500 text-black shadow' : 'text-zinc-400'}`}>
                    دخول سريع كزائر 👤
                  </button>
                </div>

                {loginError && (
                  <div className="p-2 bg-red-950/80 border border-red-800 text-red-300 text-[11px] rounded-xl text-right">
                    {loginError}
                  </div>
                )}

                {isGuestMode ? (
                  <form onSubmit={handleGuestLogin} className="space-y-3 text-right">
                    <div>
                      <label className="text-zinc-400 block mb-1 font-bold">اسم الزائر المستعار:</label>
                      <input 
                        type="text" 
                        value={guestName} 
                        onChange={e => setGuestName(e.target.value)} 
                        placeholder="مثال: زائر الأصالة" 
                        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-white text-xs" 
                      />
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black rounded-xl shadow">
                      الدخول الآن كزائر 🚀
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleAuth} className="space-y-3 text-right">
                    {isRegisterMode && (
                      <div>
                        <label className="text-zinc-400 block mb-1 font-bold">اسم المستخدم:</label>
                        <input 
                          type="text" 
                          value={registerName} 
                          onChange={e => setRegisterName(e.target.value)} 
                          placeholder="مثال: صقر الشات" 
                          className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-white text-xs" 
                        />
                      </div>
                    )}

                    <div>
                      <label className="text-zinc-400 block mb-1 font-bold">البريد الإلكتروني:</label>
                      <input 
                        type="email" 
                        value={loginEmail} 
                        onChange={e => setLoginEmail(e.target.value)} 
                        placeholder="example@domain.com" 
                        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-white text-xs" 
                        required 
                      />
                    </div>

                    <div>
                      <label className="text-zinc-400 block mb-1 font-bold">كلمة المرور:</label>
                      <input 
                        type="password" 
                        value={loginPassword} 
                        onChange={e => setLoginPassword(e.target.value)} 
                        placeholder="•••••••••" 
                        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-white text-xs" 
                        required 
                      />
                    </div>

                    <button type="submit" disabled={loginLoading} className="w-full py-2.5 bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-black rounded-xl shadow disabled:opacity-50">
                      {loginLoading ? 'جاري التحقق...' : isRegisterMode ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}
                    </button>

                    <div className="text-center pt-2">
                      <button type="button" onClick={() => setIsRegisterMode(!isRegisterMode)} className="text-xs text-amber-400 font-bold underline">
                        {isRegisterMode ? 'لديك حساب؟ تسجيل الدخول' : 'ليس لديك حساب؟ إنشاء حساب جديد'}
                      </button>
                    </div>
                  </form>
                )}

                {currentUser && (
                  <button type="button" onClick={() => setShowLogin(false)} className="w-full text-center text-xs text-zinc-500 hover:text-white pt-1">
                    إلغاء
                  </button>
                )}
              </div>
            </div>
          )}

          {/* ================= MODAL: CONFIRM MIC ================= */}
          {confirmMicSlot && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-zinc-950 border border-amber-500/60 rounded-3xl w-full max-w-xs p-5 text-center space-y-4 shadow-2xl">
                <span className="text-3xl block">🎙️</span>
                <h3 className="font-black text-sm text-white">صعود المايك {confirmMicSlot}</h3>
                <p className="text-xs text-zinc-300">هل تريد صعود المايك وبث صوتك لجميع الأعضاء؟</p>
                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button onClick={() => confirmTakeMic(confirmMicSlot)} className="py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black rounded-xl shadow">
                    نعم، صعود 🎙️
                  </button>
                  <button onClick={() => setConfirmMicSlot(null)} className="py-2.5 bg-zinc-800 text-zinc-300 font-bold rounded-xl border border-zinc-700">
                    إلغاء ✕
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: MIC MENU ================= */}
          {activeMicMenuSlot && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl w-full max-w-xs p-4 space-y-2 text-xs shadow-2xl text-right">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2 mb-2">
                  <button onClick={() => setActiveMicMenuSlot(null)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-amber-300">إدارة المايك الخاص بك 🎙️</h3>
                </div>
                <button onClick={() => handleMicMenuAction('mute')} className="w-full p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-between font-bold">
                  <span>1. كتم المايك</span>
                  <span>🔇</span>
                </button>
                <button onClick={() => handleMicMenuAction('unmute')} className="w-full p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-between text-emerald-400 font-bold">
                  <span>2. فتح كتم المايك</span>
                  <span>🎙️</span>
                </button>
                <button onClick={() => handleMicMenuAction('play_music')} className="w-full p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-between text-purple-400 font-bold">
                  <span>3. تشغيل أغنية على المايك</span>
                  <span>🎵</span>
                </button>
                <button onClick={() => handleMicMenuAction('stop_music')} className="w-full p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-between text-yellow-400 font-bold">
                  <span>4. إيقاف الأغنية</span>
                  <span>⏹️</span>
                </button>
                <button onClick={() => handleMicMenuAction('leave')} className="w-full p-2.5 rounded-xl bg-red-950/60 border border-red-800 text-red-300 font-black flex items-center justify-between">
                  <span>5. نزول من المايك</span>
                  <span>🔻</span>
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
