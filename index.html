<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شات حسوني</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

:root{
    --blue:#1689c1;
    --dark:#202020;
    --gold:#ffc400;
}

body{
    background:#d9e4eb;
    color:#222;
    overflow:hidden;
}

button,input,select,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:none;
}

/* شاشة الدخول */

#authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#121212,#247ca8,#121212);
    padding:20px;
}

.authBox{
    width:100%;
    max-width:430px;
    background:#252525;
    padding:25px;
    border-radius:25px;
    color:white;
    box-shadow:0 20px 50px #000;
}

.authLogo{
    text-align:center;
    font-size:30px;
    color:#ffd000;
    font-weight:bold;
    margin-bottom:10px;
}

.authSub{
    text-align:center;
    color:#aaa;
    margin-bottom:20px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.tabs button{
    flex:1;
    padding:12px;
    background:#3b3b3b;
    color:white;
    border-radius:10px;
}

.tabs button.active{
    background:var(--blue);
}

.authForm{
    display:none;
}

.authForm.active{
    display:block;
}

.authForm input{
    width:100%;
    margin-bottom:10px;
    padding:14px;
    border-radius:12px;
    border:1px solid #555;
    background:#171717;
    color:white;
    outline:none;
}

.authBtn{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:var(--blue);
    color:white;
    font-size:16px;
    font-weight:bold;
}

.guestBtn{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:12px;
    background:#555;
    color:white;
}

/* التطبيق */

#app{
    display:none;
    height:100vh;
    background:#e6edf2;
}

/* الشريط العلوي */

.header{
    height:70px;
    background:#242424;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.headerLogo{
    color:#ffd000;
    font-size:20px;
    font-weight:bold;
}

.headerButtons{
    display:flex;
    gap:8px;
}

.headerButtons button{
    background:#333;
    color:white;
    padding:10px;
    border-radius:10px;
}

/* الجسم */

.appBody{
    display:flex;
    height:calc(100vh - 70px);
}

/* الأعضاء */

.members{
    width:240px;
    background:#cddce5;
    overflow-y:auto;
}

.membersTitle{
    background:#b9cedb;
    padding:15px;
    font-weight:bold;
    position:sticky;
    top:0;
}

.member{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    border-bottom:1px solid #b7cbd6;
}

.memberAvatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#888;
    object-fit:cover;
}

.memberData{
    flex:1;
}

.memberName{
    font-weight:bold;
}

.rankBadge{
    display:inline-block;
    margin-top:4px;
    padding:3px 8px;
    border-radius:15px;
    background:#444;
    color:white;
    font-size:11px;
}

.ownerRank{
    background:linear-gradient(45deg,#a86d00,#ffd700,#fff0a0,#c78700);
    color:#4d3100;
    font-weight:bold;
    box-shadow:0 0 10px #ffd700;
}

/* منطقة الشات */

.chatArea{
    flex:1;
    display:flex;
    flex-direction:column;
}

.roomBar{
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid #ccc;
}

.roomName{
    font-weight:bold;
    font-size:18px;
}

.roomBar button{
    background:var(--blue);
    color:white;
    padding:8px 12px;
    border-radius:10px;
}

/* الرسائل */

.messages{
    flex:1;
    overflow-y:auto;
    padding:12px;
}

.message{
    background:#f7f7f7;
    border-radius:15px;
    padding:10px 14px;
    margin-bottom:8px;
    box-shadow:0 2px 5px #bbb;
    position:relative;
}

.messageTop{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:5px;
}

.messageAvatar{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    background:#777;
}

.messageName{
    font-weight:bold;
}

.messageTime{
    color:#888;
    font-size:11px;
    margin-right:auto;
}

.messageText{
    font-size:17px;
    line-height:1.7;
}

/* الكتابة */

.writeBox{
    background:white;
    padding:10px;
    display:flex;
    gap:8px;
}

.writeBox input{
    flex:1;
    padding:14px;
    border-radius:25px;
    border:1px solid #bbb;
    outline:none;
}

.sendBtn{
    width:55px;
    border-radius:50%;
    background:#242424;
    color:white;
    font-size:22px;
}

/* قائمة الغرف */

.rooms{
    width:180px;
    background:#d5e2ea;
    border-right:1px solid #bccdd8;
    overflow:auto;
}

.roomsTitle{
    padding:15px;
    font-weight:bold;
    background:#bdd0db;
}

.roomItem{
    width:100%;
    padding:12px;
    background:transparent;
    text-align:right;
    border-bottom:1px solid #bdcbd3;
    color:#222;
}

.roomItem.active{
    background:var(--blue);
    color:white;
}

/* النوافذ */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:50;
    padding:15px;
    overflow:auto;
}

.modalBox{
    max-width:700px;
    margin:20px auto;
    background:white;
    border-radius:20px;
    padding:20px;
}

.modalHead{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.closeBtn{
    background:#d33;
    color:white;
    padding:8px 12px;
    border-radius:8px;
}

.panelSection{
    background:#edf4f7;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.panelSection h3{
    margin-bottom:10px;
}

.panelSection input,
.panelSection select{
    width:100%;
    padding:11px;
    margin-bottom:8px;
    border:1px solid #ccc;
    border-radius:8px;
}

.panelSection button{
    padding:10px 15px;
    background:var(--blue);
    color:white;
    border-radius:8px;
}

.adminUser{
    background:white;
    padding:10px;
    margin-bottom:6px;
    border-radius:10px;
}

.adminActions{
    margin-top:8px;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.adminActions button{
    padding:6px 8px;
    font-size:12px;
}

.danger{
    background:#d33 !important;
}

.warning{
    background:#d98200 !important;
}

.success{
    background:#198754 !important;
}

/* البروفايل */

.profileCover{
    height:130px;
    border-radius:15px;
    background:linear-gradient(135deg,#1d91c2,#333);
    background-size:cover;
    background-position:center;
}

.profileAvatar{
    width:100px;
    height:100px;
    border-radius:50%;
    border:5px solid white;
    margin-top:-45px;
    margin-right:20px;
    object-fit:cover;
    background:#777;
}

.profileName{
    font-size:22px;
    font-weight:bold;
    margin:10px 20px;
}

.profileStats{
    padding:15px;
    display:flex;
    justify-content:space-around;
    text-align:center;
}

.profileEdit input{
    width:100%;
    padding:10px;
    margin:5px 0;
}

/* الجوال */

@media(max-width:800px){

    .rooms{
        display:none;
    }

    .members{
        display:none;
    }

    .headerLogo{
        font-size:16px;
    }

    .headerButtons button{
        padding:8px;
        font-size:12px;
    }
}

</style>
</head>

<body>

<!-- الدخول -->

<div id="authScreen">

<div class="authBox">

<div class="authLogo">🏆 شات حسوني</div>

<div class="authSub">
دردشة عربية متزامنة
</div>

<div class="tabs">

<button class="active"
id="loginTab"
onclick="showAuth('login')">
دخول
</button>

<button
id="registerTab"
onclick="showAuth('register')">
تسجيل
</button>

<button
id="guestTab"
onclick="showAuth('guest')">
👤 زائر
</button>

</div>

<div id="loginForm" class="authForm active">

<input
id="loginEmail"
type="email"
placeholder="البريد الإلكتروني">

<input
id="loginPassword"
type="password"
placeholder="كلمة المرور">

<button class="authBtn" onclick="login()">
تسجيل الدخول
</button>

</div>

<div id="registerForm" class="authForm">

<input
id="registerName"
placeholder="اسم المستخدم">

<input
id="registerEmail"
type="email"
placeholder="البريد الإلكتروني">

<input
id="registerPassword"
type="password"
placeholder="كلمة المرور">

<button class="authBtn" onclick="register()">
إنشاء حساب
</button>

</div>

<div id="guestForm" class="authForm">

<input
id="guestName"
placeholder="الاسم المستعار">

<input
id="guestAge"
type="number"
min="1"
max="120"
placeholder="العمر">

<select id="guestGender">
<option value="">اختر الجنس</option>
<option value="ذكر">ذكر</option>
<option value="أنثى">أنثى</option>
</select>

<button class="authBtn" onclick="guestLogin()">
👤 دخول كزائر
</button>

</div>

</div>

</div>

<!-- التطبيق -->

<div id="app">

<div class="header">

<div class="headerLogo">
🏆 شات حسوني
</div>

<div class="headerButtons">

<button onclick="openProfile()">
👤 بروفايلي
</button>

<button
id="adminButton"
style="display:none"
onclick="openAdmin()">
👑 التحكم
</button>

<button onclick="logout()">
خروج
</button>

</div>

</div>

<div class="appBody">

<!-- الغرف -->

<aside class="rooms">

<div class="roomsTitle">
🏠 الغرف
</div>

<div id="roomsList"></div>

</aside>

<!-- الشات -->

<main class="chatArea">

<div class="roomBar">

<div id="currentRoomName"
class="roomName">
💬 الغرفة العامة
</div>

<button
id="createRoomButton"
style="display:none"
onclick="createRoomPrompt()">
+ غرفة
</button>

</div>

<div id="messages"
class="messages">
</div>

<div class="writeBox">

<input
id="messageInput"
placeholder="اكتب هنا..."
onkeydown="if(event.key==='Enter')sendMessage()">

<button
class="sendBtn"
onclick="sendMessage()">
➤
</button>

</div>

</main>

<!-- الأعضاء -->

<aside class="members">

<div class="membersTitle">
👥 المتواجدون
</div>

<div id="membersList"></div>

</aside>

</div>

</div>

<!-- لوحة التحكم -->

<div id="adminModal" class="modal">

<div class="modalBox">

<div class="modalHead">

<h2>👑 لوحة تحكم المالك</h2>

<button
class="closeBtn"
onclick="closeModal('adminModal')">
إغلاق
</button>

</div>

<div class="panelSection">

<h3>📊 الإحصائيات</h3>

<div id="stats">
جارٍ التحميل...
</div>

</div>

<div class="panelSection">

<h3>🎁 إهداء رتبة</h3>

<select id="giftUser"></select>

<select id="giftRank">
<option value="عضو">عضو</option>
<option value="عضو مميز ⭐">عضو مميز ⭐</option>
<option value="مشرف 🛡️">مشرف 🛡️</option>
<option value="إداري 👑">إداري 👑</option>
<option value="كأس ذهبي 🏆">كأس ذهبي 🏆</option>
</select>

<button onclick="giftRank()">
إهداء الرتبة
</button>

</div>

<div class="panelSection">

<h3>👥 إدارة الأعضاء</h3>

<div id="adminUsers"></div>

</div>

</div>

</div>

<!-- البروفايل -->

<div id="profileModal" class="modal">

<div class="modalBox">

<div class="modalHead">

<h2>👤 بطاقة البروفايل</h2>

<button
class="closeBtn"
onclick="closeModal('profileModal')">
إغلاق
</button>

</div>

<div
id="profileCover"
class="profileCover">
</div>

<img
id="profileAvatar"
class="profileAvatar">

<div
id="profileName"
class="profileName">
</div>

<div
id="profileRank">
</div>

<div class="profileStats">

<div>
<div id="profilePoints">0</div>
النقاط
</div>

<div>
<div id="profileLevel">1</div>
المستوى
</div>

</div>

<div class="profileEdit">

<h3>تعديل مظهرك</h3>

<input
id="avatarUrl"
placeholder="رابط الصورة الشخصية">

<input
id="coverUrl"
placeholder="رابط الغلاف أو الخلفية">

<button onclick="saveProfile()">
حفظ التعديل
</button>

</div>

</div>

</div>

<!-- Firebase -->

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAnalytics
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signInAnonymously,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
setDoc,
getDoc,
addDoc,
updateDoc,
deleteDoc,
onSnapshot,
query,
orderBy,
serverTimestamp,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================
ضع بيانات Firebase الخاصة بك هنا
===================================== */

const firebaseConfig = {
  apiKey: "AIzaSyAFjspoGwJJeowjEZrcmJCO99iiTcBR5Is",
  authDomain: "hassouni-chat-51234.firebaseapp.com",
  projectId: "hassouni-chat-51234",
  storageBucket: "hassouni-chat-51234.firebasestorage.app",
  messagingSenderId: "519124989339",
  appId: "1:519124989339:web:7e2dcb2fe886f813d89d3e",
  measurementId: "G-9NMZYF2P3N"
};


/* بيانات المالك */

const OWNER_EMAIL =
"ghrwrkk2@gmamil.com";


const app =
initializeApp(firebaseConfig);

let analytics = null;

try{
analytics = getAnalytics(app);
}catch(error){
console.log("Analytics غير متاح:", error);
}

const auth =
getAuth(app);

const db =
getFirestore(app);


/* المتغيرات */

let currentUser = null;

let currentRoom = "general";

let usersCache = {};

let roomsCache = {};


/* إظهار شاشة الدخول */

window.showAuth =
function(type){

document
.getElementById("loginForm")
.classList
.remove("active");

document
.getElementById("registerForm")
.classList
.remove("active");

document
.getElementById("guestForm")
.classList
.remove("active");

document
.getElementById("loginTab")
.classList
.remove("active");

document
.getElementById("registerTab")
.classList
.remove("active");

document
.getElementById("guestTab")
.classList
.remove("active");


if(type === "login"){

document
.getElementById("loginForm")
.classList
.add("active");

document
.getElementById("loginTab")
.classList
.add("active");

}else if(type === "register"){

document
.getElementById("registerForm")
.classList
.add("active");

document
.getElementById("registerTab")
.classList
.add("active");

}else if(type === "guest"){

document
.getElementById("guestForm")
.classList
.add("active");

document
.getElementById("guestTab")
.classList
.add("active");

}

};


/* إنشاء حساب */

window.register =
async function(){

const name =
document
.getElementById("registerName")
.value
.trim();

const email =
document
.getElementById("registerEmail")
.value
.trim();

const password =
document
.getElementById("registerPassword")
.value;


if(!name || !email || !password){

alert("أكمل جميع البيانات");

return;

}


try{

const result =
await createUserWithEmailAndPassword(
auth,
email,
password
);


const isOwner =
email.toLowerCase() ===
OWNER_EMAIL.toLowerCase();


await setDoc(
doc(db,"users",result.user.uid),
{

name:name,

email:email,

rank:isOwner
? "🏆 الكأس الذهبي اللامع"
: "👤 عضو",

role:isOwner
? "owner"
: "member",

points:isOwner
? 99999
: 0,

level:isOwner
? 99
: 1,

avatar:"",

cover:"",

banned:false,

muted:false,

createdAt:serverTimestamp()

}
);


}catch(error){

alert(error.message);

}

};


/* تسجيل الدخول */

window.login =
async function(){

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

alert("تعذر تسجيل الدخول: " +
error.message);

}

};


/* زائر */

window.guestLogin =
async function(){

const name =
document
.getElementById("guestName")
.value
.trim();

const age =
document
.getElementById("guestAge")
.value
.trim();

const gender =
document
.getElementById("guestGender")
.value;

if(!name || !age || !gender){

alert("أكمل الاسم المستعار والعمر والجنس");

return;

}

if(name.length < 2){

alert("الاسم المستعار يجب أن يكون حرفين أو أكثر");

return;

}

if(Number(age) < 1 || Number(age) > 120){

alert("أدخل عمرًا صحيحًا");

return;

}

try{

sessionStorage.setItem(
"hassoniGuestData",
JSON.stringify({
name:name,
age:Number(age),
gender:gender
})
);

await signInAnonymously(auth);

}catch(error){

alert("تعذر دخول الزائر: " + error.message);

}

};


/* مراقبة المستخدم */

onAuthStateChanged(
auth,
async firebaseUser => {

if(!firebaseUser){

document
.getElementById("app")
.style.display = "none";

document
.getElementById("authScreen")
.style.display = "flex";

currentUser = null;

return;

}


document
.getElementById("authScreen")
.style.display = "none";

document
.getElementById("app")
.style.display = "block";


if(firebaseUser.isAnonymous){

let guestData = {};

try{

guestData =
JSON.parse(
sessionStorage.getItem(
"hassoniGuestData"
)
) || {};

}catch(error){

guestData = {};

}

currentUser = {

uid:firebaseUser.uid,

name:
guestData.name ||
"زائر " +
Math.floor(
Math.random()*9999
),

age:
guestData.age ||
"",

gender:
guestData.gender ||
"",

rank:"👤 زائر",

role:"guest",

points:0,

level:1,

avatar:"",

cover:""

};

}else{

const userRef =
doc(
db,
"users",
firebaseUser.uid
);

const userSnap =
await getDoc(userRef);


if(userSnap.exists()){

currentUser = {

uid:firebaseUser.uid,

...userSnap.data()

};

}else{

currentUser = {

uid:firebaseUser.uid,

name:"عضو",

rank:"👤 عضو",

role:"member",

points:0,

level:1,

avatar:"",

cover:""

};

}

}


/* تأكيد المالك بالبريد */

if(
firebaseUser.email &&
firebaseUser.email
.toLowerCase() ===
OWNER_EMAIL.toLowerCase()
){

currentUser.role =
"owner";

currentUser.rank =
"🏆 الكأس الذهبي اللامع";

document
.getElementById("adminButton")
.style.display =
"inline-block";

document
.getElementById("createRoomButton")
.style.display =
"inline-block";

}else{

document
.getElementById("adminButton")
.style.display =
"none";

document
.getElementById("createRoomButton")
.style.display =
"none";

}


listenRooms();

listenUsers();

listenMessages();

}
);


/* مراقبة الغرف */

function listenRooms(){

onSnapshot(
collection(db,"rooms"),
snapshot => {

roomsCache = {};

snapshot.forEach(room => {

roomsCache[room.id] =
room.data();

});


renderRooms();

}
);

}


/* عرض الغرف */

function renderRooms(){

const container =
document
.getElementById("roomsList");

container.innerHTML = "";


/* الغرفة العامة */

const general =
document.createElement("button");

general.className =
"roomItem" +
(currentRoom === "general"
? " active"
: "");

general.textContent =
"💬 الغرفة العامة";

general.onclick =
()=>{

currentRoom = "general";

document
.getElementById("currentRoomName")
.textContent =
"💬 الغرفة العامة";

renderRooms();

listenMessages();

};

container.appendChild(general);


/* الغرف الأخرى */

Object.keys(roomsCache)
.forEach(id => {

const room =
roomsCache[id];

const button =
document.createElement("button");

button.className =
"roomItem" +
(currentRoom === id
? " active"
: "");

button.textContent =
"🏠 " +
room.name;

button.onclick =
()=>{

currentRoom = id;

document
.getElementById("currentRoomName")
.textContent =
"🏠 " +
room.name;

renderRooms();

listenMessages();

};

container.appendChild(button);

});

}


/* إنشاء غرفة */

window.createRoomPrompt =
async function(){

if(
currentUser.role !== "owner"
){

return;

}


const name =
prompt("اكتب اسم الغرفة");


if(!name){

return;

}


await addDoc(
collection(db,"rooms"),
{

name:name,

createdBy:
currentUser.uid,

createdAt:
serverTimestamp()

}
);

};


/* مراقبة الأعضاء */

function listenUsers(){

onSnapshot(
collection(db,"users"),
snapshot => {

usersCache = {};

snapshot.forEach(user => {

usersCache[user.id] =
user.data();

});


renderMembers();

}
);

}


/* عرض الأعضاء */

function renderMembers(){

const container =
document
.getElementById("membersList");

container.innerHTML = "";


Object.keys(usersCache)
.forEach(uid => {

const user =
usersCache[uid];

if(user.banned){

return;

}


const div =
document.createElement("div");

div.className =
"member";


const avatar =
user.avatar
? user.avatar
: "";


div.innerHTML =

`<img class="memberAvatar"
src="${avatar}"
onerror="this.style.display='none'">

<div class="memberData">

<div class="memberName">
${escapeHtml(user.name)}
</div>

<span class="rankBadge
${user.role === 'owner'
? 'ownerRank'
: ''}">

${escapeHtml(user.rank)}

</span>

</div>`;


container
.appendChild(div);

});

}


/* مراقبة الرسائل */

let unsubscribeMessages =
null;


function listenMessages(){

if(unsubscribeMessages){

unsubscribeMessages();

}


const messagesRef =
collection(
db,
"rooms",
currentRoom,
"messages"
);


const q =
query(
messagesRef,
orderBy("createdAt","asc")
);


unsubscribeMessages =
onSnapshot(
q,
snapshot => {

const container =
document
.getElementById("messages");

container.innerHTML = "";


snapshot.forEach(message => {

const data =
message.data();

const div =
document.createElement("div");

div.className =
"message";


const avatar =
data.avatar || "";


div.innerHTML =

`<div class="messageTop">

<img
class="messageAvatar"
src="${avatar}"
onerror="this.style.display='none'">

<div>

<div class="messageName">

${escapeHtml(data.name)}

<span class="rankBadge
${data.role === 'owner'
? 'ownerRank'
: ''}">

${escapeHtml(data.rank)}

</span>

</div>

</div>

</div>

<div class="messageText">

${escapeHtml(data.text)}

</div>`;


container
.appendChild(div);

});


container.scrollTop =
container.scrollHeight;

}
);

}


/* إرسال رسالة */

window.sendMessage =
async function(){

const input =
document
.getElementById("messageInput");

const text =
input.value.trim();


if(!text){

return;

}


if(currentUser.muted){

alert("أنت مكتوم");

return;

}


await addDoc(
collection(
db,
"rooms",
currentRoom,
"messages"
),
{

text:text,

name:currentUser.name,

rank:currentUser.rank,

role:currentUser.role,

avatar:currentUser.avatar || "",

createdAt:
serverTimestamp()

}
);


input.value = "";


/* زيادة النقاط */

if(
currentUser.role ===
"member"
){

const newPoints =
(currentUser.points || 0)
+ 5;

const newLevel =
Math.floor(
newPoints / 100
) + 1;


currentUser.points =
newPoints;

currentUser.level =
newLevel;


await updateDoc(
doc(
db,
"users",
currentUser.uid
),
{

points:newPoints,

level:newLevel

}
);

}

};


/* البروفايل */

window.openProfile =
function(){

document
.getElementById("profileModal")
.style.display =
"block";


document
.getElementById("profileName")
.textContent =
currentUser.name;


document
.getElementById("profileRank")
.innerHTML =
currentUser.rank;


document
.getElementById("profilePoints")
.textContent =
currentUser.points || 0;


document
.getElementById("profileLevel")
.textContent =
currentUser.level || 1;


document
.getElementById("profileAvatar")
.src =
currentUser.avatar || "";


document
.getElementById("profileCover")
.style.backgroundImage =
currentUser.cover
? `url('${currentUser.cover}')`
: "";


document
.getElementById("avatarUrl")
.value =
currentUser.avatar || "";


document
.getElementById("coverUrl")
.value =
currentUser.cover || "";

};


/* حفظ البروفايل */

window.saveProfile =
async function(){

if(
currentUser.role ===
"guest"
){

alert(
"الزائر لا يستطيع حفظ بروفايل"
);

return;

}


const avatar =
document
.getElementById("avatarUrl")
.value
.trim();

const cover =
document
.getElementById("coverUrl")
.value
.trim();


await updateDoc(
doc(db,"users",currentUser.uid),
{

avatar:avatar,

cover:cover

}
);


currentUser.avatar =
avatar;

currentUser.cover =
cover;


alert("تم حفظ البروفايل");

openProfile();

};


/* لوحة التحكم */

window.openAdmin =
function(){

if(
currentUser.role !==
"owner"
){

return;

}


document
.getElementById("adminModal")
.style.display =
"block";


renderAdmin();

};


function renderAdmin(){

const usersContainer =
document
.getElementById("adminUsers");

const giftSelect =
document
.getElementById("giftUser");


usersContainer.innerHTML = "";

giftSelect.innerHTML = "";


let count = 0;


Object.keys(usersCache)
.forEach(uid => {

const user =
usersCache[uid];

count++;


const option =
document.createElement("option");

option.value = uid;

option.textContent =
user.name;

giftSelect
.appendChild(option);


const div =
document.createElement("div");

div.className =
"adminUser";


div.innerHTML =

`<b>
${escapeHtml(user.name)}
</b>

<br>

${escapeHtml(user.rank)}

<br>

نقاط:
${user.points || 0}

<div class="adminActions">

<button
class="danger"
onclick="banUser('${uid}')">

حظر

</button>

<button
class="warning"
onclick="muteUser('${uid}',true)">

كتم

</button>

<button
class="success"
onclick="muteUser('${uid}',false)">

إلغاء الكتم

</button>

<button
class="danger"
onclick="kickUser('${uid}')">

طرد

</button>

</div>`;


usersContainer
.appendChild(div);

});


document
.getElementById("stats")
.textContent =
"عدد الأعضاء: " +
count;

}


/* إهداء رتبة */

window.giftRank =
async function(){

const uid =
document
.getElementById("giftUser")
.value;

const rank =
document
.getElementById("giftRank")
.value;


if(!uid){

return;

}


await updateDoc(
doc(db,"users",uid),
{

rank:rank

}
);


alert("تم إهداء الرتبة");

};


/* حظر */

window.banUser =
async function(uid){

if(
!confirm("حظر هذا العضو؟")
){

return;

}


await updateDoc(
doc(db,"users",uid),
{

banned:true

}
);

};


/* كتم */

window.muteUser =
async function(
uid,
state
){

await updateDoc(
doc(db,"users",uid),
{

muted:state

}
);

};


/* طرد */

window.kickUser =
async function(uid){

alert(
"تم طرد العضو. سيحتاج إلى تسجيل الدخول من جديد."
);

await updateDoc(
doc(db,"users",uid),
{

kickedAt:
serverTimestamp()

}
);

};


/* إغلاق النوافذ */

window.closeModal =
function(id){

document
.getElementById(id)
.style.display =
"none";

};


/* خروج */

window.logout =
async function(){

sessionStorage.removeItem(
"hassoniGuestData"
);

await signOut(auth);

};


/* حماية النصوص */

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>
