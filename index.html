<!DOCTYPE html>

  <!-- Tailwind CSS CDN -->

  <!-- React & ReactDOM CDN -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (لتشغيل كود React مباشرة دون الحاجة لبناء أو سيرفر خارجي) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti للاحتفالات -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Firebase SDK Compat v10 المباشر -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
    * {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    @keyframes pulseGlow {
      0%, 100% { 
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.95), 0 0 30px rgba(245, 158, 11, 0.7); 
      }
      50% { 
        box-shadow: 0 0 25px rgba(255, 255, 255, 1), 0 0 50px rgba(245, 158, 11, 0.95); 
      }
    }
    .white-glowing-cup {
      animation: pulseGlow 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-black text-slate-100 flex justify-center min-h-screen select-none">

  <!-- Root Div for React -->
  <div id="root" class="w-full max-w-md min-h-screen bg-[#07070a] border-x border-zinc-850 shadow-2xl flex flex-col relative"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==================== 1. FIREBASE CONFIG & INIT ====================
    const firebaseConfig = {
      apiKey: "AIzaSyAFjspoGwJJeowjEZrcmJCO99iiTcBR5Is",
      authDomain: "hassouni-chat-51234.firebaseapp.com",
      projectId: "hassouni-chat-51234",
      storageBucket: "hassouni-chat-51234.firebasestorage.app",
      messagingSenderId: "519124989339",
      appId: "1:519124989339:web:2619c6d8c0488cdbd89d3e",
      measurementId: "G-E4QVC93P2R"
    };

    let auth = null;
    let db = null;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase initialization notice:", e);
    }

    // ==================== 2. SOUND EFFECTS ====================
    const playAudio = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'crown') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } else if (type === 'gift') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else {
          osc.frequency.setValueAtTime(650, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        }
      } catch (e) {}
    };

    // ==================== 3. CONSTANTS & DATA ====================
    const INITIAL_ROOMS = [
      { id: 'general', name: 'الغرفـــة || العـامـــة 🌸', desc: 'الروم الرئيسي لجميع الأعضاء والزوار', icon: '👑' },
      { id: 'elite', name: 'ملتقى النخبه 💎', desc: 'غرفة أصحاب الكؤوس الذهبية', icon: '💎' },
      { id: 'legends', name: 'عظماء النخبه 👑', desc: 'غرفة خاصة بكبار الشخصيات', icon: '🏆' },
      { id: 'games', name: 'المسابقات والجوائز 🎮', desc: 'تحديات وجوائز ذهب وروبي', icon: '🎲' },
      { id: 'jail', name: 'السجن التأديبي 🔒', desc: 'غرفة الموقوفين والمخالفين', icon: '⛓️' }
    ];

    const STORE_GIFTS = [
      { id: 'g1', name: 'تاج الملوك', icon: '👑', price: 5000 },
      { id: 'g2', name: 'الماسة الزرقاء', icon: '💎', price: 3000 },
      { id: 'g3', name: 'باقة ورد فاخرة', icon: '💐', price: 500 },
      { id: 'g4', name: 'قلب أحمر مشع', icon: '❤️', price: 200 },
      { id: 'g5', name: 'سيارة رياضية', icon: '🏎️', price: 10000 },
      { id: 'g6', name: 'كأس الذهب الملكي', icon: '🏆', price: 8000 }
    ];

    const NAME_PALETTES = [
      { id: 'p1', name: 'الملكي الذهبي', class: 'from-amber-500 via-yellow-400 to-amber-600' },
      { id: 'p2', name: 'الياقوت الأزرق', class: 'from-blue-600 via-cyan-500 to-indigo-700' },
      { id: 'p3', name: 'الوردي الفاخر', class: 'from-pink-600 via-rose-500 to-purple-600' },
      { id: 'p4', name: 'الزمرد الأخضر', class: 'from-emerald-600 via-teal-500 to-green-700' },
      { id: 'p5', name: 'الليلي الفحمي', class: 'from-zinc-900 via-stone-800 to-zinc-900' }
    ];

    // --- Cup Badge Component ---
    function CupBadge({ type }) {
      if (type === 'none' || !type) return null;
      if (type === 'white_glowing') {
        return (
          <div className="white-glowing-cup inline-flex items-center justify-center rounded-full bg-gradient-to-tr from-white via-slate-100 to-slate-200 text-amber-500 border-2 border-white w-5 h-5 text-[10px] shadow-lg" title="الكأس الأبيض اللامع - صاحب الموقع">
            👑
          </div>
        );
      }
      if (type === 'gold') {
        return (
          <div className="inline-flex items-center justify-center rounded-full bg-gradient-to-tr from-amber-600 via-yellow-400 to-amber-200 text-black border border-yellow-300 w-5 h-5 text-[9px] shadow" title="كأس الذهب">
            🏆
          </div>
        );
      }
      if (type === 'diamond') {
        return (
          <div className="inline-flex items-center justify-center rounded-full bg-gradient-to-tr from-cyan-600 to-blue-500 text-white border border-cyan-300 w-5 h-5 text-[9px] shadow" title="الرتبة الماسية">
            💎
          </div>
        );
      }
      return null;
    }

    // ==================== 4. MAIN APP COMPONENT ====================
    function App() {
      // Check saved user in localStorage
      const getSavedUser = () => {
        try {
          const s = localStorage.getItem('hassouni_chat_user');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return null;
      };

      const [currentUser, setCurrentUser] = useState(getSavedUser());
      const [users, setUsers] = useState([]);
      const [messages, setMessages] = useState([]);
      const [currentRoomId, setCurrentRoomId] = useState('general');
      const [inputText, setInputText] = useState('');
      const [isMuted, setIsMuted] = useState(false);
      const [isPlayingMusic, setIsPlayingMusic] = useState(true);

      // Mic Slots
      const [micSlots, setMicSlots] = useState([
        { slot: 1, user: null, isSpeaking: false },
        { slot: 2, user: null, isSpeaking: false },
        { slot: 3, user: null, isSpeaking: false },
        { slot: 4, user: null, isSpeaking: false },
      ]);

      // Modals
      const [showLogin, setShowLogin] = useState(!currentUser);
      const [showProfile, setShowProfile] = useState(false);
      const [selectedUser, setSelectedUser] = useState(null);
      const [showRooms, setShowRooms] = useState(false);
      const [showStore, setShowStore] = useState(false);
      const [showGifts, setShowGifts] = useState(false);
      const [showAdmin, setShowAdmin] = useState(false);
      const [showUsersModal, setShowUsersModal] = useState(false);
      const [showDrawer, setShowDrawer] = useState(false);

      // Login form states (EMPTY by default - owner fills them)
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [registerName, setRegisterName] = useState('');
      const [guestName, setGuestName] = useState('');
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [isGuestMode, setIsGuestMode] = useState(false);
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginError, setLoginError] = useState('');

      // Customization Profile
      const [customName, setCustomName] = useState('');
      const [customPalette, setCustomPalette] = useState('from-amber-500 via-yellow-400 to-amber-600');
      const [customStatus, setCustomStatus] = useState('');

      // Admin State
      const [adminTargetId, setAdminTargetId] = useState('');
      const [adminGold, setAdminGold] = useState(5000);
      const [adminRubies, setAdminRubies] = useState(100);
      const [adminBroadcast, setAdminBroadcast] = useState('');

      const currentRoom = INITIAL_ROOMS.find(r => r.id === currentRoomId) || INITIAL_ROOMS[0];

      // ==================== 5. FIREBASE SYNC LISTENERS ====================
      // A. Real-time Messages Sync
      useEffect(() => {
        if (!db) return;
        try {
          const unsub = db.collection('rooms').doc(currentRoomId).collection('messages')
            .orderBy('createdAt', 'asc')
            .limit(100)
            .onSnapshot((snapshot) => {
              if (snapshot) {
                const liveMsgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setMessages(liveMsgs);
              }
            }, (err) => console.warn('Messages listener:', err));

          return () => unsub();
        } catch (e) {}
      }, [currentRoomId]);

      // B. Real-time Online Users Sync (Real users only)
      useEffect(() => {
        if (!db) return;
        try {
          const unsub = db.collection('users').onSnapshot((snapshot) => {
            if (snapshot) {
              const liveUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setUsers(liveUsers);
            }
          }, (err) => console.warn('Users listener:', err));

          return () => unsub();
        } catch (e) {}
      }, []);

      // C. Update Current User Presence
      useEffect(() => {
        if (!currentUser || !db) return;
        try {
          db.collection('users').doc(currentUser.id).set({
            ...currentUser,
            isOnline: true,
            currentRoomId: currentRoomId,
            lastSeen: new Date().toISOString()
          }, { merge: true }).catch(() => {});
        } catch (e) {}
      }, [currentUser, currentRoomId]);

      // ==================== 6. HANDLERS ====================
      const handleSendMessage = () => {
        if (!inputText.trim()) return;
        if (!currentUser) return setShowLogin(true);

        const newMsg = {
          roomId: currentRoomId,
          userId: currentUser.id,
          userName: currentUser.name,
          userDecoratedName: currentUser.decoratedName,
          userAvatar: currentUser.avatar,
          userLevel: currentUser.level || 1,
          userCup: currentUser.cupType || 'none',
          userRole: currentUser.role || 'member',
          nameBgGradient: currentUser.nameBgGradient || 'from-amber-600 to-yellow-600',
          textColor: currentUser.nameTextColor || '#ffffff',
          content: inputText.trim(),
          timestamp: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
          type: 'text',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (db) {
          db.collection('rooms').doc(currentRoomId).collection('messages').add(newMsg).catch(() => {});
        } else {
          setMessages(prev => [...prev, { id: 'local_' + Date.now(), ...newMsg }]);
        }

        setInputText('');
        playAudio('msg');
      };

      const handleUpdateUser = (userId, updates) => {
        if (currentUser && currentUser.id === userId) {
          const updated = { ...currentUser, ...updates };
          setCurrentUser(updated);
          localStorage.setItem('hassouni_chat_user', JSON.stringify(updated));
        }
        if (db) {
          db.collection('users').doc(userId).set(updates, { merge: true }).catch(() => {});
        }
      };

      // File upload for profile/cover
      const handleFileChange = (e, field) => {
        const file = e.target.files?.[0];
        if (file && currentUser) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const res = event.target?.result;
            if (res) {
              handleUpdateUser(currentUser.id, { [field]: res });
              if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });
              alert('تم رفع وتحديث الصورة بنجاح! ✨');
            }
          };
          reader.readAsDataURL(file);
        }
      };

      // Auth Handler (Detects owner email & password accurately)
      const handleAuth = async (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginLoading(true);

        const cleanEmail = loginEmail.trim().toLowerCase();
        const cleanPass = loginPassword.trim();

        // 1. Check Owner Credentials
        if ((cleanEmail === 'ghrwrkk2@gmamil.com' || cleanEmail === 'ghrwrkk2@gmail.com') && cleanPass === '780718519') {
          const ownerUser = {
            id: 'owner_primary',
            email: loginEmail.trim(),
            name: 'الـمـالـك (صاحب الموقع)',
            decoratedName: '👑 ⚡ الـمـالـك || صاحب الشات ⚡ 👑',
            avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80',
            coverImage: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800',
            customBackground: '',
            role: 'owner',
            roleTitle: '👑 صاحب الموقع والتحكم الكامل',
            cupType: 'white_glowing',
            level: 999,
            gold: 999999,
            rubies: 99999,
            status: 'المالك والمؤسس العام - جميع الصلاحيات مفعلة ⚡👑',
            likes: 9999,
            nameBgGradient: 'from-amber-500 via-yellow-400 to-amber-600',
            isOnline: true,
            currentRoomId: 'general'
          };

          if (db) db.collection('users').doc('owner_primary').set(ownerUser, { merge: true }).catch(() => {});
          localStorage.setItem('hassouni_chat_user', JSON.stringify(ownerUser));
          setCurrentUser(ownerUser);
          setShowLogin(false);
          playAudio('crown');
          if (window.confetti) window.confetti({ particleCount: 160, spread: 90, origin: { y: 0.5 } });
          alert('أهلاً بك يا صاحب الموقع في شات حسوني! تم تفعيل رتبة الكأس الأبيض والتحكم الكامل 👑✨');
          setLoginLoading(false);
          return;
        }

        // 2. Standard User / Register
        try {
          let uid = 'user_' + Date.now();
          if (auth) {
            if (isRegisterMode) {
              const cred = await auth.createUserWithEmailAndPassword(cleanEmail, cleanPass);
              uid = cred.user.uid;
            } else {
              const cred = await auth.signInWithEmailAndPassword(cleanEmail, cleanPass);
              uid = cred.user.uid;
            }
          }

          const userName = isRegisterMode && registerName.trim() ? registerName.trim() : cleanEmail.split('@')[0];
          const standardUser = {
            id: uid,
            email: cleanEmail,
            name: userName,
            decoratedName: `✨ ${userName} ✨`,
            avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200',
            role: 'member',
            roleTitle: 'عضو مسجل 🌸',
            cupType: 'none',
            level: 1,
            gold: 500,
            rubies: 10,
            status: 'أهلاً بكم في شات حسوني 🌹',
            likes: 1,
            nameBgGradient: 'from-indigo-900 to-purple-900',
            isOnline: true,
            currentRoomId: 'general'
          };

          if (db) db.collection('users').doc(uid).set(standardUser, { merge: true }).catch(() => {});
          localStorage.setItem('hassouni_chat_user', JSON.stringify(standardUser));
          setCurrentUser(standardUser);
          setShowLogin(false);
        } catch (err) {
          setLoginError(err.message || 'خطأ في تسجيل الدخول');
        } finally {
          setLoginLoading(false);
        }
      };

      // Guest Login Handler
      const handleGuestLogin = (e) => {
        e.preventDefault();
        const chosen = guestName.trim() || `زائر_${Math.floor(1000 + Math.random() * 9000)}`;
        const guestId = 'guest_' + Date.now();

        const guestUser = {
          id: guestId,
          email: `${guestId}@guest.chat`,
          name: chosen,
          decoratedName: `👤 ${chosen}`,
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200',
          role: 'guest',
          roleTitle: 'زائر في الشات 🌸',
          cupType: 'none',
          level: 1,
          gold: 200,
          rubies: 5,
          status: 'مرحباً بكم جميعاً 🌹',
          likes: 1,
          nameBgGradient: 'from-zinc-800 to-zinc-900',
          isOnline: true,
          currentRoomId: 'general'
        };

        if (db) db.collection('users').doc(guestId).set(guestUser).catch(() => {});
        localStorage.setItem('hassouni_chat_user', JSON.stringify(guestUser));
        setCurrentUser(guestUser);
        setShowLogin(false);
      };

      const onlineCount = users.filter(u => u.isOnline).length || (currentUser ? 1 : 0);

      return (
        <div className="flex flex-col min-h-screen w-full bg-[#07070a] text-white relative">
          
          {/* ================= TOP HEADER (Screenshot Match) ================= */}
          <header className="bg-[#0c0d12] border-b border-zinc-800/80 px-2 py-2 flex items-center justify-between sticky top-0 z-40">
            <div className="flex items-center gap-1.5">
              {currentUser?.role === 'owner' ? (
                <button onClick={() => setShowAdmin(true)} className="px-3 py-1 bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-black text-xs rounded-xl shadow flex items-center gap-1">
                  <span>المالك 🛡️</span>
                </button>
              ) : (
                <button onClick={() => setShowLogin(true)} className="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-amber-400 font-bold text-xs rounded-xl border border-zinc-700">
                  دخول 🔐
                </button>
              )}

              <button onClick={() => alert('لا توجد إشعارات جديدة')} className="flex flex-col items-center justify-center p-1 text-zinc-400 hover:text-white">
                <span className="text-xs">🔔</span>
                <span className="text-[9px]">إشعار</span>
              </button>

              <button onClick={() => alert('طلبات الصداقة')} className="flex flex-col items-center justify-center p-1 text-zinc-400 hover:text-white">
                <span className="text-xs">👥</span>
                <span className="text-[9px]">طلب</span>
              </button>

              <button onClick={() => alert('الرسائل الخاصة')} className="flex flex-col items-center justify-center p-1 text-zinc-400 hover:text-white">
                <span className="text-xs">✉️</span>
                <span className="text-[9px]">رسالة</span>
              </button>
            </div>

            <div className="flex items-center gap-1.5">
              <button onClick={() => setShowUsersModal(true)} className="flex flex-col items-center justify-center p-1 text-amber-400">
                <span className="text-xs">👑</span>
                <span className="text-[9px] font-bold">الأثرياء</span>
              </button>

              <button onClick={() => setShowUsersModal(true)} className="flex flex-col items-center justify-center p-1 text-yellow-400">
                <span className="text-xs">💎</span>
                <span className="text-[9px] font-bold">الكبار</span>
              </button>

              <button onClick={() => { playAudio('msg'); alert('تم تحديث بيانات الغرفة 🔄'); }} className="flex flex-col items-center justify-center p-1 text-zinc-400 hover:text-white">
                <span className="text-xs">🔄</span>
                <span className="text-[9px]">تحديث</span>
              </button>

              <button onClick={() => setShowDrawer(true)} className="p-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-zinc-300 mr-1">
                ☰
              </button>
            </div>
          </header>

          {/* ================= MIC SLOTS & DJ PLAYER ================= */}
          <div className="p-2.5 bg-zinc-950 border-b border-zinc-850">
            <div className="grid grid-cols-4 gap-2">
              {micSlots.map(s => (
                <div key={s.slot} className={`flex flex-col items-center p-2 rounded-2xl border ${s.user ? 'bg-zinc-900 border-amber-500/60 shadow' : 'bg-zinc-900/40 border-dashed border-zinc-800'}`}>
                  {s.user ? (
                    <div className="relative cursor-pointer" onClick={() => { setSelectedUser(s.user); setShowProfile(true); }}>
                      <img src={s.user.avatar} className="w-11 h-11 rounded-full object-cover border-2 border-amber-400" />
                      {s.isSpeaking && <span className="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 rounded-full flex items-center justify-center text-[8px]">🎙️</span>}
                    </div>
                  ) : (
                    <button 
                      onClick={() => {
                        if (!currentUser) return setShowLogin(true);
                        setMicSlots(prev => prev.map(m => m.slot === s.slot ? { ...m, user: currentUser, isSpeaking: true } : m));
                      }}
                      className="w-11 h-11 rounded-full border border-zinc-700 bg-zinc-800/80 flex items-center justify-center text-zinc-400 hover:text-amber-400"
                    >
                      🎙️
                    </button>
                  )}
                  <span className="text-[10px] font-bold text-zinc-300 mt-1 truncate max-w-full">
                    {s.user ? s.user.name : `مايك ${s.slot}`}
                  </span>
                </div>
              ))}
            </div>

                  <button
                    onClick={() => {
                      if (!adminBroadcast.trim()) return;
                      const bMsg = {
                        roomId: currentRoomId,
                        userId: currentUser.id,
                        userName: currentUser.name,
                        content: adminBroadcast.trim(),
                        timestamp: new Date().toLocaleTimeString('ar-EG'),
                        type: 'admin_announcement',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                      };
                      if (db) db.collection('rooms').doc(currentRoomId).collection('messages').add(bMsg);
                      setAdminBroadcast('');
                      playAudio('crown');
                      alert('تم بث الإعلان لجميع الغرف 📢');
                    }}
                    className="w-full py-2 bg-red-600 text-white font-black rounded-xl"
                  >
                    بث الإعلان الآن 📢
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 5: ROOMS ================= */}
          {showRooms && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl w-full max-w-sm p-4 space-y-2 text-xs">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <button onClick={() => setShowRooms(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-amber-300">قائمة الغرف 🚪</h3>
                </div>
                {INITIAL_ROOMS.map(r => (
                  <div
                    key={r.id}
                    onClick={() => { setCurrentRoomId(r.id); setShowRooms(false); }}
                    className={`p-3 rounded-2xl border cursor-pointer flex items-center justify-between ${currentRoomId === r.id ? 'bg-amber-950/40 border-amber-400 text-yellow-300' : 'bg-zinc-900 border-zinc-800 text-zinc-300'}`}
                  >
                    <div>
                      <h4 className="font-bold text-xs">{r.name}</h4>
                      <p className="text-[10px] text-zinc-400">{r.desc}</p>
                    </div>
                    <span className="text-xl">{r.icon}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ================= MODAL 6: STORE ================= */}
          {showStore && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl w-full max-w-sm p-4 space-y-3 text-xs">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <button onClick={() => setShowStore(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-amber-300">متجر حسوني 🪙</h3>
                </div>
                <div className="flex justify-between bg-zinc-900 p-2.5 rounded-xl border border-zinc-800 font-bold">
                  <span>رصيدك: {currentUser?.gold || 0} 🪙</span>
                  <span>روبي: {currentUser?.rubies || 0} 💎</span>
                </div>
                <div className="p-2.5 bg-zinc-900 rounded-xl flex items-center justify-between border border-zinc-800">
                  <div>
                    <span className="font-bold block text-white">الهدية اليومية المجانية 🎁</span>
                    <span className="text-[10px] text-zinc-400">+100 ذهب مجاني يومياً</span>
                  </div>
                  <button
                    onClick={() => {
                      if (!currentUser) return setShowLogin(true);
                      handleUpdateUser(currentUser.id, { gold: (currentUser.gold || 0) + 100 });
                      playAudio('gift');
                      alert('تم استلام 100 ذهب مجاناً! 🪙');
                    }}
                    className="px-3 py-1.5 bg-amber-500 text-black font-black rounded-lg"
                  >
                    استلام
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL 7: GIFTS ================= */}
          {showGifts && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-950 border border-pink-500/50 rounded-3xl w-full max-w-sm p-4 space-y-3 text-xs">
                <div className="flex items-center justify-between border-b border-pink-900/50 pb-2">
                  <button onClick={() => setShowGifts(false)} className="text-zinc-400">✕</button>
                  <h3 className="font-black text-sm text-pink-300">إرسال هدية مميزة 🎁</h3>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {STORE_GIFTS.map(g => (
                    <button
                      key={g.id}
                      onClick={() => {
                        if (!currentUser) return setShowLogin(true);
                        if ((currentUser.gold || 0) < g.price) return alert('رصيدك من الذهب لا يكفي!');
                        handleUpdateUser(currentUser.id, { gold: currentUser.gold - g.price });
                        const giftMsg = {
                          roomId: currentRoomId,
                          userId: currentUser.id,
                          userName: currentUser.name,
                          content: `أهدى ${g.name} ${g.icon}`,
                          timestamp: new Date().toLocaleTimeString('ar-EG'),
                          type: 'gift',
                          giftData: { giftName: g.name, giftIcon: g.icon, receiverName: 'الجميع' },
                          createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        if (db) db.collection('rooms').doc(currentRoomId).collection('messages').add(giftMsg);
                        setShowGifts(false);
                        playAudio('gift');
                        if (window.confetti) window.confetti();
                        alert(`تم إرسال هدية ${g.name} بنجاح!`);
                      }}
                      className="p-2 bg-zinc-900 border border-zinc-800 hover:border-pink-500 rounded-xl flex flex-col items-center gap-1"
                    >
                      <span className="text-2xl">{g.icon}</span>
                      <span className="font-bold text-[10px]">{g.name}</span>
                      <span className="text-amber-400 font-extrabold text-[9px]">{g.price} 🪙</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ================= SIDE DRAWER ================= */}
          {showDrawer && (
            <div className="fixed inset-0 z-50 bg-black/70 flex justify-start">
              <div className="bg-zinc-950 border-l border-zinc-800 w-72 h-full p-4 flex flex-col justify-between text-xs">
                <div className="space-y-4">
                  <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                    <button onClick={() => setShowDrawer(false)} className="text-zinc-400">✕</button>
                    <h3 className="font-black text-amber-400">شات حسوني 👑</h3>
                  </div>
                  <div className="space-y-1 text-right">
                    <button onClick={() => { setShowRooms(true); setShowDrawer(false); }} className="w-full p-2.5 rounded-xl bg-zinc-900 font-bold flex items-center justify-between">
                      <span>قائمة الرومات</span>
                      <span>🚪</span>
                    </button>
                    <button onClick={() => { setShowStore(true); setShowDrawer(false); }} className="w-full p-2.5 rounded-xl bg-zinc-900 font-bold flex items-center justify-between">
                      <span>المتجر والذهب</span>
                      <span>🪙</span>
                    </button>
                    {currentUser?.role === 'owner' && (
                      <button onClick={() => { setShowAdmin(true); setShowDrawer(false); }} className="w-full p-2.5 rounded-xl bg-amber-950/40 border border-amber-500/50 font-bold text-amber-300 flex items-center justify-between">
                        <span>لوحة تحكم صاحب الموقع 👑</span>
                        <span>🛡️</span>
                      </button>
                    )}
                  </div>
                </div>
                <div className="border-t border-zinc-800 pt-3 text-[10px] text-zinc-500 text-center font-mono">
                  Hassouni Chat v4.0.0
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render to Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
